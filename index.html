<style>
:root{
 --indigo:#2B2D42;--lavender:#8D99AE;--platinum:#EDF2F4;--punch:#EF233C;--flag:#D90429;
 --bg:#EDF2F4;--surface:#FFFFFF;--surface-2:#E3E9ED;--ink:#2B2D42;--ink-2:#555F78;--edge:#D5DCE4;--line:#DBE1E8;--bd:#B7C0CE;
 --accent:#2B2D42;--accent-ink:#FFFFFF;--accent-soft:#E2E7EF;--hi:#EF233C;--hi-soft:#FCE3E7;
 --good:#2E7D5B;--good-soft:#DDF1E7;--bad:#D90429;--bad-soft:#FCE3E7;--info:#5C6B8C;--info-soft:#E6EAF0;
 --lv1:#3B4F86;--lv2:#4D6A9C;--lv3:#C21A35;--cta:#D90429;--cta-ink:#FFFFFF;
 --hero-a:#DDE4EC;--hero-b:#FFFFFF;--bar:rgba(255,255,255,.86);
 --glow:rgba(239,35,60,.30);--hl:rgba(255,255,255,.75);--sh-c:rgba(43,45,66,.30);--sh-s:rgba(43,45,66,.07);
 --card-a:#FFFFFF;--card-b:#F4F7F9;--unread-a:#FFFFFF;--unread-b:#FDEEF0;--read-a:#FFFFFF;--read-b:#E6F5EE;
 --lg-b1:#3E4268;--lg-b2:#2B2D42;--lg-f:#EDF2F4;--lg-d:#EF233C;--lg-hl:.16;
 --px:'Plus Jakarta Sans',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --pg1:rgba(141,153,174,.22);--pg2:rgba(43,45,66,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#565C88;--surface:#626998;--surface-2:#6A72A4;--ink:#FFFFFF;--ink-2:#F1F4FA;--edge:#8088B4;--line:#7279A6;--bd:#959CC4;
 --accent:#FFFFFF;--accent-ink:#2B2D42;--accent-soft:#727AAE;--hi:#FF5C73;--hi-soft:#7B3C55;
 --good:#9BF0C4;--good-soft:#3F7F7C;--bad:#FFC2CB;--bad-soft:#7B3C55;--info:#F4F6FA;--info-soft:#6A72A4;
 --lv1:#E3EBFF;--lv2:#DCE8FF;--lv3:#FFC2CB;--cta:#EF233C;--cta-ink:#FFFFFF;
 --hero-a:#6E75A8;--hero-b:#626998;--bar:rgba(86,92,136,.86);
 --glow:rgba(239,35,60,.45);--hl:rgba(255,255,255,.18);--sh-c:rgba(14,16,40,.55);--sh-s:rgba(14,16,40,.2);
 --card-a:rgba(255,255,255,.13);--card-b:rgba(255,255,255,.03);--unread-a:rgba(255,255,255,.10);--unread-b:rgba(239,35,60,.20);--read-a:rgba(255,255,255,.10);--read-b:rgba(61,214,140,.26);
 --lg-b1:#EDF2F4;--lg-b2:#EDF2F4;--lg-f:#2B2D42;--lg-d:#EF233C;--lg-hl:0;--pg1:rgba(141,153,174,.38);--pg2:rgba(160,170,255,.28);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#565C88;--surface:#626998;--surface-2:#6A72A4;--ink:#FFFFFF;--ink-2:#F1F4FA;--edge:#8088B4;--line:#7279A6;--bd:#959CC4;
 --accent:#FFFFFF;--accent-ink:#2B2D42;--accent-soft:#727AAE;--hi:#FF5C73;--hi-soft:#7B3C55;
 --good:#9BF0C4;--good-soft:#3F7F7C;--bad:#FFC2CB;--bad-soft:#7B3C55;--info:#F4F6FA;--info-soft:#6A72A4;
 --lv1:#E3EBFF;--lv2:#DCE8FF;--lv3:#FFC2CB;--cta:#EF233C;--cta-ink:#FFFFFF;
 --hero-a:#6E75A8;--hero-b:#626998;--bar:rgba(86,92,136,.86);
 --glow:rgba(239,35,60,.45);--hl:rgba(255,255,255,.18);--sh-c:rgba(14,16,40,.55);--sh-s:rgba(14,16,40,.2);
 --card-a:rgba(255,255,255,.13);--card-b:rgba(255,255,255,.03);--unread-a:rgba(255,255,255,.10);--unread-b:rgba(239,35,60,.20);--read-a:rgba(255,255,255,.10);--read-b:rgba(61,214,140,.26);
 --lg-b1:#EDF2F4;--lg-b2:#EDF2F4;--lg-f:#2B2D42;--lg-d:#EF233C;--lg-hl:0;--pg1:rgba(141,153,174,.38);--pg2:rgba(160,170,255,.28);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-color:var(--bg);
 background-image:radial-gradient(900px 520px at 88% -8%,var(--pg1),transparent 62%),radial-gradient(900px 560px at -8% 8%,var(--pg2),transparent 60%);
 background-attachment:fixed;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--px);letter-spacing:-.02em;text-wrap:balance}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px;border-radius:10px}

/* ===== estructura ===== */
.page{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-bottom:64px}
.topbar{position:sticky;top:0;z-index:40;margin:0 -8px;padding:12px 16px;display:flex;align-items:center;gap:18px;background:var(--bar);
 -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-radius:0 0 22px 22px;
 box-shadow:inset 0 -1px 0 var(--edge),0 18px 34px -24px var(--sh-c)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo{width:38px;height:38px;display:block;flex:none;filter:drop-shadow(0 6px 8px rgba(14,16,40,.3))}
.logo svg{width:100%;height:100%;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.02;font-family:var(--px)}
.brand-t b{font-size:1.18rem;font-weight:800;letter-spacing:-.03em}
.brand-t i{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--hi)}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav-a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.94rem;color:var(--ink-2);white-space:nowrap;flex:none;transition:background .2s,color .2s,box-shadow .2s}
.nav-a:hover{background:var(--accent-soft);color:var(--ink)}
.nav-a.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 20px -8px var(--sh-c)}
.theme-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 1px 0 var(--hl)}
.theme-btn:hover{box-shadow:0 0 0 1.5px var(--bd),0 0 16px -2px var(--glow)}
#main{min-width:0;display:flex;flex-direction:column;gap:22px;outline:none}
#main>*{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
#main>*:nth-child(2){animation-delay:.05s}#main>*:nth-child(3){animation-delay:.1s}#main>*:nth-child(4){animation-delay:.15s}#main>*:nth-child(n+5){animation-delay:.2s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.foot{color:var(--ink-2);font-size:.86rem}

/* ===== tipografía ===== */
.h1{font-weight:800;font-size:clamp(1.7rem,2.4vw + .9rem,2.4rem);line-height:1.12}
.h1.big{font-size:clamp(2rem,3.4vw + .8rem,3.1rem);line-height:1.06;letter-spacing:-.035em;text-shadow:0 10px 24px rgba(43,45,66,.16)}
:root[data-theme="dark"] .h1.big{text-shadow:0 10px 26px rgba(14,16,40,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .h1.big{text-shadow:0 10px 26px rgba(14,16,40,.4)}}
.h1.q-big{font-size:clamp(1.5rem,2vw + .8rem,2.1rem)}
.h2{font-weight:800;font-size:1.3rem}
.sec-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-line .h2::before{content:"";display:inline-block;width:6px;height:.9em;margin-right:10px;border-radius:3px;vertical-align:-.1em;background:linear-gradient(180deg,#FF8A9B,#F2536A);box-shadow:0 0 14px rgba(242,83,106,.6)}
.lead{color:var(--ink-2);max-width:64ch;margin-top:8px;text-wrap:pretty}
.kicker{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);margin-bottom:6px}
.label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.muted{color:var(--ink-2);font-size:.95rem}
.p{max-width:68ch}
.es{font-size:1.02rem}
.pre{white-space:pre-wrap}
.lnk{font-weight:700;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-2);font-weight:600;width:max-content}
.back:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.gap{gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2.top{align-items:start}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}

/* ===== tarjetas ===== */
.card{background:linear-gradient(155deg,var(--card-a),var(--card-b));border-radius:22px;padding:22px;min-width:0;position:relative;
 box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c)}
.card.surface{background:var(--surface)}
a.card{text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
a.card:hover,.tile:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bd),0 34px 48px -24px var(--sh-c),0 0 30px -10px var(--glow)}

/* ===== botones, chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;min-height:46px;position:relative;transition:transform .12s,box-shadow .2s,filter .2s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 24px -12px var(--sh-c)}
.btn.cta{background:linear-gradient(180deg,#FF3B54,var(--cta));color:var(--cta-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 26px -10px rgba(239,35,60,.75),0 0 26px -4px var(--glow)}
.btn.bad{background:var(--bad);color:#2B2D42}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--bd)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.ghost.on{background:var(--accent-soft)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.92rem;border-radius:12px}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.btn.cta:not(:disabled):hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 30px -10px rgba(239,35,60,.85),0 0 38px -2px var(--glow)}
.btn.cta-big{font-size:1.1rem;padding:16px 30px;min-height:58px;border-radius:18px;font-weight:800;animation:breathe 2.4s ease-in-out infinite}
.btn.cta-big:hover{animation-play-state:paused}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.965)}}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--ink);cursor:pointer;flex:none;box-shadow:inset 0 1px 0 var(--hl)}
.icon-btn:hover{box-shadow:0 0 0 1.5px var(--bd),0 0 14px -2px var(--glow)}
.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:0;border-radius:999px;padding:8px 15px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:.92rem;cursor:pointer;min-height:38px;box-shadow:0 0 0 1.5px var(--edge),0 6px 12px -10px var(--sh-c);transition:box-shadow .2s,transform .12s}
.chip:hover{color:var(--ink);box-shadow:0 0 0 1.5px var(--bd),0 8px 14px -8px var(--sh-c)}
.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 20px -8px var(--sh-c)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 1px 0 var(--hl)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.unread{background:#FF8A9B;color:#4A0716;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 8px 18px -4px rgba(239,35,60,.7),0 0 18px rgba(255,120,140,.55)}
.pill.read{background:#5DDB9E;color:#073D26;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 8px 18px -4px rgba(40,190,120,.7),0 0 18px rgba(90,230,160,.55)}
.pill.read::before{content:"✓";width:auto;height:auto;background:none;font-size:.8rem}
.lvl{display:inline-grid;place-items:center;min-width:36px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;background:linear-gradient(180deg,#4A5E98,#3B4F86);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(59,79,134,.8);flex:none}
.lv-B1{background:linear-gradient(180deg,#5E78AE,#4D6A9C)}
.lv-B2{background:linear-gradient(180deg,#E0344D,#C21A35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(239,35,60,.8)}

/* ===== notas ===== */
.note{display:flex;flex-direction:column;gap:3px;padding:15px 18px;border-radius:18px;background:var(--info-soft);font-size:.96rem;position:relative;box-shadow:inset 0 1px 0 var(--hl),0 12px 22px -18px var(--sh-c)}
.note .n-t{font-family:var(--px);font-size:.94rem;display:flex;align-items:center;gap:8px}
.note .n-t::before{content:"i";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--info);color:var(--surface);font-size:.78rem;font-style:italic;font-weight:800}
.note.tip{background:var(--good-soft)}.note.tip .n-t::before{content:"✓";background:var(--good);color:#06301f;font-style:normal}
.note.warn{background:var(--hi-soft)}.note.warn .n-t::before{content:"!";background:var(--hi);color:#fff;font-style:normal}
.note.bad{background:var(--bad-soft)}.note.bad .n-t::before{content:"!";background:var(--bad);color:#2B2D42;font-style:normal}

/* ===== campos ===== */
.inp,.ta{width:100%;background:var(--surface);color:var(--ink);border:0;border-radius:14px;padding:13px 16px;box-shadow:inset 0 0 0 1.5px var(--bd),inset 0 2px 4px var(--sh-s);font-size:1rem}
.inp::placeholder,.ta::placeholder{color:var(--ink-2);opacity:.85}
.ta{resize:vertical;min-height:120px;line-height:1.5}
.inp:focus,.ta:focus{outline:none;box-shadow:inset 0 0 0 2px var(--hi),0 0 18px -4px var(--glow)}
.searchbar{position:relative}
.searchbar .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.searchbar .inp{padding-left:46px}
.src-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;white-space:pre-wrap;box-shadow:inset 0 1px 3px var(--sh-s)}
.mistake{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mistake .you{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mistake .ok{color:var(--good);font-weight:700}
.phl{display:flex;flex-direction:column;gap:12px}
.phl li{padding-bottom:12px;border-bottom:1px solid var(--line)}
.phl li:last-child{border:0;padding:0}
.chk{display:flex;flex-direction:column;gap:10px}
.chk li{display:flex;gap:10px;align-items:flex-start}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--hi);flex:none}
.det summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:4px 0}
.det[open] summary{margin-bottom:8px}

/* ===== inicio ===== */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;padding:34px;border-radius:30px;overflow:hidden;isolation:isolate;
 background:linear-gradient(150deg,var(--hero-a),var(--hero-b));
 box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 40px 70px -36px var(--sh-c),0 8px 18px -10px var(--sh-c)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.hero::before{width:460px;height:460px;left:-170px;top:-200px;background:radial-gradient(circle,var(--hl),transparent 68%);animation:drift 14s ease-in-out infinite alternate}
.hero::after{width:420px;height:420px;right:-130px;bottom:-200px;background:radial-gradient(circle,var(--glow),transparent 70%);animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.hero-main{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.hero-brand{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.hero-brand .logo{width:92px;height:92px;filter:drop-shadow(0 16px 20px rgba(14,16,40,.4)) drop-shadow(0 4px 6px rgba(14,16,40,.3));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.hb-name{font-family:var(--px);font-size:2.7rem;font-weight:800;letter-spacing:-.045em;line-height:1;text-shadow:0 6px 14px rgba(14,16,40,.2)}
.hb-name small{display:block;font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin-top:8px;text-shadow:none}
.hero-vis{display:flex;flex-direction:column;gap:14px;min-width:0}
.bubbles{position:relative;height:150px}
.bubble{position:absolute;max-width:74%;padding:12px 16px;border-radius:18px;font-family:var(--px);font-weight:700;font-size:.95rem;line-height:1.3;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 22px 30px -14px var(--sh-c)}
.bubble small{display:block;font-family:var(--sans);font-weight:500;font-size:.76rem;opacity:.85;margin-top:3px}
.bubble.b1{left:0;top:0;background:linear-gradient(160deg,#3E4268,#2B2D42);color:#fff;animation:bob 5s ease-in-out infinite}
.bubble.b1::after{content:"";position:absolute;left:24px;bottom:-9px;border:9px solid transparent;border-top-color:#2B2D42;border-bottom:0}
.bubble.b2{right:12px;top:70px;background:linear-gradient(160deg,#fff,#DDE4EC);color:#2B2D42;animation:bob 6s ease-in-out infinite .8s}
.bubble.b2::after{content:"";position:absolute;right:26px;bottom:-9px;border:9px solid transparent;border-top-color:#DDE4EC;border-bottom:0}
.badge-red{position:absolute;right:0;top:0;transform:rotate(7deg);background:linear-gradient(180deg,#FF3B54,#D90429);color:#fff;font-family:var(--px);font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:12px;box-shadow:0 12px 20px -8px rgba(239,35,60,.8),0 0 24px rgba(239,35,60,.5);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 12px 20px -8px rgba(239,35,60,.8),0 0 40px rgba(239,35,60,.8)}}
.player{padding:18px 20px;border-radius:22px;background:var(--surface);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 34px 48px -24px var(--sh-c),0 10px 18px -10px var(--sh-c);display:flex;flex-direction:column;gap:10px}
.player .nv{font-family:var(--px);font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.player .nv span{font-family:var(--sans);font-size:.92rem;font-weight:500;color:var(--ink-2);margin-left:8px}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:16px;background:var(--surface-2);text-align:center;box-shadow:inset 0 1px 0 var(--hl),0 8px 14px -12px var(--sh-c)}
.stat b{font-family:var(--px);font-size:1.4rem;line-height:1.1;position:relative}
.stat span{font-size:.76rem;color:var(--ink-2);position:relative}
.stat .ic{width:1.3em;height:1.3em;position:relative;transform-origin:50% 90%}
.stat:nth-child(1) .ic{color:#FF9F1C;animation:flame 1.7s ease-in-out infinite}
.stat:nth-child(2) .ic{color:var(--good);animation:chk 2.4s ease-in-out infinite}
.stat:nth-child(3) .ic{animation:book 3s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 3px rgba(255,170,40,.55))}25%{transform:scale(.94,1.1) rotate(-5deg);filter:drop-shadow(0 0 9px rgba(255,140,20,.95))}60%{transform:scale(1.06,.95) rotate(4deg);filter:drop-shadow(0 0 6px rgba(255,190,60,.7))}}
@keyframes chk{50%{transform:scale(1.14);filter:drop-shadow(0 0 7px currentColor)}}
@keyframes book{50%{transform:translateY(-3px) rotate(-5deg)}}
.stat::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);filter:blur(10px);animation:sweep 9s ease-in-out infinite;pointer-events:none}
.stat:nth-child(2)::after{animation-delay:1.5s}.stat:nth-child(3)::after{animation-delay:3s}
@keyframes sweep{0%,40%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 3px var(--sh-s)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF8A9B,var(--cta));box-shadow:0 0 12px var(--glow);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat>.fe{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:24px;font-family:var(--px);font-weight:800;font-size:1.1rem;isolation:isolate;transition:transform .2s}
.feat>.fe:hover{transform:translateY(-3px)}
.feat>.fe .fi{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);flex:none}
.feat>.fe .fi .ic{width:22px;height:22px;animation:bob 3.4s ease-in-out infinite}
.fe-top{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.fe-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.fe-links a{font-family:var(--sans);font-weight:600;font-size:.86rem;text-decoration:none;color:inherit;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:background .2s}
.fe-links a:hover{background:rgba(255,255,255,.34)}
.feat>.fe.f2 .fe-links a{background:rgba(255,255,255,.45)}
.feat>.fe::before{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
.feat>.fe .shine{position:absolute;inset:0 auto 0 0;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.24),transparent);filter:blur(12px);animation:sweep 8s ease-in-out infinite;pointer-events:none;z-index:-1}
.feat>.fe.f1{background:linear-gradient(135deg,#3E4268,#2B2D42);color:#fff;box-shadow:0 26px 38px -20px rgba(43,45,66,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.feat>.fe.f2{background:linear-gradient(135deg,#C5CCD8,#8D99AE);color:#1F2237;box-shadow:0 26px 38px -20px rgba(141,153,174,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.feat>.fe.f2 .shine{animation-delay:2s}
.feat>.fe.f3{background:linear-gradient(135deg,#FF3B54,#D90429);color:#fff;box-shadow:0 26px 38px -18px rgba(239,35,60,.7),0 0 30px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.feat>.fe.f3 .shine{animation-delay:4s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.tile{position:relative;flex:0 0 calc((100% - 32px)/3);min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:22px;text-decoration:none;color:inherit;background:linear-gradient(155deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c);transition:transform .2s,box-shadow .2s}
.tile .t-top{display:flex;align-items:center;gap:12px}
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--hi)));box-shadow:inset 0 1px 0 var(--hl),0 10px 16px -8px var(--sh-c)}
.tile-ic .ic{width:22px;height:22px}
.tile .en{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.tile b{font-family:var(--px);font-size:1.12rem;line-height:1.2}
.tile .muted{flex:1}
.banner{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#34385A,#262A47 60%,#3A2A4A);box-shadow:0 34px 50px -28px rgba(20,22,52,.8),inset 0 1px 0 rgba(255,255,255,.14)}
.banner::before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(239,35,60,.5),transparent 70%);z-index:-1;animation:drift 10s ease-in-out infinite alternate}
.banner .kicker{color:#FF8A9B}
.banner h2{font-size:1.6rem;font-weight:800;margin:2px 0 8px}
.banner p{opacity:.9;max-width:58ch}
.banner .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.banner .btn.ghost:hover{background:rgba(255,255,255,.12)}
.banner .b-ic{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 40px -6px rgba(239,35,60,.5)}
.banner .b-ic .ic{width:46px;height:46px;stroke-width:1.6;animation:bob 3.6s ease-in-out infinite}
.paths-wrap{border-radius:26px;padding:24px;background:linear-gradient(160deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 30px 46px -30px var(--sh-c)}
.paths{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:stretch}
.paths>.path{grid-column:span 2}
.paths>.path:nth-child(4):nth-last-child(2){grid-column:2/4}
.paths>.path:nth-child(5):last-child{grid-column:4/6}
.path{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 22px 34px -24px var(--sh-c)}
.path-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.path-n{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.path-t{font-size:1.18rem;line-height:1.25;min-height:2.6em}
.path-can{flex:1}
.can{display:flex;flex-direction:column;gap:10px}
.can li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:.95rem}
.can .ic{color:var(--good);margin-top:3px}
.path-steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.step{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 14px 7px 8px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:.88rem;box-shadow:inset 0 1px 0 var(--hl)}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem}
.step:hover{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--bd)}
.path-cta{width:100%}
.today{display:flex;flex-direction:column;gap:10px}
.today .label{margin-bottom:0}
.today>.row:last-child{margin-top:auto;padding-top:6px}
.wotd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:2.6em}
.wotd b{font-family:var(--px);font-size:1.45rem;letter-spacing:-.01em;line-height:1.25}
.ex{padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.ex::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:3px;background:linear-gradient(180deg,#FF8A9B,var(--cta));box-shadow:0 0 10px var(--glow)}
.ex>div:first-child{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex .icon-btn{width:30px;height:30px;border-radius:10px}
.reset-row{justify-content:flex-end}

/* ===== listas ===== */
.qcard{display:flex;flex-direction:column;gap:10px}
.qcard .row.sp{min-height:30px}
.q-en{font-family:var(--px);font-size:1.08rem;line-height:1.35}
.hero-q{display:flex;flex-direction:column;gap:12px}
.g-row{padding:14px 18px}
.g-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.g-main{flex:1 1 220px;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.g-en{font-family:var(--px);font-weight:800;font-size:1.12rem}
.g-es{color:var(--ink-2)}
.g-det{padding-top:12px;margin-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph-card{display:flex;flex-direction:column;gap:8px}

/* ===== teoría ===== */
.lcard{display:flex;flex-direction:column;gap:10px;min-height:250px;background:linear-gradient(150deg,var(--unread-a),var(--unread-b))}
.lcard.is-read{background:linear-gradient(150deg,var(--read-a),var(--read-b))}
.lcard .l-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.lcard .l-meta{display:flex;align-items:center;gap:10px;min-width:0}
.lcard .l-cat{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard h3{font-size:1.22rem;line-height:1.22;margin-top:4px}
.lcard .l-en{color:var(--ink-2);font-size:.95rem}
.lcard .l-goal{font-size:.92rem;color:var(--ink-2);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lcard .l-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.86rem;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.lhero{display:flex;flex-direction:column;gap:12px;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,var(--hero-a),var(--hero-b))}
.lhero::after{content:"";position:absolute;right:-90px;top:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);z-index:-1}
.lhero .l-num{font-family:var(--px);font-weight:800;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--hi)}
.blk{display:flex;flex-direction:column;gap:12px}
.blk h2{font-size:1.18rem}
.exl{display:flex;flex-direction:column;gap:10px}
.exl li{display:flex;flex-direction:column;gap:1px;padding:10px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hl)}
.exl li>div:first-child{display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.exl .icon-btn{width:30px;height:30px;border-radius:10px}
.ctable{overflow-x:auto;border-radius:16px;box-shadow:0 0 0 1px var(--edge)}
.ctable table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:420px}
.ctable th{text-align:left;font-family:var(--px);font-size:.8rem;letter-spacing:.04em;padding:11px 14px;background:var(--surface-2)}
.ctable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.wl{display:flex;flex-direction:column;gap:10px}
.wl li{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.wl .w-bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.wl .w-ok{color:var(--good);font-weight:700}
.wl .w-why{color:var(--ink-2);font-size:.9rem}
.cq{display:flex;flex-direction:column;gap:12px}
.cq-q{font-weight:700}
.l-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== ejercicios ===== */
.q-card{gap:14px}
.q-prompt{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-family:var(--px);font-weight:800;font-size:clamp(1.4rem,2vw + .8rem,1.9rem);line-height:1.25;letter-spacing:-.01em}
.q-prompt.long{font-size:1.2rem;font-weight:700;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:16px;padding:14px 16px;background:var(--surface);cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--bd),0 8px 14px -12px var(--sh-c);min-height:56px;font-weight:600;color:var(--ink);transition:box-shadow .2s,transform .12s}
.opt:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--accent),0 12px 20px -10px var(--sh-c);transform:translateY(-1px)}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:.85rem;flex:none}
.opt.ok{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good),0 0 26px -4px var(--good)}
.opt.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad),0 0 26px -4px var(--glow)}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default}
.opt.sel{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.opt.m{min-height:50px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb{border-radius:18px;display:flex;flex-direction:column;gap:10px}
.fb:empty{display:none}
.fb.good,.fb.bad{padding:16px 18px;animation:enter .3s both}
.fb.good{background:var(--good-soft);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--good),0 0 30px -10px var(--good)}
.fb.bad{background:var(--bad-soft);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bad),0 0 30px -10px var(--glow)}
.fb-t{font-family:var(--px);font-size:1.05rem}
.fb-a{font-weight:800;font-size:1.05rem}
.ord{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:var(--surface-2)}
.ord.ans{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--bd)}
.tok{border:0;border-radius:12px;padding:9px 14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--bd);font-weight:600;cursor:pointer;min-height:42px}
.ord.ans .tok{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tok.gone{opacity:.25}
.tok:disabled{cursor:default}
.stat2{display:flex;flex-direction:column;gap:2px}
.stat2 b{font-family:var(--px);font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat2 span{color:var(--ink-2);font-size:.92rem}
.lvlres{display:flex;flex-direction:column;gap:14px}
.prow{display:flex;flex-direction:column;gap:6px}

/* ===== herramientas ===== */
.tpl{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-radius:16px;padding:12px 14px;background:var(--surface);cursor:pointer;box-shadow:0 0 0 1.5px var(--edge),0 10px 16px -14px var(--sh-c);transition:box-shadow .2s,transform .12s}
.tpl-item b{font-family:var(--px);font-size:.98rem}
.tpl-item span{color:var(--ink-2);font-size:.86rem}
.tpl-item.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink);box-shadow:0 14px 24px -12px var(--sh-c),0 0 22px -6px var(--glow)}
.tpl-item.on span{color:inherit;opacity:.85}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:.78rem;font-weight:700;color:var(--ink-2)}
.mail{white-space:pre-wrap;line-height:1.6;font-size:.98rem}
.tr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dir{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;padding:6px 14px;border-radius:999px;background:var(--accent-soft);box-shadow:inset 0 1px 0 var(--hl)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.92rem;box-shadow:0 14px 28px -10px rgba(0,0,0,.5);animation:enter .25s both}

@media (max-width:980px){
 .hero{grid-template-columns:1fr;padding:26px}
 .feat{grid-template-columns:1fr}
 .tile{flex-basis:calc((100% - 16px)/2)}
 .paths{grid-template-columns:1fr}.paths>.path,.paths>.path:nth-child(4):nth-last-child(2),.paths>.path:nth-child(5):last-child{grid-column:auto}.path-t{min-height:0}
 .tpl{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .banner{grid-template-columns:1fr}.banner .b-ic{display:none}
}
@media (max-width:720px){
 .topbar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
 .nav{order:3;flex:1 1 100%;justify-content:flex-start}
 .brand-t b{font-size:1.05rem}
 .theme-btn{margin-left:auto}
}
@media (max-width:640px){
 .grid2,.grid3,.match,.fields,.tr-grid{grid-template-columns:1fr}
 .tile{flex-basis:100%}
 .hero{padding:22px 18px;border-radius:24px}
 .hero-brand .logo{width:70px;height:70px}.hb-name{font-size:2.1rem}
 .card{padding:18px}
 .bubbles{height:140px}.bubble{font-size:.85rem}

/* ===== botón de Claude: colores de Claude en degradado y sombreado ===== */

.btn.claude{color:#fff;background:linear-gradient(140deg,var(--cl1) 0%,var(--cl2) 48%,var(--cl3) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -3px 8px rgba(110,36,14,.38),0 14px 26px -10px var(--cl-sh),0 3px 8px rgba(110,36,14,.28);
 text-shadow:0 1px 1px rgba(100,30,10,.4)}
.btn.claude:hover:not(:disabled){filter:brightness(1.07) saturate(1.05);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(110,36,14,.38),0 18px 30px -10px var(--cl-sh),0 4px 10px rgba(110,36,14,.3)}
.btn.claude:disabled{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* ===== tarjetas del mismo tamaño y alineadas ===== */
.grid2,.grid3,.grid2.top{align-items:stretch}
.grid2>.card,.grid3>.card,.grid2>section,.grid3>section,.tr-grid>.card,.tpl .card{height:100%}
.grid2>.card.stack,.grid3>.card.stack{align-content:start}

/* ===== herramientas ===== */
.tools-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:22px}
.tool-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:210px;padding:20px;border-radius:22px;position:relative;
 background:linear-gradient(155deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c);transition:transform .2s,box-shadow .2s}
.tool-card:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bd),0 34px 48px -24px var(--sh-c)}
.tool-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tool-card.on{box-shadow:inset 0 1px 0 var(--hl),0 0 0 2px var(--accent),0 30px 46px -24px var(--sh-c)}
.tc-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,var(--surface-2),var(--card-b));color:var(--accent);box-shadow:inset 0 1px 0 var(--hl),0 8px 16px -10px var(--sh-c);flex:none}
.tc-ic.sm{width:38px;height:38px;border-radius:12px}
.tc-ic .ic{width:22px;height:22px}
.tc-t{font-family:var(--font-h,inherit);font-size:1.08rem;line-height:1.25}
.tc-d{font-size:.9rem;color:var(--ink-2);line-height:1.45;flex:1}
.tc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tc-tag{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tc-tag.ai{background:linear-gradient(140deg,var(--cl1),var(--cl3));color:#fff;text-shadow:0 1px 1px rgba(100,30,10,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tc-chev{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);transition:transform .25s}
.tc-chev .ic{width:15px;height:15px;transform:rotate(90deg)}
.tool-card.on .tc-chev{transform:rotate(180deg);background:var(--accent);color:var(--accent-ink)}
.tool-host:empty{display:none}
.tool-panel{animation:toolIn .28s ease both;scroll-margin-top:90px}
@keyframes toolIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tool-body{display:flex;flex-direction:column;gap:18px;min-width:0}
.tool-body .phead{display:none}
.tool-setwrap{background:var(--surface-2);border-radius:18px;padding:16px;box-shadow:inset 0 1px 3px var(--sh-s)}
.tool-set{display:flex;flex-direction:column;gap:16px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;align-items:start}
.set-item{display:flex;flex-direction:column;gap:8px;min-width:0}
.switch{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem}
.switch i{width:44px;height:26px;border-radius:999px;background:var(--surface);box-shadow:inset 0 1px 3px var(--sh-s),0 0 0 1px var(--edge);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch.on i{background:var(--accent)}
.switch.on i::after{transform:translateX(18px);background:var(--accent-ink)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.btn.ghost.on{box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:1100px){.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

mark.wrong{background:color-mix(in srgb,var(--bad) 22%,transparent);color:inherit;border-radius:5px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--bad)}

 ph:[["I'm currently working as…","Actualmente trabajo como…"],["I have three years of experience in…","Tengo tres años de experiencia en…"],["I'm looking for a role where I can…","Busco un puesto donde pueda…"]]},
{id:'q02',cat:'pres',lvl:'B1',q:"Can you walk me through your CV?",es:"¿Podés repasar tu CV conmigo?",
 want:"Si entendés tu propia trayectoria y podés explicar tus decisiones profesionales",
 doo:"Explicar tu recorrido en orden cronológico, con una razón para cada cambio",
 tip:"Seguí el orden cronológico y explicá brevemente por qué pasaste de un puesto a otro. Destacá un logro por etapa.",
 model:"Of course. I studied Labor Relations, and I started my career as an administrative assistant in an accounting firm. There, I handled payroll documents and learned the basics of labor regulations. Then I moved to a company where I worked in recruitment for two years. Each step helped me understand different parts of HR, and that's why I'm interested in this generalist position.",
 modelEs:"Por supuesto. Estudié Relaciones del Trabajo y empecé como asistente administrativa en un estudio contable. Ahí manejé documentación de sueldos y aprendí lo básico de la normativa laboral. Después pasé a una empresa donde trabajé dos años en reclutamiento. Cada paso me ayudó a entender distintas partes de RRHH, y por eso me interesa este puesto generalista.",
 ph:[["I started my career as…","Empecé mi carrera como…"],["Then I moved to…","Después pasé a…"],["That experience helped me…","Esa experiencia me ayudó a…"]]},
{id:'q03',cat:'pres',lvl:'B1',q:"Why did you choose a career in HR?",es:"¿Por qué elegiste una carrera en Recursos Humanos?",
 want:"Si tu interés por RRHH es genuino y está claro tu motivo",
 doo:"Contar un motivo personal real y vincularlo con el valor que aportás",
 tip:"Mostrá una motivación auténtica: ayudar a las personas, el vínculo entre empresa y equipo, el interés por la normativa. Cerrá con lo que aportás.",
 model:"I've always been interested in how people and organizations work together. During my studies, I realized that HR has a direct impact on people's daily lives, from fair hiring to good working conditions. I enjoy listening to people, solving problems and keeping processes organized, so HR was a natural choice for me.",
 modelEs:"Siempre me interesó cómo trabajan juntas las personas y las organizaciones. Durante mis estudios, me di cuenta de que RRHH impacta directamente en la vida cotidiana de las personas, desde contrataciones justas hasta buenas condiciones de trabajo. Disfruto de escuchar a la gente, resolver problemas y mantener los procesos ordenados, así que RRHH fue una elección natural.",
 ph:[["I've always been interested in…","Siempre me interesó…"],["I enjoy working with people because…","Disfruto de trabajar con personas porque…"],["It was a natural choice for me.","Fue una elección natural para mí."]]},
{id:'q04',cat:'pres',lvl:'B1',q:"How would your colleagues describe you?",es:"¿Cómo te describirían tus compañeros?",
 want:"Si tenés una buena percepción de vos misma y podés respaldarla con ejemplos",
 doo:"Mencionar dos o tres cualidades y respaldar cada una con un ejemplo breve",
 tip:"Elegí cualidades relevantes para el puesto y dá un ejemplo concreto. Evitá listas de adjetivos sin respaldo.",
 model:"I think they would say I'm reliable and approachable. For example, when our team had a heavy workload during the payroll closing, I stayed organized and helped others prioritize. They also know they can come to me with questions, because I always try to listen carefully and explain things clearly.",
 modelEs:"Creo que dirían que soy confiable y accesible. Por ejemplo, cuando el equipo tuvo mucha carga de trabajo durante el cierre de liquidación, me mantuve organizada y ayudé a los demás a priorizar. También saben que pueden venir a mí con consultas, porque siempre trato de escuchar con atención y explicar las cosas con claridad.",
 ph:[["I think they would say that I'm…","Creo que dirían que soy…"],["For example, when…","Por ejemplo, cuando…"],["People know they can count on me.","Las personas saben que pueden contar conmigo."]]},
{id:'q05',cat:'exp',lvl:'A2',q:"What are your main responsibilities in your current job?",es:"¿Cuáles son tus principales responsabilidades en tu trabajo actual?",
 want:"Qué tareas realizás concretamente y con qué nivel de autonomía",
 doo:"Enumerar tus tareas principales con verbos de acción y algún dato concreto",
 tip:"Usá verbos de acción (manage, prepare, coordinate, update) y, cuando puedas, números: cantidad de personas, procesos o plazos.",
 model:"I'm responsible for updating employee files, preparing the monthly attendance report and coordinating interviews. I also answer employees' questions about leave and payslips. In a typical month, I handle documents for around one hundred employees.",
 modelEs:"Soy responsable de actualizar los legajos, preparar el informe mensual de asistencia y coordinar entrevistas. También respondo consultas del personal sobre licencias y recibos de sueldo. En un mes típico, gestiono documentación de alrededor de cien empleados.",
 ph:[["I'm responsible for…","Soy responsable de…"],["I also support…","También colaboro con…"],["I work closely with…","Trabajo en estrecha colaboración con…"]]},
{id:'q06',cat:'exp',lvl:'B1',q:"What is your biggest professional achievement?",es:"¿Cuál es tu mayor logro profesional?",
 want:"Si reconocés tus resultados y si podés medirlos",
 doo:"Elegir un logro concreto y explicar qué hiciste y qué resultado obtuviste",
 tip:"Elegí un logro relevante para el puesto. Explicá la situación, qué hiciste vos y el resultado con un dato, por ejemplo un porcentaje o un plazo.",
 model:"One of my biggest achievements was reorganizing our onboarding documents. The process was slow and confusing, so I created a simple checklist and a welcome guide. As a result, we reduced the time needed to complete new-hire paperwork from five days to two.",
 modelEs:"Uno de mis mayores logros fue reorganizar los documentos de inducción. El proceso era lento y confuso, así que creé una lista de control y una guía de bienvenida. Como resultado, redujimos el tiempo para completar la documentación de ingreso de cinco días a dos.",
 ph:[["I'm proud of…","Estoy orgullosa de…"],["As a result, we…","Como resultado, logramos…"],["I took the initiative to…","Tomé la iniciativa de…"]]},
{id:'q07',cat:'exp',lvl:'B1',q:"Do you have experience with payroll or HR software?",es:"¿Tenés experiencia con sistemas de liquidación de sueldos o de RRHH?",
 want:"Qué herramientas manejás y con qué nivel",
 doo:"Nombrar las herramientas que usás y para qué las usás, sin exagerar tu nivel",
 tip:"Sé específica y honesta: nombrá la herramienta, para qué la usás y hace cuánto. Si no conocés una, mostrá que aprendés rápido.",
 model:"Yes, I use Excel every day for attendance reports and payroll checks, and I'm comfortable with formulas and pivot tables. I've also worked with an HR information system to update employee records. I learn new software quickly, so I wouldn't have any problem adapting to your system.",
 modelEs:"Sí, uso Excel todos los días para informes de asistencia y controles de liquidación, y manejo bien fórmulas y tablas dinámicas. También trabajé con un sistema de información de RRHH para actualizar legajos. Aprendo rápido un software nuevo, así que no tendría problema en adaptarme a su sistema.",
 ph:[["I use … every day for…","Uso … todos los días para…"],["I'm comfortable with…","Manejo bien…"],["I learn new tools quickly.","Aprendo rápido herramientas nuevas."]]},
{id:'q08',cat:'exp',lvl:'A2',q:"Can you describe a typical day at work?",es:"¿Podés describir un día típico de trabajo?",
 want:"Cómo organizás tu tiempo y qué tareas son habituales en tu rutina",
 doo:"Describir tu rutina en orden, con conectores como first, then y after that",
 tip:"Usá conectores de secuencia: first, then, after that, finally. Mostrá cómo priorizás.",
 model:"I usually start the day by checking my emails and the urgent requests from employees. Then I update records and prepare documents for new hires. After lunch, I join interviews or meetings with managers. Finally, I review my tasks for the next day.",
 modelEs:"Normalmente empiezo el día revisando mis correos y las consultas urgentes del personal. Después actualizo registros y preparo documentación para quienes ingresan. Luego del almuerzo, participo de entrevistas o reuniones con gerentes. Por último, reviso mis tareas del día siguiente.",
 ph:[["I usually start by…","Normalmente empiezo…"],["After that, I…","Después de eso, yo…"],["Finally, I…","Por último, yo…"]]},
{id:'q09',cat:'exp',lvl:'B1',q:"Why are you leaving your current job?",es:"¿Por qué te vas de tu trabajo actual?",
 want:"Si tus motivos son profesionales y si hablás de tu empleador con respeto",
 doo:"Hablar de lo que buscás en vez de criticar a tu empleador actual",
 tip:"Nunca hables mal de tu empresa actual. Enfocate en lo que querés: crecer, aprender, asumir más responsabilidad.",
 model:"I've learned a lot in my current role, but I feel I'm ready for a new challenge. I'd like to take on more responsibility and work on talent development, which is something your company offers. I'm leaving on good terms and I'm grateful for the experience.",
 modelEs:"Aprendí mucho en mi puesto actual, pero siento que estoy lista para un nuevo desafío. Me gustaría asumir más responsabilidad y trabajar en desarrollo del talento, algo que su empresa ofrece. Me voy en buenos términos y estoy agradecida por la experiencia.",
 ph:[["I'm ready for a new challenge.","Estoy lista para un nuevo desafío."],["I'm looking for more growth opportunities.","Busco más oportunidades de crecimiento."],["I'm leaving on good terms.","Me voy en buenos términos."]]},
{id:'q10',cat:'exp',lvl:'B1',q:"What do you know about our company?",es:"¿Qué sabés de nuestra empresa?",
 want:"Si te informaste antes de venir y si te interesa el puesto de verdad",
 doo:"Investigar la empresa antes y mencionar dos datos concretos que te interesen",
 tip:"Antes de la entrevista, revisá la web, las redes y las noticias de la empresa. Mencioná dos datos y conectalos con tu interés.",
 model:"I know that your company has been operating in the industry for more than twenty years and that you recently opened a new branch. I also read that you promote internal growth and training, which is very important to me. That's one of the reasons why I applied.",
 modelEs:"Sé que su empresa opera en el sector hace más de veinte años y que recientemente abrió una nueva sucursal. También leí que promueven el crecimiento interno y la capacitación, lo cual es muy importante para mí. Es una de las razones por las que me postulé.",
 ph:[["I read that your company…","Leí que su empresa…"],["I was impressed by…","Me impresionó…"],["That's one of the reasons why I applied.","Es una de las razones por las que me postulé."]]},
{id:'q11',cat:'fort',lvl:'A2',q:"What are your greatest strengths?",es:"¿Cuáles son tus mayores fortalezas?",
 want:"Si conocés tus fortalezas y si son relevantes para el puesto",
 doo:"Elegir dos fortalezas útiles para el puesto y dar un ejemplo de cada una",
 tip:"Elegí cualidades relevantes para RRHH (comunicación, discreción, organización) y apoyá cada una con un ejemplo breve.",
 model:"I think my main strengths are communication and discretion. I'm good at listening to people and explaining things clearly. I'm also careful with confidential information, which is essential in HR. For example, I managed salary data for two years without any incidents.",
 modelEs:"Creo que mis principales fortalezas son la comunicación y la discreción. Soy buena para escuchar a las personas y explicar las cosas con claridad. Además, soy cuidadosa con la información confidencial, algo esencial en RRHH. Por ejemplo, manejé datos de sueldos durante dos años sin ningún incidente.",
 ph:[["One of my strengths is…","Una de mis fortalezas es…"],["I'm good at…","Soy buena para…"],["For example, I…","Por ejemplo, yo…"]]},
{id:'q12',cat:'fort',lvl:'B1',q:"What is your greatest weakness?",es:"¿Cuál es tu mayor debilidad?",
 want:"Si tenés autocrítica y si trabajás activamente para mejorar",
 doo:"Nombrar una debilidad real y no esencial para el puesto, y explicar cómo la mejorás",
 tip:"Elegí una debilidad real y que no sea clave para el puesto. Mostrá qué hacés para mejorarla. Evitá respuestas como «soy demasiado perfeccionista».",
 model:"I used to find it difficult to delegate tasks because I wanted everything to be perfect. I've been working on it by setting clear instructions and trusting my teammates. It has improved the way we work, and I've learned that sharing tasks makes the team stronger.",
 modelEs:"Antes me costaba delegar tareas porque quería que todo saliera perfecto. Estuve trabajando en eso dando instrucciones claras y confiando en mis compañeros. Mejoró la forma en que trabajamos y aprendí que compartir tareas fortalece al equipo.",
 ph:[["I used to find it difficult to…","Antes me costaba…"],["I've been working on it by…","Estuve trabajando en eso…"],["I've learned that…","Aprendí que…"]]},
{id:'q13',cat:'fort',lvl:'B1',q:"How do you handle stress and pressure?",es:"¿Cómo manejás el estrés y la presión?",
 want:"Si mantenés la calma y tenés estrategias concretas ante la presión",
 doo:"Describir una estrategia concreta que usás y dar un ejemplo real",
 tip:"Mostrá que tenés estrategias prácticas: priorizar, planificar, pedir ayuda a tiempo. Un ejemplo ayuda.",
 model:"When the pressure increases, I make a list of priorities and focus on one task at a time. During the payroll closing, for example, I set daily goals and asked for help when I needed it. I think staying calm and organized is the best way to meet deadlines.",
 modelEs:"Cuando aumenta la presión, hago una lista de prioridades y me enfoco en una tarea a la vez. Durante el cierre de liquidación, por ejemplo, fijé metas diarias y pedí ayuda cuando la necesité. Creo que mantener la calma y la organización es la mejor forma de cumplir con los plazos.",
 ph:[["I make a list of priorities.","Hago una lista de prioridades."],["I focus on one task at a time.","Me enfoco en una tarea a la vez."],["I ask for help when I need it.","Pido ayuda cuando la necesito."]]},
{id:'q14',cat:'fort',lvl:'B1',q:"How do you organize and prioritize your tasks?",es:"¿Cómo organizás y priorizás tus tareas?",
 want:"Cómo planificás tu trabajo y qué criterios usás para decidir qué va primero",
 doo:"Explicar qué criterio usás para priorizar y con qué herramientas te organizás",
 tip:"Explicá tu criterio (urgencia e impacto) y mencioná herramientas: calendario, listas, planillas.",
 model:"I organize my tasks by urgency and impact. At the beginning of each week, I make a plan in my calendar, and every morning I review it. Tasks with legal deadlines, such as payroll or employee registrations, always come first. Then I move on to the rest.",
 modelEs:"Organizo mis tareas por urgencia e impacto. Al comienzo de cada semana armo un plan en mi calendario y cada mañana lo reviso. Las tareas con plazos legales, como la liquidación de sueldos o los registros de personal, siempre van primero. Después sigo con el resto.",
 ph:[["I prioritize by urgency and impact.","Priorizo por urgencia e impacto."],["I plan my week in advance.","Planifico mi semana con anticipación."],["Deadlines always come first.","Los plazos siempre van primero."]]},
{id:'q15',cat:'cond',lvl:'B2',q:"Tell me about a time you had a conflict with a coworker.",es:"Contame sobre una vez que tuviste un conflicto con un compañero.",
 want:"Cómo resolvés desacuerdos y si asumís tu parte de la responsabilidad",
 doo:"Usar el método STAR y mostrar cómo lo resolviste sin culpar a la otra persona",
 tip:"Usá STAR: situación, tarea, acción y resultado. Elegí un conflicto real y resuelto, sin culpar a la otra persona. Mostrá empatía.",
 model:"In my previous job, a colleague and I disagreed about how to organize the filing system. I invited her to talk privately and listened to her point of view. We realized we had the same goal, so we combined both ideas into a new system. As a result, the files were easier to find, and our relationship improved.",
 modelEs:"En mi trabajo anterior, una compañera y yo no estábamos de acuerdo en cómo organizar el archivo. La invité a conversar en privado y escuché su punto de vista. Nos dimos cuenta de que teníamos el mismo objetivo, así que combinamos ambas ideas en un sistema nuevo. Como resultado, los archivos eran más fáciles de encontrar y mejoró nuestra relación.",
 ph:[["We had a disagreement about…","Tuvimos un desacuerdo sobre…"],["I listened to her point of view.","Escuché su punto de vista."],["We found a solution that worked for both.","Encontramos una solución que servía a las dos."]]},
{id:'q16',cat:'cond',lvl:'B2',q:"Describe a time when you had to meet a tight deadline.",es:"Describí una vez en que tuviste que cumplir un plazo muy ajustado.",
 want:"Cómo organizás tu trabajo cuando hay poco tiempo y qué resultado lográs",
 doo:"Mostrar cómo planificaste, qué priorizaste y qué resultado obtuviste",
 tip:"Mostrá planificación y comunicación: qué priorizaste, a quién pediste ayuda y qué lograste.",
 model:"Last year, we had to prepare all the documents for a new branch in just one week. I divided the work into daily tasks and asked two colleagues to help me with the contracts. I kept my manager informed every day. We finished one day early and without any errors.",
 modelEs:"El año pasado tuvimos que preparar toda la documentación para una nueva sucursal en solo una semana. Dividí el trabajo en tareas diarias y pedí a dos compañeras que me ayudaran con los contratos. Mantuve informada a mi jefa todos los días. Terminamos un día antes y sin errores.",
 ph:[["We had only one week to…","Teníamos solo una semana para…"],["I divided the work into…","Dividí el trabajo en…"],["We finished one day early.","Terminamos un día antes."]]},
{id:'q17',cat:'cond',lvl:'B2',q:"Tell me about a mistake you made at work. What did you learn?",es:"Contame un error que cometiste en el trabajo. ¿Qué aprendiste?",
 want:"Si asumís tus errores y si aprendés de ellos",
 doo:"Reconocer un error real, explicar cómo lo corregiste y qué cambiaste",
 tip:"Elegí un error real, no grave. Asumí la responsabilidad y poné el foco en la solución y en lo que cambiaste después.",
 model:"Once, I sent an attendance report with a wrong date, which delayed the payroll process by a few hours. I noticed the mistake, informed my manager immediately and corrected the report. Since then, I always use a checklist and review the data twice before sending it.",
 modelEs:"Una vez envié un informe de asistencia con una fecha equivocada, lo que demoró unas horas el proceso de liquidación. Me di cuenta del error, avisé a mi jefa de inmediato y corregí el informe. Desde entonces, uso siempre una lista de control y reviso los datos dos veces antes de enviarlos.",
 ph:[["I made a mistake with…","Cometí un error con…"],["I took responsibility and…","Asumí la responsabilidad y…"],["Since then, I always…","Desde entonces, siempre…"]]},
{id:'q18',cat:'cond',lvl:'B2',q:"Give an example of when you handled confidential information.",es:"Dá un ejemplo de cuando manejaste información confidencial.",
 want:"Si sos discreta y si seguís los procedimientos para cuidar los datos",
 doo:"Mostrar con un ejemplo cómo cuidás los datos y qué medidas tomás",
 tip:"En RRHH esto es central. Hablá de medidas concretas: acceso restringido, archivos protegidos, no comentar datos personales.",
 model:"In my current role, I manage salary data and medical certificates. I keep these files in a protected folder with restricted access, and I never discuss personal information with people who don't need it. Once, a colleague asked about another employee's salary, and I politely explained that I couldn't share that information.",
 modelEs:"En mi puesto actual manejo datos de sueldos y certificados médicos. Guardo esos archivos en una carpeta protegida con acceso restringido y nunca comento información personal con quienes no la necesitan. Una vez, un compañero preguntó por el sueldo de otra persona y le expliqué con amabilidad que no podía compartir esa información.",
 ph:[["I keep the files in a protected folder.","Guardo los archivos en una carpeta protegida."],["I never discuss personal information.","Nunca comento información personal."],["I explained that I couldn't share it.","Expliqué que no podía compartirlo."]]},
{id:'q19',cat:'cond',lvl:'B2',q:"Describe a time you had to give difficult feedback.",es:"Describí una vez en que tuviste que dar una devolución difícil.",
 want:"Si podés comunicar algo incómodo con respeto y con claridad",
 doo:"Mostrar que preparaste la conversación y que fuiste clara y respetuosa",
 tip:"Mostrá preparación, claridad y respeto. Explicá cómo cuidaste la relación y qué resultado hubo.",
 model:"A team member was repeatedly late with his reports. I prepared the conversation in advance, chose a private place and started by recognizing his good work. Then I explained the impact of the delays and asked about the reasons. We agreed on a plan with new deadlines, and his reports improved right away.",
 modelEs:"Un integrante del equipo entregaba sus informes tarde en forma reiterada. Preparé la conversación con anticipación, elegí un lugar privado y empecé reconociendo su buen trabajo. Después expliqué el impacto de los retrasos y pregunté por los motivos. Acordamos un plan con nuevos plazos y sus informes mejoraron enseguida.",
 ph:[["I prepared the conversation in advance.","Preparé la conversación con anticipación."],["I started by recognizing…","Empecé reconociendo…"],["We agreed on a plan.","Acordamos un plan."]]},
{id:'q20',cat:'cond',lvl:'B1',q:"Tell me about a time you worked as part of a team.",es:"Contame sobre una vez que trabajaste en equipo.",
 want:"Cómo colaborás con otras personas y qué rol tomás en un grupo",
 doo:"Contar qué rol tuviste en el equipo y qué lograron entre todos",
 tip:"Hablá en plural cuando corresponde («we»), pero aclará cuál fue tu aporte concreto.",
 model:"Last year, our team organized a training day for all employees. I was in charge of the schedule and the invitations, while my colleagues prepared the materials and the rooms. We held weekly meetings to check our progress. The event was a success, and the feedback from participants was very positive.",
 modelEs:"El año pasado nuestro equipo organizó una jornada de capacitación para todo el personal. Yo estuve a cargo del cronograma y las invitaciones, mientras mis compañeros preparaban los materiales y las salas. Hicimos reuniones semanales para controlar el avance. El evento fue un éxito y la devolución de los participantes fue muy positiva.",
 ph:[["I was in charge of…","Estuve a cargo de…"],["We held weekly meetings.","Hicimos reuniones semanales."],["The feedback was very positive.","La devolución fue muy positiva."]]},
{id:'q21',cat:'sit',lvl:'B2',q:"How would you handle an employee who is frequently late?",es:"¿Cómo manejarías a un empleado que llega tarde con frecuencia?",
 want:"Si seguís un proceso justo y documentado y si escuchás a la persona antes de sancionar",
 doo:"Proponer una conversación privada, escuchar a la persona y documentar lo acordado",
 tip:"Mostrá un proceso: revisar los registros, hablar en privado, escuchar los motivos, acordar un plan y documentar. Las sanciones, solo si es necesario y según la política.",
 model:"First, I would check the attendance records to confirm the pattern. Then I would talk to the employee in private to understand the reasons, because there might be a personal or health issue. We would agree on a plan with clear expectations and I would document the conversation. If the situation continued, I would follow the company policy on disciplinary actions.",
 modelEs:"Primero, revisaría los registros de asistencia para confirmar el patrón. Después hablaría con la persona en privado para entender los motivos, porque podría haber un problema personal o de salud. Acordaríamos un plan con expectativas claras y documentaría la conversación. Si la situación continuara, seguiría la política de la empresa sobre sanciones disciplinarias.",
 ph:[["First, I would check…","Primero, revisaría…"],["I would talk to the employee in private.","Hablaría con la persona en privado."],["I would document the conversation.","Documentaría la conversación."]]},
{id:'q22',cat:'sit',lvl:'B2',q:"An employee tells you that their manager is harassing them. What would you do?",es:"Un empleado te dice que su jefe lo está acosando. ¿Qué harías?",
 want:"Si tomás el tema en serio, mantenés la confidencialidad y seguís el protocolo",
 doo:"Escuchar sin juzgar, garantizar la confidencialidad y activar el protocolo de la empresa",
 tip:"Mostrá seriedad y proceso: escuchar sin juzgar, confidencialidad, registro por escrito, protocolo de la empresa e investigación imparcial. No prometas resultados.",
 model:"I would take the complaint very seriously. First, I would listen carefully without judging and explain that the information will be handled confidentially. Then I would record the facts in writing and follow the company's protocol, which includes an impartial investigation. I would also make sure the employee is protected from any retaliation during the process.",
 modelEs:"Tomaría la denuncia con mucha seriedad. Primero, escucharía con atención sin juzgar y explicaría que la información se tratará con confidencialidad. Después, dejaría constancia escrita de los hechos y seguiría el protocolo de la empresa, que incluye una investigación imparcial. También me aseguraría de que la persona esté protegida de cualquier represalia durante el proceso.",
 ph:[["I would take it very seriously.","Lo tomaría muy en serio."],["The information will be handled confidentially.","La información se tratará con confidencialidad."],["I would follow the company's protocol.","Seguiría el protocolo de la empresa."]]},
{id:'q23',cat:'sit',lvl:'B2',q:"A manager asks you to hire a friend without following the selection process. What do you do?",es:"Un gerente te pide contratar a un amigo sin seguir el proceso de selección. ¿Qué hacés?",
 want:"Si mantenés la integridad y sabés decir que no con respeto",
 doo:"Decir que no con respeto, explicar el motivo y ofrecer una alternativa dentro del proceso",
 tip:"Mostrá integridad: explicá por qué el proceso es importante (igualdad de oportunidades, riesgos legales) y ofrecé una salida: que su amigo se postule por el proceso.",
 model:"I would explain, politely but clearly, that we need to follow the selection process to guarantee equal opportunities and to protect the company. I would suggest that his friend apply through the regular process, where he will be evaluated like any other candidate. If the manager insisted, I would inform my supervisor.",
 modelEs:"Explicaría, con amabilidad pero con claridad, que debemos seguir el proceso de selección para garantizar igualdad de oportunidades y proteger a la empresa. Le sugeriría que su amigo se postule por el proceso habitual, donde será evaluado como cualquier otro candidato. Si el gerente insistiera, informaría a mi supervisor.",
 ph:[["I would politely explain that…","Explicaría con amabilidad que…"],["To guarantee equal opportunities…","Para garantizar igualdad de oportunidades…"],["I would inform my supervisor.","Informaría a mi supervisor."]]},
{id:'q24',cat:'sit',lvl:'B2',q:"How would you handle a payroll error that left an employee underpaid?",es:"¿Cómo manejarías un error de liquidación que dejó a un empleado con menos sueldo del que le correspondía?",
