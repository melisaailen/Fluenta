 {q:'¿Qué oración usa bien need?',o:['I am needing a day off.','I need a day off.','I\'m need a day off.','I needing a day off.'],a:1,why:'«Need» es un verbo de estado y va en Present Simple.'},
 {q:'«___ your company offer flexible hours?»',o:['Do','Does','Is','Are'],a:1,why:'«Your company» equivale a it, por eso se usa does.'},
 {q:'¿Cuál es la negación correcta?',o:['He don\'t work on Fridays.','He doesn\'t works on Fridays.','He doesn\'t work on Fridays.','He not work on Fridays.'],a:2,why:'Negación con he: doesn\'t + verbo base.'},
 {q:'«Right now, the team ___ the new policy.»',o:['reviews','is reviewing','review','reviewing'],a:1,why:'«Right now» indica una acción en curso: is + reviewing.'}
 ]},
{id:'l02',n:2,t:'Contar tu experiencia',en:'Past Simple and Present Perfect',lvl:'B1',cat:'Gramática aplicada',
 goal:'Hablar de tu trayectoria: lo que ya terminó y lo que llega hasta hoy.',
 why:'Las preguntas sobre experiencia son las más comunes en una entrevista. Elegir bien el tiempo verbal marca la diferencia.',
 blocks:[
 {k:'rule',h:'Past Simple: acciones terminadas en un momento definido',t:'Se usa cuando indicás cuándo pasó (yesterday, last year, in 2021, two years ago) o cuando la etapa ya terminó. Los verbos regulares llevan **-ed**; los irregulares cambian (lead → led, hire → hired, make → made).',
  ex:[['I worked at a consulting firm from 2018 to 2021.','Trabajé en una consultora de 2018 a 2021.'],['We interviewed ten candidates last week.','Entrevistamos a diez candidatos la semana pasada.'],['She joined the company two years ago.','Ingresó a la empresa hace dos años.']]},
 {k:'rule',h:'Present Perfect: experiencia hasta hoy',t:'Se forma con **have / has + participio**. Se usa para experiencia sin fecha precisa, para algo que empezó en el pasado y sigue, y para resultados actuales. Con **for** indicás duración y con **since**, el punto de inicio.',
  ex:[['I have worked in recruitment for five years.','Trabajo en reclutamiento desde hace cinco años.'],['She has managed teams of up to twenty people.','Ha liderado equipos de hasta veinte personas.'],['Have you ever handled a labor dispute?','¿Alguna vez manejaste un conflicto laboral?'],['We haven\'t received your documents yet.','Todavía no recibimos su documentación.']]},
 {k:'table',h:'for y since',head:['Palabra','Se usa con','Ejemplos'],rows:[['for','una duración','for three years, for six months'],['since','un punto de inicio','since 2021, since March']]},
 {k:'note',type:'tip',h:'Regla práctica',t:'Si decís cuándo pasó o cuándo terminó (in 2021, last year, ago), usá **Past Simple**. Si no hay un momento concreto o la acción llega hasta hoy, usá **Present Perfect**.'},
 {k:'note',type:'info',h:'En la entrevista',t:'Respondé con Present Perfect («I\'ve worked in recruitment for five years») y sumá los detalles con Past Simple («In 2022, I led a project to…»).'},
 {k:'wrong',h:'Errores frecuentes',items:[['I work in HR since 2019.','I have worked in HR since 2019.','Con since y una fecha se usa Present Perfect.'],['I have started my job in 2021.','I started my job in 2021.','Con «in 2021» (momento concreto) se usa Past Simple.'],['She has joined us two years ago.','She joined us two years ago.','«Ago» siempre va con Past Simple.']]},
 {k:'phr',h:'Frases útiles',items:[['I have five years of experience in…','Tengo cinco años de experiencia en…'],['I\'ve worked at this company since 2020.','Trabajo en esta empresa desde 2020.'],['In my previous role, I…','En mi puesto anterior, yo…'],['I\'ve never had to…','Nunca tuve que…']]}
 ],
 check:[
 {q:'«I ___ in HR for six years.» (todavía trabajás en RRHH)',o:['worked','have worked','am working since','work'],a:1,why:'La acción llega hasta hoy y hay una duración con for: Present Perfect.'},
 {q:'«She ___ the company in 2019.»',o:['has joined','joined','has join','is joining'],a:1,why:'«In 2019» es un momento concreto: Past Simple.'},
 {q:'«Have you ___ led a team?»',o:['ever','ago','since','last year'],a:0,why:'«Have you ever…?» significa «¿alguna vez…?».'},
 {q:'«We ___ received your CV yet.»',o:['didn\'t','haven\'t','aren\'t','don\'t'],a:1,why:'«Yet» se usa con Present Perfect: haven\'t received.'},
 {q:'¿Qué opción usa bien el pasado simple con 2020?',o:['I have finished my degree in 2020.','I finished my degree in 2020.','I am finishing my degree in 2020.','I finish my degree in 2020.'],a:1,why:'Con «in 2020» se usa Past Simple.'},
 {q:'«He has worked here ___ 2018.»',o:['for','since','ago','during'],a:1,why:'Since + punto de inicio (2018).'}
 ]},
{id:'l03',n:3,t:'Políticas y obligaciones',en:'Modal verbs for rules and advice',lvl:'B1',cat:'Gramática aplicada',
 goal:'Explicar normas, permisos, obligaciones y recomendaciones.',
 why:'Los reglamentos, las políticas internas y las respuestas a consultas del personal usan modales todo el tiempo.',
 blocks:[
 {k:'rule',h:'Obligación',t:'**must** (norma o decisión fuerte), **have to** y **be required to** (regla externa).',
  ex:[['Employees must complete the safety training.','El personal debe completar la capacitación de seguridad.'],['You have to submit the form by Friday.','Tenés que presentar el formulario a más tardar el viernes.'],['Staff are required to wear an ID badge.','Se exige al personal usar credencial.']]},
 {k:'rule',h:'Prohibición y falta de obligación',t:'**mustn\'t** significa que está prohibido. **don\'t have to** significa que no es necesario. No son lo mismo.',
  ex:[['You mustn\'t share confidential information.','No debés compartir información confidencial (está prohibido).'],['You don\'t have to attend the optional workshop.','No tenés por qué asistir al taller optativo.']]},
 {k:'rule',h:'Permisos y derechos',t:'**can**, **may** (más formal), **be allowed to**, **be entitled to** (tener derecho a).',
  ex:[['Employees can work remotely twice a week.','El personal puede trabajar a distancia dos veces por semana.'],['You are entitled to paid vacation.','Tenés derecho a vacaciones pagas.'],['Visitors are not allowed to enter without a badge.','No se permite el ingreso de visitantes sin credencial.']]},
 {k:'rule',h:'Consejos y recomendaciones',t:'**should** y **ought to** recomiendan sin obligar.',
  ex:[['You should update your CV before applying.','Deberías actualizar tu CV antes de postularte.'],['Candidates should arrive ten minutes early.','Se recomienda que los candidatos lleguen diez minutos antes.']]},
 {k:'table',h:'Fuerza de cada modal',head:['Modal','Significa'],rows:[['must','obligación fuerte'],['have to / be required to','obligación por una regla externa'],['should','recomendación'],['can / may','posibilidad o permiso'],['mustn\'t','prohibido'],['don\'t have to','no es necesario']]},
 {k:'note',type:'warn',h:'Los modales son especiales',t:'No llevan -s en he, she, it, no usan do / does y después va el verbo base sin to: «She can work», «Can she work?». **Must** no tiene pasado: se usa **had to**.'},
 {k:'wrong',h:'Errores frecuentes',items:[['You don\'t must share passwords.','You mustn\'t share passwords.','Los modales no usan don\'t; la prohibición es mustn\'t.'],['She musts submit the report.','She must submit the report.','Los modales no llevan -s.'],['Employees can to work from home.','Employees can work from home.','Después de un modal va el verbo base, sin to.'],['I must leave early yesterday.','I had to leave early yesterday.','Para el pasado de must se usa had to.']]},
 {k:'phr',h:'Frases de políticas',items:[['Employees are required to…','El personal debe…'],['You are not allowed to…','No está permitido…'],['Please note that you must…','Tené en cuenta que debés…'],['It is not mandatory to…','No es obligatorio…']]}
 ],
 check:[
 {q:'Norma de la empresa: «Visitors ___ wear a badge at all times.»',o:['must','may','don\'t have to','ought'],a:0,why:'Es una obligación de la empresa: must.'},
 {q:'«You ___ attend the training; it\'s optional.»',o:['mustn\'t','don\'t have to','can\'t to','must'],a:1,why:'No es necesario: don\'t have to.'},
 {q:'«You ___ share your password with anyone.» (está prohibido)',o:['don\'t have to','mustn\'t','shouldn\'t to','aren\'t'],a:1,why:'Prohibición: mustn\'t.'},
 {q:'«I ___ stay late yesterday.» (fue obligatorio)',o:['must','had to','have to','musted'],a:1,why:'Must no tiene pasado: se usa had to.'},
 {q:'¿Qué opción usa bien can?',o:['She cans work remotely.','She can works remotely.','She can work remotely.','She can to work remotely.'],a:2,why:'Modal + verbo base, sin -s ni to.'},
 {q:'Recomendación suave: «You ___ prepare examples for the interview.»',o:['must','should','mustn\'t','are required'],a:1,why:'Should recomienda sin obligar.'}
 ]},
{id:'l04',n:4,t:'Pedidos, cortesía y tono profesional',en:'Polite language at work',lvl:'B1',cat:'Comunicación',
 goal:'Pedir, ofrecer ayuda y dar malas noticias con amabilidad.',
 why:'En RRHH casi todo es una conversación sensible. Una orden directa suena brusca aunque la gramática sea correcta.',
 blocks:[
 {k:'rule',h:'Pedir algo con amabilidad',t:'Cuanto más indirecta es la frase, más amable suena: **Could you…? / Would you mind + -ing? / Would it be possible to…? / I was wondering if you could…**',
  ex:[['Could you send me your CV, please?','¿Podrías enviarme tu CV, por favor?'],['Would you mind sending the documents today?','¿Te molestaría enviar la documentación hoy?'],['Would it be possible to reschedule the interview?','¿Sería posible reprogramar la entrevista?'],['I was wondering if you could share your availability.','Quería saber si podrías compartirme tu disponibilidad.']]},
 {k:'rule',h:'Ofrecer ayuda',t:'**Would you like me to…? / Shall I…?**',ex:[['Would you like me to send you the job description?','¿Querés que te envíe la descripción del puesto?'],['Shall I book the meeting room?','¿Reservo la sala de reuniones?']]},
 {k:'rule',h:'Suavizar malas noticias',t:'Usá **unfortunately, I\'m afraid, we regret to inform you** y expresiones como **not quite** o **a bit**.',
  ex:[['I\'m afraid we can\'t offer that salary.','Lamentablemente no podemos ofrecer ese salario.'],['Unfortunately, we have decided to move forward with another candidate.','Lamentablemente, decidimos continuar con otra candidatura.'],['Your profile is not quite what we\'re looking for at the moment.','Tu perfil no se ajusta del todo a lo que buscamos por ahora.']]},
 {k:'table',h:'Directo y amable',head:['Directo (mejor evitar)','Más amable'],rows:[['Give me your CV.','Could you send me your CV, please?'],['I need your answer today.','Would it be possible to get your answer today?'],['You didn\'t send the form.','It seems the form hasn\'t reached us yet.']]},
 {k:'note',type:'tip',h:'Please y thank you',t:'En el inglés profesional la cortesía no es opcional. **Please** y **thank you** suavizan cualquier pedido.'},
 {k:'wrong',h:'Errores frecuentes',items:[['Would you mind to send the file?','Would you mind sending the file?','Después de «mind» va verbo + -ing.'],['Can you to help me?','Could you help me?','Después de can o could no se usa to.'],['I want that you send me the form.','I would like you to send me the form.','En inglés: would like + persona + to + verbo, sin «that».']]},
 {k:'phr',h:'Frases útiles',items:[['Thank you for your patience.','Gracias por su paciencia.'],['I apologize for the inconvenience.','Pido disculpas por las molestias.'],['Please let me know if you have any questions.','Avisame si tenés alguna consulta.'],['I would appreciate it if you could…','Le agradecería que pudiera…']]}
 ],
 check:[
 {q:'¿Cuál suena más amable para pedir un documento?',o:['Send me the file.','I need the file now.','Could you send me the file, please?','You must send the file.'],a:2,why:'Could you… please es una forma indirecta y cortés.'},
 {q:'«Would you mind ___ the form today?»',o:['to complete','completing','complete','completed'],a:1,why:'Después de «mind» va verbo + -ing.'},
 {q:'Rechazo respetuoso: ¿cuál es mejor?',o:['You are not good for the job.','Unfortunately, we have decided to move forward with other candidates.','We don\'t want you.','No.'],a:1,why:'Es claro, amable y no juzga a la persona.'},
 {q:'«I was wondering ___ you could share your availability.»',o:['that','if','to','what'],a:1,why:'«I was wondering if…» es una forma cortés de pedir.'},
 {q:'Ofrecer ayuda: «___ you like me to send the details?»',o:['Do','Would','Are','Can'],a:1,why:'Would you like me to… ofrece ayuda con amabilidad.'},
 {q:'¿Cómo se formula un pedido con would like?',o:['I want that you confirm.','I want you confirm.','I would like you to confirm.','I would like that you confirm.'],a:2,why:'Would like + persona + to + verbo.'}
 ]},
{id:'l05',n:5,t:'Ofertas y negociación',en:'Conditionals for offers and negotiation',lvl:'B2',cat:'Gramática aplicada',
 goal:'Presentar condiciones, hacer propuestas y negociar con tono profesional.',
 why:'Las ofertas, las contraofertas y las condiciones de ingreso se expresan casi siempre con condicionales.',
 blocks:[
 {k:'rule',h:'Primer condicional: una situación real',t:'**If + presente, will + verbo base.** Después de «if» no se usa will.',
  ex:[['If you accept the offer, we will send the contract today.','Si aceptás la oferta, te enviamos el contrato hoy.'],['If the candidate passes the test, we\'ll invite her to a final interview.','Si la candidata aprueba la prueba, la invitamos a una entrevista final.']]},
 {k:'rule',h:'Segundo condicional: hipotético o más cortés',t:'**If + pasado simple, would + verbo base.** Con «I» o «he/she» se acepta **were** («If I were you…»).',
  ex:[['If you joined the team, you would report to the HR manager.','Si te sumaras al equipo, responderías ante la gerencia de RRHH.'],['We could offer more flexibility if you were able to start in January.','Podríamos ofrecer más flexibilidad si pudieras empezar en enero.'],['If I were in your position, I would ask for more details.','En tu lugar, yo pediría más detalles.']]},
 {k:'rule',h:'Otras conexiones útiles',t:'**unless** (a menos que), **as long as / provided that** (siempre que), **in case** (por si acaso).',
  ex:[['Unless you have another offer, we\'d like you to start in March.','A menos que tengas otra oferta, nos gustaría que empieces en marzo.'],['You will receive the bonus as long as you meet your targets.','Vas a recibir el bono siempre que cumplas tus objetivos.']]},
 {k:'table',h:'Resumen',head:['Tipo','If…','Resultado','Uso'],rows:[['Primero','presente','will + base','posible, real'],['Segundo','pasado','would + base','hipotético o más cortés']]},
 {k:'note',type:'tip',h:'En una negociación',t:'El segundo condicional suena más suave. «If we increased the offer, would you accept?» abre la conversación; «If we increase it, will you accept?» suena a trato cerrado.'},
 {k:'wrong',h:'Errores frecuentes',items:[['If you will accept, we will send the contract.','If you accept, we will send the contract.','Después de if no se usa will.'],['If I would have more time, I would call you.','If I had more time, I would call you.','Segundo condicional: if + pasado, no would.'],['Unless you don\'t agree, we will proceed.','Unless you agree, we will proceed.','«Unless» ya significa «if… not».']]},
 {k:'phr',h:'Frases útiles',items:[['If you have any questions, please let me know.','Si tenés alguna consulta, avisame.'],['Would you be open to…?','¿Estarías dispuesto/a a…?'],['Provided that the references are positive…','Siempre que las referencias sean positivas…'],['We would be happy to… if…','Estaríamos encantados de… si…']]}
 ],
 check:[
 {q:'«If you ___ the offer, we will send the contract.»',o:['will accept','accept','would accept','accepted'],a:1,why:'Primer condicional: if + presente.'},
 {q:'«If I ___ you, I would ask about the benefits.»',o:['am','was being','were','will be'],a:2,why:'«If I were you» es la forma estándar.'},
 {q:'«We ___ more flexibility if you could start in March.»',o:['will offer','would offer','offer','offered'],a:1,why:'Segundo condicional: would + verbo base.'},
 {q:'«___ you have another offer, we\'d like you to start soon.» (a menos que)',o:['If','Unless','When','Although'],a:1,why:'«Unless» significa «a menos que».'},
 {q:'¿Qué condicional está bien armado?',o:['If she will accept, we will start the process.','If she accepts, we will start the process.','If she accepted, we will start the process.','If she would accept, we start the process.'],a:1,why:'If + presente, will + base.'},
 {q:'«You will get the bonus ___ you meet your targets.» (siempre que)',o:['unless','as long as','in case','even if'],a:1,why:'«As long as» equivale a «siempre que».'}
 ]},
{id:'l06',n:6,t:'Avisos y políticas: la voz pasiva',en:'Passive voice',lvl:'B1',cat:'Gramática aplicada',
 goal:'Redactar avisos, comunicados y políticas con tono formal.',
 why:'En español usamos mucho el «se» impersonal (se revisan, se notificará). En inglés eso casi siempre es voz pasiva.',
 blocks:[
 {k:'rule',h:'Cómo se forma',t:'**be + participio pasado.** El verbo be indica el tiempo: is / are (presente), was / were (pasado), will be (futuro), must be (con modal).',
  ex:[['Applications are reviewed every Friday.','Las postulaciones se revisan todos los viernes.'],['The position was filled last month.','El puesto se cubrió el mes pasado.'],['Candidates will be contacted by email.','Se contactará a los candidatos por correo.'],['All documents must be submitted by Monday.','Toda la documentación debe presentarse a más tardar el lunes.']]},
 {k:'rule',h:'Cuándo usarla',t:'Cuando importa la acción y no quién la realiza, o cuando querés un tono formal. Si el responsable importa, se agrega **by**.',
  ex:[['The new policy was approved by the management team.','La nueva política fue aprobada por el equipo directivo.']]},
 {k:'table',h:'Activa y pasiva',head:['Activa','Pasiva'],rows:[['We will contact you.','You will be contacted.'],['HR reviews all CVs.','All CVs are reviewed by HR.'],['They paid the salaries on Friday.','The salaries were paid on Friday.']]},
 {k:'table',h:'Participios irregulares frecuentes',head:['Verbo','Participio','Ejemplo'],rows:[['send','sent','The offer was sent.'],['give','given','Feedback is given every month.'],['make','made','The decision was made.'],['write','written','The contract is written in English.'],['hold','held','Interviews are held online.'],['pay','paid','Salaries are paid monthly.'],['take','taken','Notes were taken.']]},
 {k:'note',type:'tip',h:'Pista para traducir',t:'Si en español decís «se + verbo» (se revisan, se publicará), en inglés probablemente necesitás la pasiva.'},
 {k:'wrong',h:'Errores frecuentes',items:[['The CV was send yesterday.','The CV was sent yesterday.','Se usa el participio: send → sent.'],['Candidates are been interviewed.','Candidates are being interviewed.','Para una acción en curso: is / are + being + participio.'],['The job is post on our website.','The job is posted on our website.','Falta el participio (-ed).']]},
 {k:'phr',h:'Frases de avisos',items:[['Applications must be submitted by…','Las postulaciones deben presentarse a más tardar el…'],['You will be notified by email.','Se le notificará por correo.'],['The position has been filled.','El puesto ya fue cubierto.'],['Interviews will be held online.','Las entrevistas se realizarán en línea.']]}
 ],
 check:[
 {q:'«All CVs ___ by the HR team.»',o:['review','are reviewed','are reviewing','reviewed are'],a:1,why:'Presente pasivo: are + participio.'},
 {q:'«The offer ___ yesterday.»',o:['was sent','sent','is send','was send'],a:0,why:'Pasado pasivo: was + participio (sent).'},
 {q:'«Candidates ___ by email next week.»',o:['will contact','will be contacted','are contact','will contacted'],a:1,why:'Futuro pasivo: will be + participio.'},
 {q:'«The position ___ filled.» (ya fue cubierto)',o:['has been','have been','is being been','was being'],a:0,why:'Present Perfect pasivo: has been + participio.'},
 {q:'Pasiva de «HR will publish the results»:',o:['The results will publish by HR.','The results will be published by HR.','The results are publishing by HR.','The results published will be.'],a:1,why:'will be + participio.'},
 {q:'«Interviews ___ online.» (se realizan)',o:['hold','are held','are holding','held are'],a:1,why:'Presente pasivo: are + held.'}
 ]}
];

LESSONS.push(
{id:'l07',n:7,t:'Correos profesionales',en:'Professional emails',lvl:'A2',cat:'Comunicación',
 goal:'Escribir correos claros, con el tono y la estructura que se espera en el trabajo.',
 why:'El correo es la herramienta diaria de RRHH: invitaciones, respuestas, comunicados y ofertas.',
 blocks:[
 {k:'table',h:'Estructura de un correo',head:['Parte','Ejemplo'],rows:[['Asunto','Interview for the HR Assistant position'],['Saludo','Dear Ms. Pérez, / Hello Laura,'],['Motivo','I\'m writing to confirm your interview.'],['Detalle','The interview will take place on Thursday at 10:00 a.m.'],['Pedido','Could you please confirm your availability?'],['Cierre','Looking forward to hearing from you.'],['Firma','Best regards, / Name / HR Department']]},
 {k:'rule',h:'Formal o neutro',t:'Con una persona que no conocés, o en una comunicación oficial, usá **Dear + Mr./Ms. + apellido**. Entre colegas o con un tono cercano alcanza con **Hello + nombre**. Si no sabés quién lee, **Dear Hiring Team** funciona bien. Para cerrar: **Kind regards** o **Best regards**.',
  ex:[['Dear Ms. Pérez,','Estimada Sra. Pérez:'],['Hello Laura,','Hola, Laura:'],['Dear Hiring Team,','Estimado equipo de selección:']]},
 {k:'note',type:'tip',h:'Adjuntos y pedidos',t:'Decí «I\'m attaching my CV» o «Please find my CV attached». No existe «I send you attached».'},
 {k:'note',type:'info',h:'Una idea por párrafo',t:'Los correos breves y ordenados se leen y se responden más rápido. Poné lo que necesitás de la otra persona al principio o al final, de forma bien visible.'},
 {k:'wrong',h:'Errores frecuentes',items:[['I send you attached my CV.','I\'m attaching my CV.','En inglés no se usa «send you attached».'],['Dear Laura Pérez González,','Dear Ms. Pérez,','Se usa título + apellido, no el nombre completo.'],['Regards cordially,','Kind regards,','Cierres habituales: Kind regards, Best regards, Sincerely.'],['I\'m waiting for your answer.','I look forward to hearing from you.','La primera suena impaciente.']]},
 {k:'phr',h:'Frases para armar correos',items:[['I\'m writing to…','Te escribo para…'],['Thank you for your application.','Gracias por tu postulación.'],['Please find attached…','Adjunto…'],['Could you please confirm…?','¿Podrías confirmar…?'],['Looking forward to hearing from you.','Quedo a la espera de tu respuesta.'],['Best regards,','Saludos cordiales,']]}
 ],
 check:[
 {q:'¿Cuál es un buen asunto para una invitación?',o:['Hello','Interview invitation – HR Assistant position','URGENT!!!','Question'],a:1,why:'Es claro, específico y profesional.'},
 {q:'Para adjuntar tu CV:',o:['I send you attached my CV.','I\'m attaching my CV.','I attach you my CV.','Attached send CV.'],a:1,why:'«I\'m attaching…» es la forma natural.'},
 {q:'Saludo adecuado para una persona desconocida:',o:['Hey Laura!','Dear Ms. Pérez,','Yo Laura,','Hi bro,'],a:1,why:'Dear + título + apellido es formal y seguro.'},
 {q:'Un cierre cordial es:',o:['Bye,','Kind regards,','Chau,','Regards cordially,'],a:1,why:'Kind regards es un cierre estándar y amable.'},
 {q:'¿Qué frase abre mejor el motivo?',o:['I\'m writing to confirm your interview.','I write for confirming.','I\'m wanting confirm.','This email is for confirm.'],a:0,why:'«I\'m writing to + verbo» es la apertura típica.'}
 ]},
{id:'l08',n:8,t:'Responder con el método STAR',en:'Behavioral answers',lvl:'B2',cat:'Entrevistas',
 goal:'Contar situaciones reales de forma ordenada y convincente.',
 why:'Las entrevistas por competencias piden ejemplos concretos. STAR los ordena y evita respuestas vagas.',
 blocks:[
 {k:'table',h:'Los cuatro pasos',head:['Letra','Significa','Responde a…','Para arrancar'],rows:[['S','Situation (situación)','¿Cuál era el contexto?','At my previous job, we had…'],['T','Task (tarea)','¿Cuál era tu responsabilidad?','I was responsible for…'],['A','Action (acción)','¿Qué hiciste vos?','I decided to… / I organized…'],['R','Result (resultado)','¿Qué pasó? ¿Qué aprendiste?','As a result,… / I learned that…']]},
 {k:'rule',h:'Ejemplo completo (ilustrativo)',t:'Pregunta: **«Tell me about a time you solved a problem.»**',
  ex:[['S: In my last job, one department had a high absenteeism rate.','S: En mi último trabajo, un sector tenía un ausentismo alto.'],['T: I was asked to find the causes and propose solutions.','T: Me pidieron encontrar las causas y proponer soluciones.'],['A: I interviewed the team, analyzed the data and suggested more flexible schedules.','A: Entrevisté al equipo, analicé los datos y propuse horarios más flexibles.'],['R: As a result, absenteeism decreased within three months.','R: Como resultado, el ausentismo bajó en tres meses.']]},
 {k:'note',type:'tip',h:'Cómo se cuenta',t:'Usá **Past Simple** y hablá en primera persona: «I» muestra tu aporte, «we» sirve para el contexto del equipo. Cerrá con un dato concreto o con un aprendizaje.'},
 {k:'wrong',h:'Errores frecuentes',items:[['We did everything and it was good.','I analyzed the data and proposed a new schedule; absenteeism decreased.','Falta tu acción concreta y un resultado.'],['I am solving the problem by talking.','I solved the problem by talking to each person.','Una historia pasada va en Past Simple.']]},
 {k:'phr',h:'Frases para cada paso',items:[['Let me give you an example.','Te doy un ejemplo.'],['The situation was…','La situación era…'],['My role was to…','Mi rol era…'],['What I did was…','Lo que hice fue…'],['The outcome was…','El resultado fue…'],['I learned that…','Aprendí que…']]}
 ],
 check:[
 {q:'«I was responsible for coordinating the interviews.» corresponde a:',o:['Situation','Task','Action','Result'],a:1,why:'Describe la responsabilidad: Task.'},
 {q:'«As a result, turnover decreased.» corresponde a:',o:['Situation','Task','Action','Result'],a:3,why:'Cuenta lo que pasó: Result.'},
 {q:'«I analyzed the data and met each manager.» corresponde a:',o:['Situation','Task','Action','Result'],a:2,why:'Dice qué hiciste vos: Action.'},
 {q:'«In my last job, the team was growing fast.» corresponde a:',o:['Situation','Task','Action','Result'],a:0,why:'Describe el contexto: Situation.'},
 {q:'¿Qué tiempo verbal predomina en una respuesta STAR?',o:['Present Simple','Past Simple','Future','Present Continuous'],a:1,why:'Contás algo que ya pasó.'},
 {q:'¿Qué mejora más tu respuesta?',o:['Hablar solo del equipo','Incluir tu acción concreta y un resultado','Evitar los datos','Responder en una sola frase'],a:1,why:'Acción y resultado son lo que la persona entrevistadora quiere evaluar.'}
 ]},
{id:'l09',n:9,t:'Dar una devolución con claridad y respeto',en:'Giving feedback',lvl:'B2',cat:'Comunicación',
 goal:'Dar feedback constructivo, basado en hechos, sin generar rechazo.',
 why:'Las devoluciones de desempeño y las conversaciones difíciles son parte central del rol de RRHH.',
 blocks:[
 {k:'rule',h:'Modelo SBI: Situation, Behavior, Impact',t:'Describí **la situación**, **la conducta observable** y **el impacto** que tuvo.',
  ex:[['In yesterday\'s meeting, you interrupted two colleagues several times, and it made it difficult for them to share their ideas.','En la reunión de ayer interrumpiste varias veces a dos compañeros, y eso les dificultó compartir sus ideas.']]},
 {k:'table',h:'Hechos y no juicios',head:['En vez de…','Mejor…'],rows:[['You always miss deadlines.','Last month, two reports were submitted after the deadline.'],['You\'re not a team player.','I noticed you worked alone on the last project; I\'d like to see more collaboration.'],['Your work is bad.','Parts of the report need more detail; let\'s review them together.']]},
 {k:'note',type:'warn',h:'Cuidado con always y never',t:'Generalizan y ponen a la persona a la defensiva. Es mejor citar un hecho puntual.'},
 {k:'wrong',h:'Errores frecuentes',items:[['You should to improve your attitude.','It would help if you could participate more in meetings.','Should no lleva to, y «attitude» es un juicio: describí la conducta.'],['I want to talk with you about your problem.','I\'d like to talk to you about last week\'s report.','«Problem» suena acusatorio; nombrá un tema concreto.']]},
 {k:'phr',h:'Frases útiles',items:[['Do you have a few minutes to talk?','¿Tenés unos minutos para hablar?'],['I\'d like to share some feedback.','Quisiera compartirte una devolución.'],['I really appreciated how you…','Valoré mucho cómo…'],['Going forward, it would help if…','De ahora en adelante, ayudaría que…'],['What I\'d like to see is…','Lo que me gustaría ver es…'],['How do you see the situation?','¿Cómo ves la situación?']]}
 ],
 check:[
 {q:'En SBI, la B corresponde a:',o:['Benefit','Behavior','Boss','Barrier'],a:1,why:'B es Behavior: la conducta observable.'},
 {q:'¿Cuál es feedback basado en hechos?',o:['You\'re lazy.','You were late three times this week.','You never listen.','You have a bad attitude.'],a:1,why:'Describe un hecho que se puede verificar.'},
 {q:'Frase para abrir con respeto:',o:['We need to talk. Now.','Do you have a few minutes to talk?','You\'re in trouble.','Listen to me.'],a:1,why:'Invita a conversar en lugar de imponer.'},
 {q:'¿Cuál evita generalizar?',o:['You always interrupt.','In today\'s meeting, you interrupted twice.','You never let others talk.','You are rude.'],a:1,why:'Cita un hecho puntual.'},
 {q:'«Going forward, it ___ help if you could share updates earlier.»',o:['will','would','is','does'],a:1,why:'Would suaviza la sugerencia.'},
 {q:'En SBI, la I describe:',o:['El impacto de la conducta','La intención de la persona','La identidad','El incentivo'],a:0,why:'I es Impact: el efecto que tuvo.'}
 ]},
{id:'l10',n:10,t:'Avisos de búsqueda laboral',en:'Writing a job post',lvl:'B1',cat:'Comunicación',
 goal:'Redactar un aviso claro, atractivo e inclusivo.',
 why:'El aviso es la primera impresión de la empresa y define a quiénes vas a atraer.',
 blocks:[
 {k:'table',h:'Estructura de un aviso',head:['Sección','Qué incluye','Ejemplo'],rows:[['About us','Quiénes son','We are a growing logistics company based in Rosario.'],['The role','Para qué existe el puesto','We are looking for an HR Assistant to support our recruitment team.'],['Responsibilities','Qué va a hacer','You will post job ads and schedule interviews.'],['Requirements','Qué se necesita','Degree in Labor Relations or similar.'],['Nice to have','Suma, no es excluyente','Experience with HR software.'],['What we offer','Beneficios','Hybrid work and training opportunities.'],['How to apply','Cómo postularse','Send your CV to…']]},
 {k:'rule',h:'Lenguaje típico',t:'**You will + verbo** para tareas; **ability to…, proficiency in…, strong … skills, knowledge of…** para requisitos. Con áreas se usa **experience in**; con herramientas, **experience with**.',
  ex:[['You will be responsible for the onboarding process.','Serás responsable del proceso de inducción.'],['Strong communication and organizational skills.','Excelentes habilidades de comunicación y organización.'],['Experience in recruitment and with HR software.','Experiencia en reclutamiento y con software de RRHH.'],['Fluent English (B2 or higher).','Inglés fluido (B2 o superior).']]},
 {k:'rule',h:'Lenguaje inclusivo y neutral',t:'Describí habilidades y no características personales. Evitá pedir edad, sexo, estado civil o foto. Usá títulos neutros (**salesperson**, **chairperson**) y el **they** singular cuando no sabés el género.',
  ex:[['We are looking for a motivated salesperson.','Buscamos una persona de ventas motivada.'],['Each candidate should bring their CV.','Cada candidato o candidata debe traer su CV.'],['We welcome applications from all backgrounds.','Recibimos postulaciones de todos los perfiles.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['We need a young and dynamic assistant.','We are looking for a motivated assistant.','«Young» (joven) puede ser discriminatorio: describí habilidades.'],['We search a person with experience.','We are looking for a person with experience.','«Buscar a alguien» es look for.'],['Knowledge of English fluently.','Fluent English.','«Fluent» es adjetivo; «fluently», adverbio.']]},
 {k:'phr',h:'Frases útiles',items:[['We are looking for…','Estamos buscando…'],['You will be responsible for…','Serás responsable de…'],['Proven experience in…','Experiencia comprobable en…'],['Equal opportunity employer','Empleador que ofrece igualdad de oportunidades'],['Apply now by sending your CV to…','Postulate enviando tu CV a…']]}
 ],
 check:[
 {q:'¿En qué sección van las tareas del puesto?',o:['Requirements','Responsibilities','What we offer','About us'],a:1,why:'Responsibilities describe lo que la persona va a hacer.'},
 {q:'¿Cuál es más inclusivo?',o:['We need a young salesman.','We are looking for a motivated salesperson.','Candidates must be single.','Only women.'],a:1,why:'Describe habilidades y usa un título neutro.'},
 {q:'«Experience ___ recruitment» (un área)',o:['in','with','at','on'],a:0,why:'Experience in + área.'},
 {q:'Los beneficios van en la sección:',o:['What we offer','Requirements','The role','Nice to have'],a:0,why:'Es lo que ofrece la empresa.'},
 {q:'«Nice to have» significa:',o:['Obligatorio','Suma, pero no es excluyente','Beneficio','Sueldo'],a:1,why:'Es deseable, no indispensable.'},
 {q:'Para las tareas del puesto se suele usar:',o:['You will…','You did…','You have…','You has…'],a:0,why:'«You will…» describe lo que hará la persona.'}
 ]},
{id:'l11',n:11,t:'Hablar de métricas de RRHH',en:'Talking about numbers and trends',lvl:'B2',cat:'Vocabulario',
 goal:'Presentar indicadores, cambios y tendencias con precisión.',
 why:'Reportar rotación, ausentismo o tiempos de cobertura es parte del trabajo de análisis de RRHH.',
 blocks:[
 {k:'table',h:'Indicadores frecuentes',head:['Término','Significa','Ejemplo'],rows:[['headcount','dotación (cantidad de personas)','Our headcount is 240.'],['turnover rate','rotación de personal','Turnover fell to 9%.'],['absenteeism rate','ausentismo','Absenteeism rose slightly.'],['time to fill','tiempo que lleva cubrir una vacante','Time to fill is 35 days on average.'],['cost per hire','costo por contratación','Cost per hire decreased this quarter.'],['retention rate','tasa de retención','Retention rate improved.'],['engagement score','nivel de compromiso','The engagement score is 78.']]},
 {k:'rule',h:'Verbos de cambio y preposiciones',t:'**increase / rise / grow** (subir), **decrease / fall / drop** (bajar), **remain stable** (mantenerse). Con **by** decís cuánto cambió, con **to** el valor final y con **from… to…** de dónde a dónde.',
  ex:[['Turnover increased by 3 points.','La rotación aumentó 3 puntos.'],['Turnover rose from 8% to 11%.','La rotación subió del 8% al 11%.'],['Absenteeism remained stable at 4%.','El ausentismo se mantuvo estable en 4%.'],['Time to fill decreased by 20%.','El tiempo de cobertura bajó un 20%.']]},
 {k:'note',type:'info',h:'Cómo se escriben los números',t:'En inglés la **coma** separa los miles y el **punto** los decimales, al revés que en Argentina: 1,200 (mil doscientos) y 2.5 (dos coma cinco). 8% se lee «eight percent».'},
 {k:'rule',h:'Aproximar',t:'**around, about, approximately, nearly, almost, just over**',ex:[['We have approximately 300 employees.','Tenemos aproximadamente 300 empleados.'],['Turnover is just over 10%.','La rotación está un poco por encima del 10%.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['Turnover increased in 3%.','Turnover increased by 3%.','El cambio se expresa con by.'],['The rate fell of 12% to 9%.','The rate fell from 12% to 9%.','Se usa from… to….'],['We have 1.200 employees.','We have 1,200 employees.','En inglés la coma separa los miles.']]},
 {k:'phr',h:'Frases útiles',items:[['Compared to last year,…','En comparación con el año pasado,…'],['On average,…','En promedio,…'],['This represents an increase of…','Esto representa un aumento de…'],['The main driver was…','El principal factor fue…']]}
 ],
 check:[
 {q:'«Turnover ___ from 8% to 11%.»',o:['rose','raised','rised','arose'],a:0,why:'Rose (de rise) no lleva objeto; raised sí.'},
 {q:'«Absenteeism decreased ___ 2 points.»',o:['by','in','of','for'],a:0,why:'Con by indicás cuánto cambió.'},
 {q:'¿Cómo se escribe 1.200 empleados en inglés?',o:['1.200','1,200','1 200,0','1\'200'],a:1,why:'En inglés la coma separa los miles.'},
 {q:'«Headcount» es:',o:['Costo','Dotación','Rotación','Ausentismo'],a:1,why:'Es la cantidad de personas de la organización.'},
 {q:'«Remained stable at 4%» significa:',o:['Subió a 4%','Se mantuvo en 4%','Bajó a 4%','Llegó al máximo'],a:1,why:'Remain stable es «mantenerse».'},
 {q:'«Time to fill» mide:',o:['El costo por hora','El tiempo que lleva cubrir una vacante','La duración de la jornada','La edad promedio'],a:1,why:'Es un indicador de reclutamiento.'}
 ]},
{id:'l12',n:12,t:'Falsos amigos y errores típicos',en:'False friends and common mistakes',lvl:'B1',cat:'Vocabulario',
 goal:'Evitar los errores que más se repiten al hablar de trabajo en inglés.',
 why:'Estas confusiones aparecen en CV, correos y entrevistas, y suelen notarse enseguida.',
 blocks:[
 {k:'table',h:'Falsos amigos del mundo laboral',head:['Se parece a…','Pero significa','Para decir lo que querés'],rows:[['actually','en realidad','currently / at the moment (actualmente)'],['career','trayectoria profesional','degree (carrera universitaria)'],['to assist','ayudar','to attend (asistir a)'],['application','postulación o solicitud','app (aplicación del celular)'],['to resume','retomar o reanudar','résumé / CV (currículum)'],['compromise','acuerdo con concesiones','commitment (compromiso)'],['sensible','sensato, razonable','sensitive (delicado, sensible)'],['to realize','darse cuenta','to carry out (realizar)'],['eventually','al final, con el tiempo','possibly / occasionally (eventualmente)']]},
 {k:'rule',h:'Palabras incontables',t:'**information, advice, feedback, work, news, equipment** no llevan «a/an» ni plural. Se dice «some information», «a piece of advice». En cambio, **job** (puesto) sí es contable.',
  ex:[['Can you give me some information?','¿Me das información?'],['Thank you for your feedback.','Gracias por tu devolución.'],['She has a job in HR.','Tiene un trabajo en RRHH.']]},
 {k:'rule',h:'Sueldo: salary, wage y pay',t:'**Salary** es un monto fijo mensual o anual, **wage** se calcula por hora o por jornada, y **pay** es el término general.',
  ex:[['Her salary is paid monthly.','Su sueldo se paga por mes.'],['Wages are paid weekly.','Los jornales se pagan por semana.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['I need an information.','I need some information.','Information es incontable.'],['She gave me many advices.','She gave me a lot of advice.','Advice es incontable.'],['I have a work in HR.','I have a job in HR.','«Job» es el puesto; «work» no lleva artículo.'],['I\'m agree with the policy.','I agree with the policy.','«Agree» es un verbo: no lleva am.']]},
 {k:'phr',h:'Frases útiles',items:[['I currently work in HR.','Actualmente trabajo en RRHH.'],['I have a degree in Labor Relations.','Tengo un título en Relaciones del Trabajo.'],['I attended a training on…','Asistí a una capacitación sobre…'],['I\'d like to apply for the position.','Quisiera postularme al puesto.']]}
 ],
 check:[
 {q:'«Actualmente trabajo en RRHH» se dice:',o:['I actually work in HR.','I currently work in HR.','I actual work in HR.','I\'m actually working HR.'],a:1,why:'«Actually» significa «en realidad».'},
 {q:'«Tengo una carrera en Relaciones del Trabajo» (título):',o:['I have a career in Labor Relations.','I have a degree in Labor Relations.','I have a race in Labor Relations.','I have a career title.'],a:1,why:'Para el título universitario se dice degree.'},
 {q:'«Asistí a la capacitación»:',o:['I assisted the training.','I attended the training.','I assisted to the training.','I attend to the training.'],a:1,why:'Attend es asistir a un evento.'},
 {q:'«Necesito información»:',o:['I need an information.','I need some information.','I need informations.','I need a information.'],a:1,why:'Information es incontable.'},
 {q:'«Me postulé al puesto»:',o:['I applied for the position.','I applied the position.','I made application the position.','I put application of the position.'],a:0,why:'Apply for = postularse a un puesto.'},
 {q:'«This is ___ information.» (delicada)',o:['sensible','sensitive','sensitivity','sensed'],a:1,why:'Sensitive significa delicado.'}
 ]}
);

/* Plantillas de correo: cada una arma el texto en inglés y su versión en español a partir de los campos */
const TPL=[
{id:'e01',t:'Invitar a una entrevista',when:'Cuando una persona pasó la primera selección.',
 f:[['name','Nombre de la persona','Laura'],['role','Puesto','HR Assistant'],['day','Día','Thursday, November 20'],['time','Hora','10:00 a.m.'],['mode','Modalidad','by video call'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Interview invitation – ${f.role}\n\nDear ${f.name},\n\nThank you for applying for the ${f.role} position. We were impressed by your profile and would like to invite you to an interview.\n\nDate: ${f.day}\nTime: ${f.time} (Argentina time)\nFormat: ${f.mode}\n\nCould you please confirm your availability? If this time does not work for you, let me know and we will find another option.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Invitación a entrevista – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por postularte al puesto de ${f.role}. Tu perfil nos pareció muy interesante y nos gustaría invitarte a una entrevista.\n\nFecha: ${f.day}\nHora: ${f.time} (hora de Argentina)\nModalidad: ${f.mode}\n\n¿Podrías confirmarnos tu disponibilidad? Si ese horario no te resulta conveniente, avisanos y buscamos otra opción.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e02',t:'Confirmar la recepción de una postulación',when:'Respuesta automática o manual a quien se postula.',
 f:[['name','Nombre de la persona','Martín'],['role','Puesto','Payroll Analyst'],['days','Plazo estimado de respuesta','two weeks'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: We have received your application – ${f.role}\n\nDear ${f.name},\n\nThank you for your interest in the ${f.role} position. We have received your application and our team is reviewing it.\n\nIf your profile matches what we are looking for, we will contact you within ${f.days}.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Recibimos tu postulación – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por tu interés en el puesto de ${f.role}. Recibimos tu postulación y nuestro equipo la está revisando.\n\nSi tu perfil se ajusta a lo que buscamos, nos vamos a comunicar con vos dentro de ${f.days}.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e03',t:'Comunicar que no continúa en el proceso',when:'Cierre respetuoso para quien no fue seleccionado.',
 f:[['name','Nombre de la persona','Martín'],['role','Puesto','Recruitment Coordinator'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Update on your application – ${f.role}\n\nDear ${f.name},\n\nThank you for the time and interest you dedicated to our selection process for the ${f.role} position.\n\nAfter careful consideration, we have decided to move forward with another candidate. This was not an easy decision, as your profile has many strengths.\n\nWith your permission, we would like to keep your CV on file for future opportunities.\n\nWe wish you the best in your professional career.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Novedades sobre tu postulación – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por el tiempo y el interés que dedicaste a nuestro proceso de selección para el puesto de ${f.role}.\n\nLuego de analizarlo con detenimiento, decidimos continuar con otra candidatura. No fue una decisión sencilla, ya que tu perfil tiene muchas fortalezas.\n\nSi estás de acuerdo, nos gustaría conservar tu CV para futuras búsquedas.\n\nTe deseamos lo mejor en tu carrera profesional.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e04',t:'Oferta de empleo',when:'Para comunicar formalmente una propuesta de ingreso.',
 f:[['name','Nombre de la persona','Sofía'],['role','Puesto','HR Analyst'],['start','Fecha de ingreso','Monday, December 1'],['boss','Responsable directo','the HR Manager'],['deadline','Respuesta hasta','Friday, November 21'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Job offer – ${f.role}\n\nDear ${f.name},\n\nWe are pleased to offer you the position of ${f.role}. Your experience and skills make you a great fit for our team.\n\nProposed start date: ${f.start}\nYou will report to: ${f.boss}\n\nThe details of the compensation and benefits package are described in the attached document.\n\nCould you please let us know your decision by ${f.deadline}? If you have any questions, I will be happy to answer them.\n\nWe hope you will join us.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Propuesta de empleo – ${f.role}\n\nEstimada/o ${f.name}:\n\nNos complace ofrecerte el puesto de ${f.role}. Tu experiencia y tus habilidades son una excelente combinación para nuestro equipo.\n\nFecha de ingreso propuesta: ${f.start}\nResponderás ante: ${f.boss}\n\nEl detalle de la compensación y los beneficios se encuentra en el documento adjunto.\n\n¿Podrías avisarnos tu decisión a más tardar el ${f.deadline}? Si tenés alguna consulta, con gusto te respondo.\n\nEsperamos que te sumes al equipo.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e05',t:'Bienvenida a una persona nueva',when:'Mensaje previo al primer día.',
 f:[['name','Nombre de la persona','Camila'],['day','Primer día','Monday, December 1'],['time','Hora de llegada','9:00 a.m.'],['place','Lugar','our main office'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Welcome to the team!\n\nDear ${f.name},\n\nWelcome to the team! We are very happy that you are joining us.\n\nYour first day will be ${f.day}. Please arrive at ${f.time} at ${f.place}. We will start with a welcome session and a tour, and you will meet your team.\n\nPlease bring your ID and the documents we requested.\n\nIf you have any questions before your first day, please do not hesitate to contact me.\n\nSee you soon!\n\n${f.sign}\nHR Department`,
 es:f=>`Asunto: ¡Bienvenida/o al equipo!\n\nEstimada/o ${f.name}:\n\n¡Te damos la bienvenida! Estamos muy contentos de que te sumes al equipo.\n\nTu primer día será el ${f.day}. Te esperamos a las ${f.time} en ${f.place}. Comenzaremos con una charla de bienvenida y un recorrido, y vas a conocer a tu equipo.\n\nTraé tu documento y la documentación que te solicitamos.\n\nSi tenés alguna consulta antes de tu primer día, no dudes en escribirme.\n\n¡Hasta pronto!\n\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e06',t:'Pedir documentación',when:'Para completar el legajo antes del ingreso.',
 f:[['name','Nombre de la persona','Camila'],['docs','Documentos a pedir','a copy of your ID, your CUIL and your bank details'],['deadline','Fecha límite','Wednesday, November 26'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Documents needed to complete your file\n\nDear ${f.name},\n\nTo complete your employee file, we need the following documents: ${f.docs}.\n\nCould you please send them by ${f.deadline}? You can reply to this email and attach the files.\n\nThank you for your help.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Documentación necesaria para completar tu legajo\n\nEstimada/o ${f.name}:\n\nPara completar tu legajo necesitamos la siguiente documentación: ${f.docs}.\n\n¿Podrías enviarla a más tardar el ${f.deadline}? Podés responder este correo y adjuntar los archivos.\n\nGracias por tu colaboración.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e07',t:'Reprogramar una entrevista',when:'Cuando hay que cambiar el día o la hora.',
 f:[['name','Nombre de la persona','Laura'],['role','Puesto','HR Assistant'],['old','Horario original','Thursday at 10:00 a.m.'],['new','Nueva propuesta','Friday at 11:00 a.m.'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Rescheduling your interview – ${f.role}\n\nDear ${f.name},\n\nI am writing to let you know that we need to reschedule your interview originally planned for ${f.old}${/[.!?]$/.test(f.old.trim())?'':'.'} I apologize for the inconvenience.\n\nWould ${f.new} work for you? If not, please let me know your availability and we will adjust the schedule.\n\nThank you for your understanding.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Cambio de horario de tu entrevista – ${f.role}\n\nEstimada/o ${f.name}:\n\nTe escribo para avisarte que necesitamos reprogramar tu entrevista, prevista originalmente para el ${f.old}. Pedimos disculpas por las molestias.\n\n¿Te quedaría bien el ${f.new}? Si no, contanos tu disponibilidad y ajustamos el horario.\n\nGracias por tu comprensión.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e08',t:'Responder una consulta de un empleado',when:'Dudas sobre recibos, licencias o beneficios.',
 f:[['name','Nombre de la persona','Julián'],['topic','Tema de la consulta','your vacation request'],['answer','Respuesta o próximo paso','we are reviewing it with your manager and will confirm it by Friday'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Re: Your inquiry about ${f.topic}\n\nHello ${f.name},\n\nThank you for your message about ${f.topic}.\n\nAt the moment, ${f.answer}.\n\nPlease let me know if you have any other questions. I am happy to help.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Re: Tu consulta sobre ${f.topic}\n\nHola, ${f.name}:\n\nGracias por tu mensaje sobre ${f.topic}.\n\nPor el momento, ${f.answer}.\n\nAvisame si tenés alguna otra consulta. Con gusto te ayudo.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`}
];

LESSONS.push(
{id:"l13",n:13,t:"Presentarte y romper el hielo",en:"Introducing yourself",lvl:"A2",cat:"Presentación",
 goal:"Presentarte en pocas oraciones: quién sos, a qué te dedicás y qué buscás.",
 why:"Toda entrevista, reunión o llamada nueva empieza con una presentación. Si la tenés ensayada, arrancás con seguridad aunque lo demás sea difícil.",
 blocks:[
 {k:"rule",h:"Los datos básicos con el verbo to be",t:"Para decir quién sos usá **I am / I'm** + nombre, o **My name is** en situaciones más formales. Para el trabajo sumá **I work as** + puesto, **I work at / for** + empresa y **I'm based in** + ciudad.",
  ex:[["Hi, I'm Carolina Díaz. I work as an HR analyst.","Hola, soy Carolina Díaz. Trabajo como analista de RRHH."],["I work for a manufacturing company in Córdoba.","Trabajo en una empresa industrial de Córdoba."],["I'm based in Buenos Aires.","Trabajo desde Buenos Aires."]]},
 {k:"rule",h:"La fórmula de 30 segundos: presente, pasado y futuro",t:"Una presentación profesional ordenada tiene tres partes: **1)** quién sos hoy (**present**), **2)** de dónde venís (**past**) y **3)** qué buscás (**future**). Con una oración por parte alcanza.",
  ex:[["I'm an HR generalist with four years of experience in recruitment and payroll.","Soy generalista de RRHH con cuatro años de experiencia en reclutamiento y liquidación de sueldos."],["Before that, I worked in a staffing agency, where I learned to manage high-volume hiring.","Antes trabajé en una agencia de empleo, donde aprendí a manejar contrataciones masivas."],["Now I'm looking for a role where I can grow in employee relations.","Ahora busco un puesto donde pueda crecer en relaciones laborales."]]},
 {k:"table",h:"Formal o informal",head:["Situación","Formal","Informal"],rows:[["Saludar","Good morning. It's a pleasure to meet you.","Hi! Nice to meet you."],["Decir tu nombre","My name is Laura Pérez.","I'm Laura."],["Preguntar el nombre","May I ask your name?","What's your name?"],["Despedirte","It was a pleasure meeting you.","See you soon!"]]},
 {k:"note",type:"info",h:"Qué no hace falta decir",t:"En muchos países no se espera que menciones tu edad, tu estado civil ni que agregues una foto al CV. Presentate por lo que sabés hacer."},
 {k:"wrong",h:"Errores frecuentes",items:[["I have 30 years.","I'm 30 years old.","En inglés la edad se dice con to be, no con have."],["I am five years of experience.","I have five years of experience.","La experiencia se tiene (have); no se «es»."],["I am work in HR.","I work in HR.","Con un verbo de acción no se agrega am."]]},
 {k:"phr",h:"Frases para presentarte y romper el hielo",items:[["Nice to meet you. I'm…","Encantada de conocerte. Soy…"],["I'd like to introduce myself.","Quisiera presentarme."],["Let me introduce my colleague, Martín.","Te presento a mi colega Martín."],["How's your day going?","¿Cómo viene tu día?"],["Did you find the office easily?","¿Encontraste la oficina sin problemas?"],["Thank you for having me.","Gracias por recibirme."],["Where are you from?","¿De dónde sos?"],["I'm from Rosario, but I live in Buenos Aires.","Soy de Rosario, pero vivo en Buenos Aires."]]}
 ],
 check:[
 {q:"«Hi, I ___ Martín. I work as a recruiter.»",o:["am","have","do","work"],a:0,why:"Para decir tu nombre se usa I am (I'm)."},
 {q:"¿Cómo se dice «Tengo 35 años»?",o:["I have 35 years.","I'm 35 years old.","I am 35 years.","I have 35 years old."],a:1,why:"La edad se expresa con to be: I'm 35 (years old)."},
 {q:"¿Qué parte de una presentación de 30 segundos cuenta lo que buscás?",o:["Present","Past","Future","Greeting"],a:2,why:"La fórmula termina con el futuro: lo que querés hacer."},
 {q:"¿Cuál saludo es más formal?",o:["Hi! I'm Laura.","Good morning. It's a pleasure to meet you.","Hey, what's up?","See ya!"],a:1,why:"«It's a pleasure to meet you» es la opción formal."},
 {q:"«I ___ for a consulting company in Rosario.»",o:["work","am work","works","working"],a:0,why:"Con I el verbo va en forma base: sin -s y sin am."},
 {q:"¿Cómo se expresa la experiencia laboral?",o:["I am five years of experience.","I have five years of experience.","I am having five years experience.","I has five years of experience."],a:1,why:"La experiencia se expresa con have."}
 ]},

{id:"l14",n:14,t:"Describir personas y personalidad",en:"Describing people",lvl:"A2",cat:"Presentación",
 goal:"Describir cómo es una persona (un compañero, un candidato, vos mismo/a) con adjetivos precisos y respetuosos.",
 why:"En RRHH describís perfiles todo el tiempo: en entrevistas, referencias y devoluciones. Los adjetivos justos hacen que tu descripción sea clara y profesional.",
 blocks:[
 {k:"rule",h:"To be + adjetivo: cómo es la persona",t:"Para describir la personalidad usá **to be + adjetivo**. En inglés el adjetivo **no cambia** por género ni por número: «a reliable woman», «reliable people». Para lo que alguien tiene, usá **have / has**.",
  ex:[["He is patient and very attentive to detail.","Es paciente y muy atento a los detalles."],["My manager is friendly, but he is also demanding.","Mi jefe es amable, pero también exigente."],["The new team members are enthusiastic.","Los nuevos integrantes del equipo son entusiastas."]]},
 {k:"table",h:"Intensidad: cuánto",head:["Grado","Palabras","Ejemplo"],rows:[["Poco","a bit · slightly","a bit nervous"],["Medio","quite · fairly","quite organized"],["Mucho","very · really","very reliable"],["Muchísimo","extremely · incredibly","extremely motivated"]]},
 {k:"table",h:"Cualidades que se valoran en el trabajo",head:["Adjetivo","Significa","En otras palabras"],rows:[["reliable","confiable","You can count on her."],["organized","organizado/a","Keeps files and deadlines under control."],["proactive","proactivo/a","Acts without waiting to be asked."],["collaborative","colaborativo/a","Works well with others."],["adaptable","adaptable","Adjusts quickly to change."],["detail-oriented","detallista","Rarely misses a mistake."]]},
 {k:"rule",h:"Aspecto físico: solo cuando hace falta",t:"Para reconocer a alguien (por ejemplo, en recepción) se usa **He / She is + tall, short, slim…** y **has + pelo, barba**. El orden habitual es **opinión + tamaño + edad + color**. En un proceso de selección el aspecto no se evalúa.",
  ex:[["She is tall, with short dark hair and glasses.","Es alta, de pelo corto y oscuro, y usa anteojos."],["He has a beard and wears a blue jacket.","Tiene barba y lleva una campera azul."]]},
 {k:"note",type:"warn",h:"En RRHH: hechos, no etiquetas",t:"En evaluaciones y referencias describí **conductas observables**, no rasgos personales ni características como edad, apariencia o estado civil. Mejor «She meets every deadline» que «She is a nice girl»."},
 {k:"wrong",h:"Errores frecuentes",items:[["My colleague is very sympathetic.","My colleague is very nice.","«Sympathetic» no significa «simpático»: quiere decir comprensivo ante el dolor ajeno. «Simpático» es nice o friendly."],["He is a very patience person.","He is a very patient person.","Patience es el sustantivo; el adjetivo es patient."],["He is shy and no talks much.","He is shy and doesn't talk much.","La negación se arma con doesn't + verbo."]]},
 {k:"phr",h:"Frases para describir a alguien",items:[["She is great at working under pressure.","Es muy buena para trabajar bajo presión."],["He tends to be quiet in meetings.","Suele ser callado en las reuniones."],["She gets along well with everyone.","Se lleva bien con todos."],["He is someone you can rely on.","Es alguien en quien se puede confiar."],["I would describe myself as organized and curious.","Me describiría como una persona organizada y curiosa."],["What is she like?","¿Cómo es ella?"]]}
 ],
 check:[
 {q:"«She is a very ___ person.»",o:["patience","patient","patiently","patients"],a:1,why:"Antes de un sustantivo va el adjetivo: patient."},
 {q:"¿Cómo se dice «Es muy confiable»?",o:["He is very reliable.","He has very reliable.","He is very reliability.","He very reliable."],a:0,why:"Personalidad: to be + adjetivo."},
 {q:"¿Qué significa «detail-oriented»?",o:["Detallista, atento a los detalles","Orientado a los clientes","Que evita los detalles","Que habla mucho"],a:0,why:"Detail-oriented describe a quien presta atención a los detalles."},
 {q:"«Sympathetic» en inglés significa:",o:["Simpático","Comprensivo ante el dolor ajeno","Antipático","Sincero"],a:1,why:"Es un falso amigo: «simpático» se dice nice o friendly."},
 {q:"¿Qué descripción es más adecuada en una evaluación de desempeño?",o:["She is young and energetic.","She meets every deadline and updates the team daily.","She is a nice girl.","She looks very professional."],a:1,why:"En RRHH conviene describir conductas observables."},
 {q:"«What is she like?» pregunta por:",o:["Qué le gusta","Cómo es (su personalidad)","Cómo se viste","Dónde vive"],a:1,why:"What is she like? pide una descripción. Para gustos se dice What does she like?"}
 ]},

{id:"l15",n:15,t:"Hablar de emociones y estados de ánimo",en:"Feelings and emotions",lvl:"B1",cat:"Presentación",
 goal:"Expresar cómo te sentís y entender cómo se sienten otras personas, con el tono justo para el trabajo.",
 why:"En entrevistas te preguntan cómo te sentís con el puesto, y en RRHH escuchás a diario a personas estresadas, frustradas o entusiasmadas. Responder con empatía y vocabulario preciso genera confianza.",
 blocks:[
 {k:"rule",h:"Feel o to be + emoción",t:"Se puede decir **I feel + adjetivo** o **I am + adjetivo**: «I feel nervous» / «I'm nervous». Para preguntar: **How are you feeling?** y **How do you feel about…?**",
  ex:[["I feel excited about the new role.","Me entusiasma el nuevo puesto."],["I'm a bit nervous before interviews.","Me pongo un poco nerviosa antes de las entrevistas."],["How are you feeling about the workload?","¿Cómo te sentís con la carga de trabajo?"]]},
 {k:"rule",h:"-ed o -ing: cómo me siento y qué lo causa",t:"Los adjetivos en **-ed** dicen **cómo se siente la persona** (bored, excited, tired). Los que terminan en **-ing** describen **lo que causa** ese sentimiento (boring, exciting, tiring).",
  ex:[["I am excited about the project.","Estoy entusiasmada con el proyecto."],["The project is exciting.","El proyecto es emocionante."],["The meeting was boring, so I was bored.","La reunión fue aburrida y yo me aburrí."]]},
 {k:"table",h:"Emociones en el trabajo",head:["Positivas","Inciertas","Difíciles"],rows:[["motivated · proud","curious · unsure","stressed · overwhelmed"],["grateful · confident","surprised · hesitant","frustrated · disappointed"],["relieved · satisfied","nervous · anxious","upset · burned out"]]},
 {k:"rule",h:"Escuchar y responder con empatía",t:"Cuando alguien comparte una preocupación, primero **reconocé la emoción** y después preguntá o proponé algo. Fórmula: **I understand that… / It sounds like…** + pregunta abierta.",
  ex:[["I understand that you feel overwhelmed. What would help you most right now?","Entiendo que te sientas desbordada. ¿Qué te ayudaría más en este momento?"],["It sounds like you are frustrated with the process.","Parece que estás frustrado con el proceso."],["Thank you for telling me. I appreciate your honesty.","Gracias por contármelo. Valoro tu sinceridad."]]},
 {k:"note",type:"tip",h:"En la entrevista: emociones positivas y concretas",t:"Para hablar de tus ganas usá **I'm excited about / I'm motivated by / I'm passionate about** y agregá un motivo: «I'm excited about this role because…». Si te preguntan cómo manejás la presión, nombrá la emoción y contá qué hacés para manejarla."},
 {k:"wrong",h:"Errores frecuentes",items:[["I'm very exciting about the job.","I'm very excited about the job.","Para decir cómo te sentís se usa -ed. Exciting describe lo que causa la emoción."],["I'm boring in this meeting.","I'm bored in this meeting.","«I'm boring» significa «soy una persona aburrida»."],["I feel embarazada.","I feel embarrassed.","«Embarrassed» significa avergonzado/a, no «embarazada» (pregnant)."]]},
 {k:"phr",h:"Frases para hablar de emociones",items:[["I'm really looking forward to this opportunity.","Tengo muchas ganas de que llegue esta oportunidad."],["I feel confident that I can contribute to the team.","Me siento segura de poder aportar al equipo."],["I was a little nervous at first, but I got used to it.","Al principio estaba un poco nerviosa, pero me acostumbré."],["It's completely understandable to feel that way.","Es totalmente comprensible sentirse así."],["I'm sorry to hear that.","Lamento escuchar eso."],["I'm grateful for your support.","Agradezco tu apoyo."],["Take your time. There's no rush.","Tomate tu tiempo. No hay apuro."]]}
 ],
 check:[
 {q:"«I am very ___ about the new project.» (yo siento entusiasmo)",o:["exciting","excited","excite","excitement"],a:1,why:"Para cómo se siente la persona se usa -ed."},
 {q:"«The training was really ___.» (la capacitación cansó a todos)",o:["tired","tiring","tire","tiredness"],a:1,why:"Lo que causa el cansancio se describe con -ing."},
 {q:"¿Qué significa «embarrassed»?",o:["Embarazada","Avergonzado/a","Enojado/a","Sorprendido/a"],a:1,why:"Es un falso amigo: «embarazada» se dice pregnant."},
 {q:"Una persona te dice que está desbordada de trabajo. ¿Qué respuesta es empática?",o:["Don't worry, it's not a big deal.","I understand that you feel overwhelmed. What would help you most?","You should work faster.","Everyone is busy."],a:1,why:"Primero se reconoce la emoción y después se pregunta cómo ayudar."},
 {q:"«I'm looking forward to…» significa:",o:["Estoy mirando hacia adelante","Tengo ganas de / espero con ilusión","Estoy buscando","Me da miedo"],a:1,why:"Se usa para expresar ilusión por algo que va a pasar."},
 {q:"¿Qué opción usa bien bored?",o:["I am boring in the meeting.","I am bored in the meeting.","I am bore in the meeting.","I have boring in the meeting."],a:1,why:"Para decir que vos te aburrís, se usa bored."}
 ]},

{id:"l16",n:16,t:"Describir tu empresa y tu lugar de trabajo",en:"Describing a company and a workplace",lvl:"A2",cat:"Presentación",
 goal:"Presentar tu empresa y tu equipo, y describir un puesto o un espacio de trabajo con claridad.",
 why:"Al presentar una vacante o responder «Tell me about your company» necesitás hablar de tamaño, rubro, cultura y funciones con vocabulario simple y preciso.",
 blocks:[
 {k:"rule",h:"Presentar una empresa",t:"Usá **We are a / an + tipo de empresa**, **We have + cantidad de empleados** y **We are based in** + lugar. Para contar qué hace: **We provide / We specialize in / We produce**.",
  ex:[["We are a mid-sized logistics company based in Rosario.","Somos una empresa de logística mediana con sede en Rosario."],["We have around 250 employees in three offices.","Tenemos unos 250 empleados en tres oficinas."],["We specialize in HR services for small businesses.","Nos especializamos en servicios de RRHH para pymes."]]},
 {k:"rule",h:"There is y there are: describir un espacio",t:"Para decir qué hay en un lugar: **there is** + singular o incontable, **there are** + plural. Negativo: **there isn't / there aren't**. Pregunta: **Is there…? / Are there…?**",
  ex:[["There is a printer next to the reception desk.","Hay una impresora junto a la recepción."],["There are two open positions in the team.","Hay dos puestos abiertos en el equipo."],["Is there a dress code?","¿Hay un código de vestimenta?"]]},
 {k:"rule",h:"Comparar: más que, el más",t:"Para comparar: adjetivo corto + **-er than** (bigger than) o **more** + adjetivo largo + **than** (more flexible than). Para destacar: **the -est** o **the most**.",
  ex:[["Our office is bigger than the old one.","Nuestra oficina es más grande que la anterior."],["Remote work is more flexible than a fixed schedule.","El trabajo remoto es más flexible que un horario fijo."],["This is the most important vacancy this year.","Esta es la vacante más importante de este año."]]},
 {k:"table",h:"Describir un puesto o una cultura",head:["Qué describís","Vocabulario","Ejemplo"],rows:[["Ambiente","friendly · fast-paced · formal","It's a fast-paced environment."],["Horario","flexible · fixed · hybrid","We offer a hybrid schedule."],["Equipo","small · diverse · supportive","You'll join a small, supportive team."],["Oportunidades","growth · training · promotion","There are real growth opportunities."]]},
 {k:"note",type:"info",h:"Descripción de puesto",t:"Al describir las funciones, empezá cada tarea con un **verbo** (manage, prepare, coordinate) y ordenalas de más a menos importante. Evitá adjetivos vagos como «dynamic» si no los respaldás con un dato."},
 {k:"wrong",h:"Errores frecuentes",items:[["We are 200 persons in the company.","We have 200 employees.","Para la cantidad de personal se usa have + employees."],["There is two vacancies.","There are two vacancies.","Con plural se usa there are."],["The new office is more big than the old one.","The new office is bigger than the old one.","Los adjetivos cortos forman el comparativo con -er."]]},
 {k:"phr",h:"Frases para describir tu empresa y tu lugar de trabajo",items:[["We are a family-owned company.","Somos una empresa familiar."],["Our culture is based on teamwork.","Nuestra cultura se basa en el trabajo en equipo."],["The team is made up of eight people.","El equipo está formado por ocho personas."],["We offer a hybrid schedule.","Ofrecemos un horario híbrido."],["It is a fast-paced environment.","Es un ambiente dinámico, de ritmo rápido."],["The office is close to the train station.","La oficina queda cerca de la estación de tren."],["What is the work environment like?","¿Cómo es el ambiente de trabajo?"]]}
 ],
 check:[
 {q:"«___ two open positions in the team.»",o:["There is","There are","It is","They are"],a:1,why:"Con un plural se usa there are."},
 {q:"¿Cuál es la comparación correcta?",o:["Our office is more big than the old one.","Our office is bigger than the old one.","Our office is biggest than the old one.","Our office is more bigger than the old one."],a:1,why:"Adjetivo corto: big → bigger than."},
 {q:"¿Cómo se dice «Tenemos 200 empleados»?",o:["We are 200 employees.","We have 200 employees.","We has 200 employees.","We make 200 employees."],a:1,why:"Se usa have + employees."},
 {q:"«___ a dress code?»",o:["Is there","Are there","There is","Has"],a:0,why:"Pregunta en singular: Is there…?"},
 {q:"¿Qué significa «fast-paced»?",o:["De ritmo rápido","Lento y tranquilo","Con horarios fijos","Con mucho espacio"],a:0,why:"Fast-paced describe un ambiente de ritmo rápido."},
 {q:"«This is ___ vacancy this year.» (la más importante)",o:["the importantest","the most important","more important","the more important"],a:1,why:"Adjetivo largo: the most + adjetivo."}
 ]}
);

IQ.push(
{id:'q36',cat:'pres',lvl:'C1',q:"How has your career shaped the way you approach people management?",es:"¿Cómo moldeó tu carrera la forma en que gestionás personas?",

 model:"Early in my career, I worked in payroll, where a single mistake directly affected people's lives. That taught me to be rigorous and to take accountability seriously. Later, as an HR business partner, I learned that trust is built through consistency and by listening before proposing solutions. Today, I try to combine both lessons: clear processes, and conversations in which people feel heard.",
 modelEs:"Al comienzo de mi carrera trabajé en liquidación de sueldos, donde un solo error afectaba directamente la vida de las personas. Eso me enseñó a ser rigurosa y a tomarme en serio la responsabilidad. Más adelante, como HR business partner, aprendí que la confianza se construye con coherencia y escuchando antes de proponer soluciones. Hoy intento combinar ambas lecciones: procesos claros y conversaciones en las que las personas se sientan escuchadas.",
 ph:[["Early in my career,…","Al comienzo de mi carrera,…"],["That taught me to…","Eso me enseñó a…"],["Today, I try to combine…","Hoy intento combinar…"]],area:'iv'},

 modelEs:"El cambio más complejo fue la fusión de dos equipos regionales en uno solo. Mi rol fue diseñar el plan de comunicación y los nuevos perfiles de puesto. Hicimos reuniones en grupos pequeños para atender las inquietudes y publicamos un cronograma claro. En seis meses, la rotación voluntaria del equipo fusionado fue menor que el promedio del año anterior y la encuesta de compromiso mostró una mejora clara.",

{id:'q38',cat:'fort',lvl:'C1',q:"Where do you think your leadership style still needs to evolve?",es:"¿En qué aspecto creés que tu estilo de liderazgo todavía tiene que evolucionar?",

{id:'q39',cat:'cond',lvl:'C1',q:"Describe a situation where you had to influence a decision without having formal authority.",es:"Describí una situación en la que tuviste que influir en una decisión sin tener autoridad formal.",

{id:'q40',cat:'sit',lvl:'C1',q:"A high performer threatens to resign after being passed over for promotion. How do you respond?",es:"Una persona de alto desempeño amenaza con renunciar porque no la ascendieron. ¿Cómo respondés?",

 ph:[["I would meet with her privately.","Me reuniría con ella en privado."],["I would explain the outcome transparently.","Le explicaría el resultado con transparencia."],["I would not promise a promotion just to retain her.","No le prometería un ascenso solo para retenerla."]],area:'iv'},
{id:'q41',cat:'mot',lvl:'C1',q:"What would you want to have achieved in this role by the end of your first year?",es:"¿Qué te gustaría haber logrado en este puesto al cumplir tu primer año?",

{id:'q43',cat:'cond',lvl:'C2',q:"Tell me about a time you had to challenge a senior leader's decision. How did you handle it?",es:"Contame sobre una vez en que tuviste que cuestionar una decisión de un directivo. ¿Cómo lo manejaste?",
