 modelEs:"Un directivo quería congelar todos los ascensos durante un año para controlar costos. Yo creía que eso aumentaría las bajas entre nuestras mejores personas. Pedí una reunión privada, presenté datos de retención del congelamiento anterior y propuse una alternativa limitada para los puestos críticos. No la aceptó por completo, pero aprobó excepciones para posiciones clave. La experiencia me enseñó que el desacuerdo es más eficaz cuando viene con evidencia y una opción constructiva.",
 ph:[["I asked for a private meeting.","Pedí una reunión privada."],["I presented data and proposed an alternative.","Presenté datos y propuse una alternativa."],["Disagreement is most effective when it comes with evidence.","El desacuerdo es más eficaz cuando viene con evidencia."]],area:'iv'},
{id:'q44',cat:'sit',lvl:'C2',q:"How would you balance legal compliance and business pressure in a restructuring that involves reducing headcount?",es:"¿Cómo equilibrarías el cumplimiento legal y la presión del negocio en una reestructuración que implica reducir la dotación?",
 want:"Si priorizás el cumplimiento normativo, la equidad y la comunicación, sin dejar de entender las necesidades del negocio",
 doo:"Proponer un proceso ordenado: asesoramiento legal, criterios objetivos y documentados, comunicación cuidada y apoyo a las personas afectadas",
 tip:"No des detalles legales que no puedas respaldar: aclará que consultarías la normativa vigente y asesoramiento especializado. Hablá de criterios objetivos y trato digno.",
 model:"I would start by clarifying the business objective and exploring alternatives, such as attrition or redeployment. Then I would work with legal counsel to ensure full compliance with current labor regulations, and I would define objective, documented criteria. Communication would be careful and respectful, with clear support for those affected, including outplacement where possible. Compliance is not an obstacle to the business; it protects both the people and the company.",
 modelEs:"Empezaría por aclarar el objetivo del negocio y explorar alternativas, como las bajas no reemplazadas o la reubicación interna. Después trabajaría con asesoría legal para asegurar el pleno cumplimiento de la normativa laboral vigente y definiría criterios objetivos y documentados. La comunicación sería cuidada y respetuosa, con apoyo claro para las personas afectadas, incluida la recolocación laboral cuando sea posible. El cumplimiento no es un obstáculo para el negocio: protege tanto a las personas como a la empresa.",
 ph:[["I would start by clarifying the business objective.","Empezaría por aclarar el objetivo del negocio."],["I would define objective, documented criteria.","Definiría criterios objetivos y documentados."],["Compliance protects both the people and the company.","El cumplimiento protege tanto a las personas como a la empresa."]],area:'iv'},
{id:'q45',cat:'mot',lvl:'C2',q:"How do you see the role of HR changing over the next decade, and how are you preparing for it?",es:"¿Cómo ves que va a cambiar el rol de RRHH en la próxima década y cómo te estás preparando?",
 want:"Si tenés una mirada estratégica y fundamentada de la profesión y si seguís aprendiendo",
 doo:"Plantear dos o tres tendencias con matices, aclarar que son tu opinión y explicar qué estás haciendo para prepararte",
 tip:"Es una pregunta de opinión: usá expresiones como «I believe» o «in my view» y evitá predicciones tajantes. Conectá cada tendencia con una acción tuya.",
 model:"In my view, HR will become more data-driven and more closely tied to business strategy, although the human side of the role will remain essential. I believe that skills such as people analytics, change management and ethical judgment will become increasingly important. To prepare, I'm studying people analytics and seeking projects where I can support decisions with data while keeping the focus on people.",
 modelEs:"En mi opinión, RRHH se va a basar cada vez más en datos y se va a vincular más con la estrategia del negocio, aunque la parte humana del rol seguirá siendo esencial. Creo que habilidades como la analítica de personas, la gestión del cambio y el criterio ético van a ser cada vez más importantes. Para prepararme, estoy estudiando analítica de personas y busco proyectos en los que pueda apoyar decisiones con datos sin perder el foco en las personas.",
 ph:[["In my view,…","En mi opinión,…"],["I believe that… will become increasingly important.","Creo que… va a ser cada vez más importante."],["To prepare, I'm studying…","Para prepararme, estoy estudiando…"]],area:'iv'},
{id:'q46',cat:'exp',lvl:'C2',q:"Looking back, which of your decisions in HR would you make differently today, and why?",es:"Mirando hacia atrás, ¿qué decisión tomada en RRHH harías distinto hoy y por qué?",
 want:"Si tenés madurez profesional, capacidad de reflexión y de aprendizaje a partir de la experiencia",
 doo:"Elegir una decisión real, explicar con honestidad qué información faltó y qué harías distinto hoy",
 tip:"Evitá justificarte en exceso. Mostrá un aprendizaje concreto y cómo lo aplicaste después.",
 model:"Some years ago, I introduced a new attendance system without consulting the teams in advance. Technically, it worked well, but it generated mistrust that took months to repair. Today, I would involve a few representatives from each area before the design stage, and I would explain the purpose of the change. Since then, I have applied that approach to every new policy, and the acceptance has been much better.",
 modelEs:"Hace algunos años implementé un nuevo sistema de asistencia sin consultar antes a los equipos. Técnicamente funcionaba bien, pero generó una desconfianza que llevó meses reparar. Hoy involucraría a algunos representantes de cada área antes de la etapa de diseño y explicaría el propósito del cambio. Desde entonces apliqué ese enfoque en cada política nueva y la aceptación fue mucho mejor.",
 ph:[["Looking back,…","Mirando hacia atrás,…"],["Today, I would involve…","Hoy involucraría a…"],["Since then, I have applied that approach to…","Desde entonces, apliqué ese enfoque en…"]],area:'iv'}
);

/* ===== Lecciones C1 y C2 ===== */
LESSONS.push(
{id:'l17',n:17,t:'Lenguaje diplomático: atenuar sin perder claridad',en:'Hedging and diplomatic language',lvl:'C1',cat:'Comunicación',
 goal:'Decir cosas delicadas con tacto, sin sonar tajante y sin esconder el mensaje.',
 why:'En devoluciones, negociaciones y conversaciones difíciles, el tono es parte del mensaje. El inglés profesional atenúa mucho más que el español rioplatense.',
 blocks:[
 {k:'rule',h:'Atenuar con verbos y adverbios',t:'Para decir algo delicado sin sonar tajante se usan **verbos de atenuación** (seem, appear, tend to, suggest) y **adverbios** (somewhat, fairly, relatively, perhaps). Suavizan la afirmación sin volverla vaga.',
  ex:[["The results seem to suggest that morale is declining.","Los resultados parecen indicar que la moral está bajando."],["There appears to be some confusion about the new schedule.","Parece haber cierta confusión sobre el nuevo horario."],["Turnover is somewhat higher than we expected.","La rotación es algo mayor de lo que esperábamos."],["Perhaps we could revisit the timeline.","Quizás podríamos revisar el cronograma."]]},
 {k:'rule',h:'Pedidos indirectos',t:'Con **I was wondering if** y **would it be possible to** el pedido se vuelve más indirecto. Después de «I was wondering if» se usa **could** o **would**.',
  ex:[["I was wondering if you could send me the report today.","Me preguntaba si podrías enviarme el informe hoy."],["Would it be possible to move the meeting to Thursday?","¿Sería posible pasar la reunión al jueves?"],["I was wondering whether we might discuss the schedule.","Me preguntaba si podríamos hablar del cronograma."]]},
 {k:'table',h:'De directo a diplomático',head:['Directo','Diplomático'],rows:[["You are wrong.","I see it a little differently."],["This doesn't work.","This may not be the most effective approach."],["You didn't finish the report.","The report seems to be incomplete."],["I disagree.","I'm not sure I fully agree."],["Send me the data.","Could you possibly send me the data?"]]},
 {k:'note',type:'tip',h:'Atenuar no es esconder',t:'Atenuá el **tono**, no el **contenido**. Si hay un problema serio, nombralo con claridad: un mensaje demasiado vago puede hacer que la otra persona no entienda la gravedad.'},
 {k:'note',type:'warn',h:'Cuidado con acumular atenuantes',t:'Una frase con tres atenuantes («I was just wondering whether maybe we could possibly…») suena insegura. Con **uno** suele alcanzar.'},
 {k:'wrong',h:'Errores frecuentes',items:[["I want that you send me the report.","I'd like you to send me the report.","Después de want o would like + persona se usa **to** + verbo. «Want that» no se usa."],["Could you to send me the report?","Could you send me the report?","Después de could va el verbo base, sin to."],["I was wondering if you will send me the report.","I was wondering if you could send me the report.","Después de «I was wondering if» se usa could o would, no will."]]},
 {k:'phr',h:'Frases útiles',items:[["It seems to me that…","Me parece que…"],["I may be mistaken, but…","Puede que me equivoque, pero…"],["I'm not sure I fully agree.","No estoy seguro de estar del todo de acuerdo."],["Would it be possible to…?","¿Sería posible…?"],["Perhaps we could…","Quizás podríamos…"],["To some extent, yes.","Hasta cierto punto, sí."]]}
 ],
 check:[
 {q:'¿Cuál de estas frases es la más diplomática?',o:['You are wrong about the schedule.','I see the schedule a little differently.','The schedule is bad.','Change the schedule.'],a:1,why:'Presenta una opinión distinta sin acusar a la otra persona.'},
 {q:'Completá: «I was wondering if you ___ send me the report.»',o:['will','could','must','are'],a:1,why:'Con «I was wondering if» se usa could o would para un pedido indirecto.'},
 {q:'¿Qué significa «There appears to be some confusion»?',o:['Hay confusión total y es culpa de alguien','Parece haber cierta confusión','No hay ninguna confusión','Voy a eliminar la confusión'],a:1,why:'«Appears to be» atenúa: no afirma que haya confusión de forma absoluta.'},
 {q:'¿Qué verbo NO atenúa una afirmación?',o:['seem','tend to','appear','demand'],a:3,why:'«Demand» (exigir) refuerza el mensaje; seem, tend to y appear lo atenúan.'},
 {q:'¿Qué conviene hacer al comunicar un problema serio?',o:['Usar muchos atenuantes para no incomodar','Atenuar el tono, pero nombrar el problema con claridad','Evitar mencionarlo','Decirlo sin ningún cuidado'],a:1,why:'Se atenúa el tono, no el contenido.'},
 {q:'¿Qué pedido está bien formulado?',o:["I'd like you to send me the report.","I'd like that you send me the report.","I'd like you send me the report.","I'd like you sending me the report."],a:0,why:'Would like + persona + to + verbo base.'}
 ]},
{id:'l18',n:18,t:'Informar lo que dijeron otros: actas e investigaciones',en:'Reported speech and reporting verbs',lvl:'C1',cat:'Gramática aplicada',
 goal:'Reportar declaraciones, reuniones y reclamos con el verbo y la estructura correctos.',
 why:'RRHH redacta actas, informes de investigación y resúmenes de reuniones. Cada verbo de reporte tiene su estructura y su matiz.',
 blocks:[
 {k:'rule',h:'Retroceso de tiempos',t:'Al contar lo que dijo otra persona, el verbo suele **retroceder un tiempo**: presente → pasado, pasado y present perfect → past perfect, will → would. Si lo dicho sigue siendo cierto, no hace falta retroceder.',
  ex:[["She said (that) she was overloaded.","Dijo que estaba sobrecargada."],["He told me he had submitted the form the day before.","Me dijo que había presentado el formulario el día anterior."],["The manager said he would review the request.","El gerente dijo que iba a revisar la solicitud."],["She said the office closes at six.","Dijo que la oficina cierra a las seis."]]},
 {k:'rule',h:'Verbos de reporte: la estructura que sigue',t:'Cada verbo exige su propia estructura: **admit, deny, suggest y recommend** + -ing o + that; **advise, warn, ask y tell** + persona + to; **insist on** + -ing; **claim** + to + verbo o + that.',
  ex:[["He admitted arriving late on several occasions.","Admitió haber llegado tarde en varias ocasiones."],["She denied sharing the confidential file.","Negó haber compartido el archivo confidencial."],["The consultant suggested reviewing the policy.","El consultor sugirió revisar la política."],["HR advised him to document the incident.","RRHH le aconsejó que documentara el incidente."],["The manager warned them not to share the data.","El gerente les advirtió que no compartieran los datos."]]},
 {k:'table',h:'Verbos de reporte y su estructura',head:['Verbo','Estructura','Ejemplo'],rows:[["admit / deny","+ -ing o that","She denied taking the document."],["suggest / recommend","+ -ing o that + sujeto + verbo","They recommended that we update the policy."],["advise / warn / ask / tell","+ persona + to + verbo","I told her to contact HR."],["insist on","+ -ing","He insisted on speaking to the director."],["claim","+ to + verbo o that","She claimed to have sent the email."]]},
 {k:'note',type:'info',h:'Elegí el verbo según lo que se dijo',t:'En actas e investigaciones, el verbo comunica una actitud: **state** (declarar), **report** (informar), **acknowledge** (reconocer) y **claim** (afirmar, sin confirmarlo). Un verbo mal elegido puede sugerir que algo ya se comprobó o que se duda de la persona.'},
 {k:'wrong',h:'Errores frecuentes',items:[["She suggested me to review the policy.","She suggested that I review the policy.","Suggest no lleva persona + to. Se usa suggest + that, o suggest + -ing."],["He admitted to have arrived late.","He admitted arriving late.","Después de admit se usa -ing (o that + oración), no el infinitivo."],["The employee said me that he was ill.","The employee told me that he was ill.","Tell lleva persona directa («told me»); con say no se usa «me» («said that»)."]]},
 {k:'phr',h:'Frases útiles',items:[["According to the report,…","Según el informe,…"],["The employee stated that…","La persona declaró que…"],["It was reported that…","Se informó que…"],["She acknowledged that…","Reconoció que…"],["He denied any wrongdoing.","Negó haber cometido cualquier falta."],["The witness claimed to have seen…","El testigo afirmó haber visto…"]]}
 ],
 check:[
 {q:'«I have finished the audit.» → She said that she ___ the audit.',o:['has finished','had finished','finishes','will finish'],a:1,why:'El present perfect retrocede a past perfect: «had finished».'},
 {q:'¿Qué opción usa bien el verbo admit?',o:['He admitted to arrive late.','He admitted arriving late.','He admitted arrive late.','He admitted of arriving late.'],a:1,why:'Después de admit se usa -ing.'},
 {q:'¿Qué estructura lleva «advise»?',o:['advise + persona + to + verbo','advise + persona + verbo base','advise + that + persona to','advise + to + persona'],a:0,why:'Advise + persona + to + verbo: «HR advised him to document it».'},
 {q:'¿Qué oración usa bien el verbo suggest?',o:['She suggested me to review it.','She suggested that I review it.','She suggested me reviewing it.','She suggested to me to review.'],a:1,why:'Suggest se construye con that + sujeto + verbo, o con -ing.'},
 {q:'¿Qué verbo conviene para reportar algo dicho por una persona sin confirmarlo?',o:['prove','claim','confirm','verify'],a:1,why:'«Claim» (afirmar) no implica que lo dicho sea cierto; los otros tres sí.'},
 {q:'«The employee said me that he was ill.» tiene un error. ¿Cuál es?',o:['Falta «to» antes de ill','Debe ser «told me» (o «said» sin «me»)','Debe usarse el presente','No hay error'],a:1,why:'Se dice «told me that» o «said that», pero no «said me».'}
 ]},
{id:'l19',n:19,t:'Redactar políticas y comunicados con registro formal',en:'Formal register and policy writing',lvl:'C1',cat:'Comunicación',
 goal:'Escribir políticas, avisos y comunicados con un tono formal, claro y profesional.',
 why:'Los manuales del empleado, las políticas y los comunicados oficiales usan un registro distinto del de un correo cotidiano.',
 blocks:[
 {k:'rule',h:'Verbos formales en lugar de verbos comunes',t:'Los textos formales prefieren verbos como **require** (en vez de need), **obtain** (en vez de get), **inform** o **notify** (en vez de tell) y **apply to** (en vez de be valid for).',
  ex:[["Employees are required to submit the form.","El personal debe presentar el formulario."],["Staff must obtain prior approval from their manager.","El personal debe obtener la aprobación previa de su jefe."],["Please inform HR of any change in your personal details.","Informe a RRHH cualquier cambio en sus datos personales."],["The policy applies to all employees.","La política se aplica a todo el personal."]]},
 {k:'table',h:'De informal a formal',head:['Informal','Formal'],rows:[["We need you to…","Employees are required to…"],["If you can't come, tell us.","In the event of absence, please notify HR."],["Get approval first.","Prior approval must be obtained."],["We'll look into it.","The matter will be reviewed."],["As soon as possible","At the earliest opportunity"]]},
 {k:'rule',h:'Sustantivos en lugar de verbos',t:'Convertir un verbo en sustantivo vuelve el texto más formal y compacto: **decide → decision**, **apply → application**, **fail → failure**. Suele combinarse con expresiones como **result in** o **reserve the right to**.',
  ex:[["Failure to comply may result in disciplinary action.","El incumplimiento puede dar lugar a una medida disciplinaria."],["The company reserves the right to modify this policy.","La empresa se reserva el derecho de modificar esta política."],["The submission of the form is mandatory.","La presentación del formulario es obligatoria."]]},
 {k:'note',type:'warn',h:'No exageres',t:'Un texto formal debe seguir siendo **claro**. Evitá frases larguísimas y palabras rebuscadas solo para sonar importante: en un comunicado para todo el personal conviene un tono formal pero simple.'},
 {k:'wrong',h:'Errores frecuentes',items:[["Employees must to submit the form.","Employees must submit the form.","Después de must va el verbo base, sin to."],["In case of you are absent, inform HR.","In the event of absence, inform HR.","«In case of» y «in the event of» van seguidos de un sustantivo, no de una oración."],["The informations are available on the intranet.","The information is available on the intranet.","Information es incontable: no lleva -s y el verbo va en singular."]]},
 {k:'phr',h:'Frases útiles',items:[["Please be advised that…","Se le informa que…"],["Failure to comply may result in…","El incumplimiento puede dar lugar a…"],["This policy comes into effect on…","Esta política entra en vigencia el…"],["In accordance with company policy,…","De acuerdo con la política de la empresa,…"],["Should you have any questions, please contact…","Ante cualquier consulta, comuníquese con…"],["The company reserves the right to…","La empresa se reserva el derecho de…"]]}
 ],
 check:[
 {q:'¿Cuál es la versión más formal?',o:['We need you to hand in the form.','Employees are required to submit the form.','Give us the form.','You gotta send the form.'],a:1,why:'«Are required to submit» es el registro propio de una política.'},
 {q:'Completá: «Failure ___ comply may result in disciplinary action.»',o:['to','of','for','with'],a:0,why:'Se dice «failure to + verbo».'},
 {q:'¿Qué opción usa bien la palabra information?',o:['The informations are on the intranet.','The information is on the intranet.','The informations is on the intranet.','The information are on the intranet.'],a:1,why:'Information es incontable: va en singular y sin -s.'},
 {q:'¿Qué sustantivo corresponde al verbo «decide»?',o:['decider','decisive','decision','deciding'],a:2,why:'Decide → decision.'},
 {q:'¿Cuál es la forma correcta después de must?',o:['Employees must to wear the badge.','Employees must wear the badge.','Employees must wearing the badge.','Employees must wears the badge.'],a:1,why:'Después de must va el verbo base.'},
 {q:'«This policy comes into effect on 1 March.» significa:',o:['La política termina el 1 de marzo','La política entra en vigencia el 1 de marzo','La política se discute el 1 de marzo','La política se publicó el 1 de marzo'],a:1,why:'«Come into effect» = entrar en vigencia.'}
 ]},
{id:'l20',n:20,t:'Registro y vocabulario preciso: inglés americano y británico',en:'Register and precise word choice',lvl:'C2',cat:'Vocabulario',
 goal:'Elegir la palabra justa según el registro y la variante del inglés.',
 why:'En RRHH una palabra mal elegida puede sonar amenazante, informal o confusa. Además, el inglés de EE. UU. y el británico usan términos distintos para conceptos laborales comunes.',
 blocks:[
 {k:'table',h:'Terminar un vínculo laboral: de informal a formal',head:['Expresión','Registro','Nota'],rows:[["to get fired / to get sacked","Informal","«Sacked» es sobre todo británico."],["to dismiss","Formal","Término general en documentos."],["to terminate","Muy formal o legal","Se usa en contratos y comunicaciones oficiales."],["to let go","Eufemismo","Muy usado en EE. UU. para suavizar el mensaje."],["to lay off","Neutro (EE. UU.)","Despido por razones económicas."],["to make redundant","Neutro (Reino Unido)","El puesto deja de ser necesario."]]},
 {k:'table',h:'Estados Unidos y Reino Unido',head:['EE. UU.','Reino Unido','Español'],rows:[["raise","pay rise","aumento de sueldo"],["vacation","holiday / annual leave","vacaciones"],["résumé (también CV)","CV","currículum"],["layoff","redundancy","despido por reducción o supresión de puestos (equivalente aproximado)"],["direct manager / supervisor","line manager","jefe directo"]]},
 {k:'rule',h:'Pay, salary, wage y compensation',t:'**Pay** es el término general. **Salary** es un monto fijo por mes o por año. **Wage** se calcula por hora o por semana. **Compensation** y **remuneration** son formales e incluyen bonos y beneficios.',
  ex:[["She earns a monthly salary of three thousand dollars.","Cobra un sueldo mensual de tres mil dólares."],["Wages are paid every week.","Los jornales se pagan todas las semanas."],["The compensation package includes health insurance.","El paquete de remuneración incluye cobertura de salud."]]},
 {k:'note',type:'tip',h:'En una conversación, suavizá',t:'Con la persona afectada evitá «fire» y «terminate»: suenan duros. Se suelen usar fórmulas como **«we have decided to end the employment relationship»** o, en EE. UU., **«we are letting you go»**.'},
 {k:'note',type:'info',h:'Mantené una sola variante',t:'Elegí **una** variante (americana o británica) y mantenela en todo el documento: no mezcles «vacation» con «annual leave» ni «raise» con «pay rise».'},
 {k:'wrong',h:'Errores frecuentes',items:[["We will fire you if you fail to comply.","Failure to comply may result in dismissal.","«Fire» es informal y amenazante. En un documento se usa «dismissal» o «termination of employment»."],["Her wage is 4,000 dollars per month.","Her salary is 4,000 dollars per month.","Un monto mensual fijo se llama salary; wage se asocia con pagos por hora o por semana."],["The company made forty employees redundant. (en un texto de EE. UU.)","The company laid off forty employees.","En EE. UU. se usa «lay off»; «redundant» es la forma británica."]]},
 {k:'phr',h:'Frases útiles',items:[["We regret to inform you that your position has been eliminated.","Lamentamos informarle que su puesto fue eliminado."],["The employment relationship will end on…","La relación laboral finalizará el…"],["Your last day of employment will be…","Su último día de trabajo será…"],["a mutually agreed departure","una salida acordada de común acuerdo"]]}
 ],
 check:[
 {q:'¿Cuál de estos verbos es el más formal?',o:['to sack','to fire','to terminate','to boot out'],a:2,why:'«Terminate» es propio de contratos y comunicaciones oficiales; los otros son informales.'},
 {q:'En el Reino Unido, un aumento de sueldo se llama normalmente:',o:['raise','pay rise','salary up','wage jump'],a:1,why:'«Pay rise» es la forma británica; «raise» es la americana.'},
 {q:'Un monto fijo mensual para personal administrativo es un:',o:['wage','salary','tip','fee'],a:1,why:'Salary es un monto fijo por mes o por año; wage se calcula por hora o por semana.'},
 {q:'«Redundancy» como despido se usa sobre todo en:',o:['EE. UU.','el Reino Unido','Argentina','ningún país de habla inglesa'],a:1,why:'Es el término británico para la pérdida del empleo porque el puesto deja de ser necesario.'},
 {q:'¿Cuál es la mejor opción en una política escrita?',o:["We'll fire you if you steal.","Theft may result in dismissal.","You'll be sacked for theft.","We'll kick you out for theft."],a:1,why:'Es la única opción con registro formal y neutral.'},
 {q:'«Wages» suele referirse a pagos:',o:['anuales fijos','por hora o por semana','solo en acciones','solo a gerentes'],a:1,why:'Wage se asocia con pagos por hora o por semana.'}
 ]},
{id:'l21',n:21,t:'Condicionales formales con inversión',en:'Formal conditionals with inversion',lvl:'C2',cat:'Gramática aplicada',
 goal:'Reemplazar «if» por una estructura invertida en comunicaciones escritas formales.',
 why:'En cartas, contratos y comunicados corporativos es muy común empezar con «Should you…», «Were the company to…» o «Had we…».',
 blocks:[
 {k:'rule',h:'Should: una posibilidad real',t:'**Should + sujeto + verbo base** reemplaza a «if + presente». Es muy formal y frecuente en correos corporativos.',
  ex:[["Should you require any further information, please contact HR.","Si necesitara más información, comuníquese con RRHH."],["Should the position become available, we will inform you immediately.","Si el puesto quedara disponible, se lo informaremos de inmediato."]]},
 {k:'rule',h:'Were … to: una situación hipotética',t:'**Were + sujeto + to + verbo** (o **Were + sujeto + adjetivo o sustantivo**) reemplaza a «if + pasado».',
  ex:[["Were the company to restructure, all affected employees would be notified in advance.","Si la empresa se reestructurara, se notificaría con anticipación a todo el personal afectado."],["Were I in your position, I would speak to the manager first.","Si yo estuviera en tu lugar, hablaría primero con el gerente."]]},

function pickVoice(){
 const us=VOICES.filter(v=>/^en[-_]US/i.test(v.lang));
 return us.find(v=>/andrew/i.test(v.name))||us.find(v=>/natural|online/i.test(v.name))||us[0]||VOICES.find(v=>/^en/i.test(v.lang))||null;
}
const speakClean=t=>String(t).replace(/\[[^\]]*\]/g,'').replace(/[•]/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
/* ----- karaoke: la palabra que se está diciendo se agranda y resalta, sincronizada con la voz ----- */
let KARA=null,KID=0;
const kNorm=w=>String(w).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']+/g,'');
function karaClear(){if(!KARA)return;const k=KARA;KARA=null;clearTimeout(k.t);try{k.undo()}catch(e){}}
/* busca, cerca del botón, el elemento que muestra exactamente la frase que se va a leer */
function karaFind(btn,text){
 const norm=t=>String(t).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
 const want=norm(speakClean(text));if(!want||!btn)return null;
 let node=btn.parentElement,exact=null,pref=null;
 for(let up=0;up<4&&node&&!exact;up++,node=node.parentElement){
  if(node.matches&&node.matches('main,body,#app'))break;
  const els=[node,...node.querySelectorAll('*')];
  for(const el of els){
   if(el.closest('button,textarea,input,.kw-wrap'))continue;
   const t=norm(el.textContent);if(!t)continue;
   if(t===want)exact=el;                /* el más profundo con el texto exacto */
   else if(!pref&&t.startsWith(want)&&want.length>12)pref=el;
  }
 }
 return exact||pref;
}
function karaWrap(el){
 const spans=[],undo=[];
 const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];
 while(tw.nextNode())nodes.push(tw.currentNode);
 nodes.forEach(n=>{
  if(!n.nodeValue.trim())return;
  const wrap=document.createElement('span');wrap.className='kw-wrap';
  n.nodeValue.split(/(\s+)/).forEach(tok=>{
   if(!tok)return;
   if(/^\s+$/.test(tok)){wrap.append(document.createTextNode(tok));return}
   const sp=document.createElement('span');sp.className='kw';sp.textContent=tok;sp._k=kNorm(tok);
   if(sp._k)spans.push(sp);wrap.append(sp);
  });
  n.replaceWith(wrap);undo.push([wrap,n]);
 });
 return {spans,undo:()=>undo.forEach(([w,n])=>{if(w.isConnected)w.replaceWith(n)})};
}
function speak(text,anchor){
 if(!SPEECH)return;
 try{
  speechSynthesis.cancel();karaClear();
  const clean=speakClean(text),u=new SpeechSynthesisUtterance(clean),id=++KID;
  u.lang='en-US';const v=pickVoice();if(v)u.voice=v;const rate=S.slow?0.78:0.95;u.rate=rate;
  const el=anchor?karaFind(anchor,text):null;
  if(el){
   const w=karaWrap(el);
   /* palabras del audio (con su posición en el texto leído) → palabras del texto en pantalla */
   const words=[];clean.replace(/\S+/g,(m,i)=>{words.push({i,k:kNorm(m),m});return m});
   let p=0;words.forEach(x=>{x.sp=null;if(!x.k)return;for(let j=p;j<Math.min(w.spans.length,p+5);j++){if(w.spans[j]._k===x.k){x.sp=w.spans[j];p=j+1;break}}});
   const k=KARA={id,undo:()=>{w.undo()},t:0,cur:null,got:false};
   const show=sp=>{if(!sp||k.cur===sp)return;if(k.cur){k.cur.classList.remove('on');k.cur.style.marginInline=''}const wd=sp.getBoundingClientRect().width;sp.style.marginInline=(wd*0.16+5).toFixed(1)+'px';sp.classList.add('on');k.cur=sp};
   const idxAt=ci=>{let r=0;for(let j=0;j<words.length;j++){if(words[j].i<=ci)r=j;else break}return r};
   u.onboundary=e=>{if(!KARA||KARA.id!==id)return;if(e.name&&e.name!=='word')return;k.got=true;clearTimeout(k.t);
    const x=words[idxAt(e.charIndex||0)];if(x&&x.sp)show(x.sp)};
   /* si la voz no avisa palabra por palabra (pasa en algunos celulares), se estima el ritmo */

  }
 };

const GLBYEN={};GL.forEach(g=>GLBYEN[g.en]=g);

const nWords=s=>s.replace(/^to /,'').trim().split(/\s+/).length;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function fillMatch(g){
 const forms=[g.en,...g.alt].map(f=>f.replace(/^to /,''));
 for(const f of forms){const m=new RegExp('(^|[^A-Za-z])('+reEsc(f)+')(?![A-Za-z])','i').exec(g.ex);if(m){return {start:m.index+m[1].length,len:m[2].length}}}
 return null;
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function dist(pool,exclude,key,n,prefer){
 const seen=new Set(exclude);const out=[];
 const c=shuffle(pool);const pref=prefer?c.filter(prefer):[];
 for(const x of [...pref,...c]){const k=key(x);if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=n)break}
 return out;
}

function makeQ(type,c){

  }
  if(type==='gl-def'){

   const w=dist(others.filter(x=>!g.alt.includes(x.en)),[norm(g.en)],x=>norm(x.en),3,sameCat);
   return mc(base,g.en,w.map(x=>x.en),{title:'¿A qué término corresponde esta definición?',big:g.def,explain:exGl(g)});

   if(w.length<3)return null;

function buildSession(o){

  order=shuffle(Object.keys(S.missed).map(id=>BYID[id]).filter(Boolean));

  const pool=conceptPool(o);
  const byArea={};pool.forEach(x=>(byArea[x.area]=byArea[x.area]||[]).push(x));
  const rank=x=>S.missed[x.id]?0:(S.done[x.id]?2:1);
  const lists=Object.keys(byArea).map(a=>shuffle(byArea[a]).sort((a,b)=>rank(a)-rank(b)));
  order=[];let k=0;

  const glSel=sel.filter(x=>x.area==='gl'&&nWords(x.en)<=3);
  if(glSel.length>=4){
   const four=glSel.filter((x,i,a)=>a.findIndex(y=>norm(y.es)===norm(x.es))===i).slice(0,4);

  types=shuffle(types).sort((a,b)=>(used[a]||0)-(used[b]||0)+((a===prev)?5:0)-((b===prev)?5:0));
  for(const t of types){const q=makeQ(t,c);if(q){items.push(q);used[t]=(used[t]||0)+1;prev=t;break}}

 if(match){items.splice(Math.min(items.length,2+Math.floor(Math.random()*Math.max(1,items.length-2))),0,match)}
 /* evita dos del mismo tipo seguidos si es posible */
 for(let i=1;i<items.length;i++){if(items[i].type===items[i-1].type){const j=items.findIndex((x,k)=>k>i&&x.type!==items[i].type&&(items[k-1]?items[k-1].type:'')!==items[i].type&&(items[k+1]?items[k+1].type:'')!==items[i].type);if(j>0)[items[i],items[j]]=[items[j],items[i]]}}

const LV_PLAN={gl:2,ph:1,iv:1,tr:2};
function buildLevelTest(){
 const items=[];
 LVLS.forEach(lv=>{
  const picked=[];
  Object.keys(LV_PLAN).forEach(a=>{
   const pool=shuffle({gl:GL,ph:PH,iv:IQ,tr:TH}[a].filter(x=>x.lvl===lv));
   let n=0;
   for(const c of pool){
    if(n>=LV_PLAN[a])break;
    const q=shuffle(LV_TYPES[a]).map(t=>makeQ(t,c)).find(Boolean);
    if(q){picked.push(q);n++}
   }

  items.push(...shuffle(picked));
 });

/* ---------- Detección de idioma (sin conexión) ---------- */
const ES_W=new Set('el la los las un una unos unas de del que y en es son por para con sin se su sus mi mis tu tus nos lo al como pero más muy está están fue ser hay si no yo vos tengo tenés quiero puedo podés gracias hola buenos buenas días tarde favor también cuando donde porque estoy estamos nuestro nuestra necesito queremos soy eres somos'.split(' '));
const EN_W=new Set('the a an of and to in is are was were for with that this it you your we our i my me he she they them have has had be been not do does did will would can could please thank thanks hello dear regards best from at on as by or if but about which who what when where how am im'.split(' '));
function detectLang(t){
 const w=String(t).toLowerCase().replace(/[^a-záéíóúñü'¿¡ ]+/g,' ').split(/\s+/).filter(Boolean);
 if(w.length<1)return null;
 let es=0,en=0;w.forEach(x=>{if(ES_W.has(x))es++;if(EN_W.has(x))en++});
 if(/[áéíóúñ¿¡]/i.test(t))es+=2;
 if(es===en)return es===0?null:'es';
 return es>en?'es':'en';
}

function toBlocks(text){
 const out=[];
 String(text).replace(/\r\n?/g,'\n').split(/\n{2,}/).forEach(par=>{
  const lines=par.split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  if(!lines.length)return;
  const bullet=/^\s*(?:[-•*·]|\d+[.)])\s+/;
  if(lines.every(l=>bullet.test(l))){lines.forEach(l=>out.push({t:'li',x:l.replace(bullet,'')}));return}
  if(lines.length===1&&/^#{1,4}\s+/.test(lines[0])){out.push({t:'h',x:lines[0].replace(/^#{1,4}\s+/,'')});return}
  out.push({t:'p',x:lines.join('\n')});
 });
 return out;
}

const escH=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function joinBlocks(d,fmt){

  const s=fmt==='md'?(b.t==='h'?'## '+b.x:b.t==='li'?'- '+b.x:b.x):(b.t==='li'?'• '+b.x:b.t==='h'?b.x.toUpperCase():b.x);
  parts.push((prev==='li'&&b.t==='li'?'\n':'\n\n')+s);prev=b.t;

}

/* ---------- Fechas, horas y números ---------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ONES='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
const TENS='_ _ twenty thirty forty fifty sixty seventy eighty ninety'.split(' ');
function n2w(n){
 if(n<20)return ONES[n];
 if(n<100)return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
 if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');
 for(const [v,nm] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']])if(n>=v)return n2w(Math.floor(n/v))+' '+nm+(n%v?' '+n2w(n%v):'');
 return String(n);
}
const ORD=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth','twenty-first','twenty-second','twenty-third','twenty-fourth','twenty-fifth','twenty-sixth','twenty-seventh','twenty-eighth','twenty-ninth','thirtieth','thirty-first'];
const ordSuf=d=>d+(d%100>=11&&d%100<=13?'th':({1:'st',2:'nd',3:'rd'}[d%10]||'th'));
function yearW(y){
 if(y>=2000&&y<2010)return 'two thousand'+(y>2000?' '+n2w(y-2000):'');
 if(y>=1100&&y<2100){const a=Math.floor(y/100),b=y%100;return n2w(a)+' '+(b===0?'hundred':b<10?'oh-'+ONES[b]:n2w(b))}
 return n2w(y);
}
function parseNum(s){
 s=String(s).trim().replace(/[^\d.,-]/g,'');
 const neg=s.startsWith('-');s=s.replace(/-/g,'');
 if(!/\d/.test(s))return null;
 const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
 let ip=s,dec='';
 if(lc>=0&&ld>=0){if(lc>ld){ip=s.slice(0,lc).replace(/\./g,'');dec=s.slice(lc+1)}else{ip=s.slice(0,ld).replace(/,/g,'');dec=s.slice(ld+1)}}
 else if(lc>=0){if((s.match(/,/g)||[]).length>1)ip=s.replace(/,/g,'');else{ip=s.slice(0,lc);dec=s.slice(lc+1)}}
 else if(ld>=0){const p=s.split('.');if(p.length>2||p[1].length===3)ip=s.replace(/\./g,'');else{ip=p[0];dec=p[1]}}
 ip=ip.replace(/^0+(?=\d)/,'')||'0';
 if(ip.length>12)return {big:true};
 return {neg,int:parseInt(ip,10),dec};
}

/* ===== Entrevista simulada con Claude: preguntas generadas según lo que respondés ===== */
function startSimAI(lvl,role){
 const first={pre:'',q:'Thank you for coming in today. To start, could you tell me a little about yourself and your background?',es:'Gracias por venir hoy. Para empezar, ¿podrías contarme un poco sobre vos y tu trayectoria?',a:''};
 return {stage:'run',ai:true,lvl,role:(role||'').trim()||'HR Generalist',turns:[first],i:0,max:6,closing:''};
}
const simTranscript=(S_,upto)=>S_.turns.slice(0,upto).map(t=>(t.pre?'Interviewer: '+t.pre+'\n':'')+'Interviewer: '+t.q+'\nCandidate: '+(t.a||'(no answer)')).join('\n');
async function aiNextTurn(S_){
 const n=S_.i+1,last=n>=S_.max,lv=S_.lvl==='all'?'B1':S_.lvl;
 const prompt=`You are a friendly, experienced HR interviewer (native US English speaker) running a realistic job interview with a Spanish-speaking candidate from Argentina. The candidate applies for: ${S_.role}. Keep your English at CEFR ${lv}: ${/^C/.test(lv)?'natural, fluent professional spoken style with precise vocabulary and some idiomatic range':'natural spoken style, clear, no hard idioms'}.
INTERVIEW SO FAR:
${simTranscript(S_,S_.i+1)}

This was answer ${n} of ${S_.max}. ${last?'This was the LAST answer: set "done" to true and "question" to "". In "reaction" write a warm, natural closing (2 sentences): thank them, mention a specific thing they said and explain next steps.':'Now:'}
${last?'':`1) "reaction": ONE short natural sentence reacting to something SPECIFIC the candidate said (a detail, project, skill or feeling), like a real person would ("That sounds like a challenging project."). No grading, no corrections, never invent facts about the candidate.
2) "question": exactly ONE next question. If their answer has something worth exploring (an achievement, a tool, a conflict, something vague) ask a natural follow-up about it. Otherwise move through the usual arc: background, experience, strengths and weaknesses, a behavioral question ("Tell me about a time when…"), a situational question, motivation for this company, and finally "Do you have any questions for us?". Never repeat a question already asked. If the answer was off-topic, too short or not in English, kindly ask them to say more or in English. Understand what the candidate meant even if there are typos or small mistakes, and do not mention them (corrections come after the interview).
3) "es": the question translated into Rioplatense Spanish (vos).`}
Reply ONLY with JSON: {"reaction":string,"question":string,"es":string,"done":boolean}`;
 const r=await SAMPLE.json(prompt,{modelTier:'default',cache:false});
 if(!r||typeof r!=='object')throw {code:'invalid_json'};
 if(!last&&!String(r.question||'').trim())throw {code:'invalid_json'};
 return {reaction:String(r.reaction||'').trim(),question:String(r.question||'').trim(),es:String(r.es||'').trim(),done:last||!!r.done};
}
function ivBubble(t,showEs){
 const es=h('div',{class:'muted',hidden:true},t.es||''),btn=t.es?h('button',{type:'button',class:'btn ghost sm',onclick:e=>{es.hidden=!es.hidden;e.currentTarget.textContent=es.hidden?'Ver en español':'Ocultar español'}},'Ver en español'):null;
 const say=(t.pre?t.pre+' ':'')+t.q;
 return h('div',{class:'cbub iv'},h('span',{class:'who'},'Entrevistadora'),
  t.pre?h('p',{class:'b-re'},t.pre):null,h('p',{class:'b-q'},t.q),
  h('div',{class:'row'},listenBtn(say,'Escuchar a la entrevistadora'),btn),es);
}
const meBubble=a=>h('div',{class:'cbub me'},h('span',{class:'who'},'Vos'),h('p',null,a||'—'));
function simAI(){
 const S_=SIM,t=S_.turns[S_.i],last=S_.i+1>=S_.max;
 const ta=h('textarea',{class:'ta',rows:5,placeholder:'Respondé en inglés, como en una entrevista real…','aria-label':'Tu respuesta',value:t.a||''});
 const stat=h('div',{class:'stack'});
 const send=h('button',{type:'button',class:'btn claude'},icon('send'),last?'Responder y terminar':'Responder');
 const submit=async()=>{
  const a=ta.value.trim();
  if(!a){stat.replaceChildren(h('p',{class:'muted'},'Escribí tu respuesta primero. Si preferís, practicá en voz alta y después escribí lo esencial.'));return}
  t.a=a;send.disabled=true;ta.disabled=true;
  stat.replaceChildren(h('p',{class:'muted typing'},'La entrevistadora está pensando…'));
  try{
   const r=await aiNextTurn(S_);
   if(SIM!==S_)return;
   if(r.done){S_.closing=r.reaction;S_.stage='end';addXP(30)}
   else{S_.turns.push({pre:r.reaction,q:r.question,es:r.es,a:''});S_.i++}
   viewSimulacro();
  }catch(e){
   if(SIM!==S_)return;
   send.disabled=false;ta.disabled=false;
   stat.replaceChildren(h('div',{class:'note bad'},h('b',{class:'n-t'},'No se pudo continuar'),errCopy(e)),h('div',{class:'row'},h('button',{type:'button',class:'btn ghost sm',onclick:submit},'Reintentar')));
  }
 };
 send.onclick=submit;
 ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')submit()});
 main.replaceChildren(
  h('div',{class:'row sp'},h('span',{class:'tag tag-q'},'Pregunta '+(S_.i+1)+' de '+S_.max),h('button',{type:'button',class:'btn ghost sm exit-x',onclick:()=>{SIM=null;go('entrevistas')}},icon('x'),'Salir')),
  h('div',{class:'bar'},h('i',{style:'width:'+(S_.i/S_.max*100)+'%'})),
  h('section',{class:'card stack chat'},
   h('div',{class:'muted'},'Puesto: '+S_.role+'. Las preguntas se generan según lo que vas respondiendo.'),
   ...S_.turns.slice(0,S_.i).flatMap(x=>[ivBubble(x),meBubble(x.a)]),
   ivBubble(t),
   ta,h('div',{class:'row'},send,h('span',{class:'muted'},'Ctrl + Enter para enviar.')),stat));
 ta.focus({preventScroll:true});
}
function simAIEnd(){
 const S_=SIM;
 const overall=h('div',{class:'stack'}),ovBtn=h('button',{type:'button',class:'btn claude'},icon('spark'),'Evaluación general de la entrevista');
 let busy=false;
 ovBtn.onclick=async()=>{
  if(busy)return;busy=true;ovBtn.disabled=true;overall.replaceChildren(h('p',{class:'muted'},'Evaluando toda la entrevista…'));
  try{
   const r=await SAMPLE.json(`You are an expert HR interviewer and English coach for a Spanish-speaking candidate from Argentina applying for ${S_.role}. Evaluate this full mock interview.\n\n${simTranscript(S_,S_.turns.length)}\n\nReply ONLY with JSON: {"summary":string,"strengths":[string],"improve":[string],"level":string,"tip":string}. Everything except "level" is in Rioplatense Spanish (vos), concrete and encouraging, citing what the candidate actually said. "strengths": up to 3. "improve": up to 4, about content, structure and English. "level": estimated English level shown (A2, B1 or B2).`,{modelTier:'complex',cache:false});
   if(!r||!r.summary)throw {code:'invalid_json'};
   const arr=x=>Array.isArray(x)?x.filter(s=>typeof s==='string'&&s.trim()):[];
   overall.replaceChildren(h('div',{class:'stack'},h('p',{class:'p'},String(r.summary)),
    r.level?h('div',{class:'row'},h('span',{class:'tag'},'Nivel estimado: '+String(r.level))):null,
    arr(r.strengths).length?h('div',{class:'note tip'},h('b',{class:'n-t'},'Lo que hiciste bien'),h('ul',{class:'bl'},arr(r.strengths).map(x=>h('li',null,x)))):null,
    arr(r.improve).length?h('div',{class:'note info'},h('b',{class:'n-t'},'Para mejorar'),h('ul',{class:'bl'},arr(r.improve).map(x=>h('li',null,x)))):null,
    r.tip?h('div',{class:'note info'},h('b',{class:'n-t'},'Consejo'),String(r.tip)):null));
  }catch(e){overall.replaceChildren(h('div',{class:'note bad'},h('b',{class:'n-t'},'No se pudo evaluar'),errCopy(e)))}
  busy=false;ovBtn.disabled=false;
 };
 main.replaceChildren(
  pageHead('Entrevista terminada','¡Buen trabajo!','Revisá la conversación y pedile a Claude que corrija cada respuesta o que evalúe la entrevista completa.',[h('button',{type:'button',class:'btn pri',onclick:()=>{SIM={stage:'setup'};viewSimulacro()}},'Hacer otra')]),
  h('section',{class:'card stack chat'},
   ...S_.turns.flatMap(x=>[ivBubble(x),meBubble(x.a)]),
   S_.closing?h('div',{class:'cbub iv'},h('span',{class:'who'},'Entrevistadora'),h('p',{class:'b-re'},S_.closing),h('div',{class:'row'},listenBtn(S_.closing))):null),
  h('section',{class:'card stack'},h('div',{class:'row'},ovBtn),overall),
  h('div',{class:'stack gap'},S_.turns.map((t,i)=>{
   const ai=aiBox('iv',t.q,()=>t.a);
   return h('article',{class:'card stack'},h('span',{class:'tag'},'Respuesta '+(i+1)),h('b',{class:'q-en'},t.q),h('div',{class:'src-box'},t.a||'—'),h('div',{class:'row'},t.a?ai.btn:null),ai.out);
  })));

     h('button',{type:'button',class:'btn ghost',onclick:()=>fin(false,'A repasarlo. Se dice:')},'Quiero repasarlo')));
  };
  const micBtn=h('button',{type:'button',class:'btn claude mic',onclick:()=>{
   if(answered)return;
   if(listening){try{rec.stop()}catch(e){}return}
   try{
    rec=new SRc();rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=false;
    let best='';
    rec.onstart=()=>{listening=true;micBtn.classList.add('rec');micBtn.replaceChildren(icon('mic'),'Escuchando… tocá para terminar');heard.replaceChildren(h('span',{class:'muted'},'Te escucho…'))};
    rec.onresult=ev=>{let txt='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];let b=r[0].transcript,sc=score(b);for(let k=1;k<r.length;k++){const sc2=score(r[k].transcript);if(sc2>sc){sc=sc2;b=r[k].transcript}}txt+=b}best=txt;heard.replaceChildren(h('span',null,txt))};
    rec.onerror=ev=>{listening=false;micBtn.classList.remove('rec');micBtn.replaceChildren(icon('mic'),'Hablar');if(ev.error==='not-allowed'||ev.error==='service-not-allowed'||ev.error==='audio-capture'||ev.error==='language-not-supported'||ev.error==='network')manual('Este navegador o esta vista no deja usar el micrófono.');else if(ev.error==='no-speech')heard.replaceChildren(h('span',{class:'muted'},'No te escuché. Probá de nuevo, más cerca del micrófono.'))};
    rec.onend=()=>{listening=false;micBtn.classList.remove('rec');micBtn.replaceChildren(icon('mic'),'Hablar');if(answered||!best.trim())return;const sc=score(best),need=tok(q.target).length<=2?1:0.75;fin(sc>=need,sc>=need?(sc>=0.99?'¡Perfecto!':'¡Se entendió bien!'):'Casi. Probá decirlo así:')};
    rec.start();
   }catch(e){manual('No se pudo activar el reconocimiento de voz.')}
  }},icon('mic'),'Hablar');
  const nohear=h('button',{type:'button',class:'btn ghost',onclick:()=>manual('Elegiste no usar el micrófono.')},'No puedo usar el micrófono');
  if(SRc)area.append(h('div',{class:'row'},micBtn,q.target?h('button',{type:'button',class:'btn ghost',onclick:e=>speak(q.target,e.currentTarget)},icon('spk'),'Escuchar el modelo'):null,nohear),heard,h('p',{class:'muted'},'El micrófono necesita tu permiso y funciona en navegadores como Chrome, Edge o Safari.'));
  else manual('Este navegador no tiene reconocimiento de voz.');
  body.append(area);
 }
 const head=h('div',{class:'row sp'},h('span',{class:'tag tag-q'},'Ejercicio '+(s.i+1)+' de '+s.items.length),h('button',{type:'button',class:'btn ghost sm exit-x','aria-label':'Salir de la práctica',onclick:()=>{stopSpeech();SESS=null;go('practica')}},icon('x'),'Salir'));
 const card=h('article',{class:'card stack q-card'},
  h('span',{class:'label'},q.title),
  q.audio?h('div',{class:'row'},h('button',{type:'button',class:'btn pri',onclick:()=>speak(q.audio)},icon('spk'),'Escuchar'),h('button',{type:'button',class:'btn ghost sm'+(S.slow?' on':''),'aria-pressed':S.slow?'true':'false',onclick:e=>{S.slow=!S.slow;save();e.currentTarget.setAttribute('aria-pressed',String(S.slow));e.currentTarget.classList.toggle('on',S.slow);speak(q.audio)}},'Más lento')):null,
  q.big&&!q.hideBig?h('div',{class:'q-prompt'+(q.big.length>60?' long':'')},h('span',null,q.big),q.listen?listenBtn(q.listen):null):null,
  q.pic?h('div',{class:'pic-big',role:'img','aria-label':'Imagen del ejercicio'},q.pic):null,
  q.sub?h('div',{class:'muted'},q.sub):null,
  body,fb);
 main.replaceChildren(head,h('div',{class:'bar'},h('i',{style:'width:'+(s.i/s.items.length*100)+'%'})),card);
 window.scrollTo({top:0});
}
function finishSession(){
 const s=SESS;s.done=true;
 const n=s.items.length;s.bonus=n>=5&&s.ok/n>=0.8?20:0;if(s.bonus)addXP(s.bonus);
 if(s.o.level){s.lvRes=levelFrom(s.res);S.level={lv:s.lvRes.lv,acc:s.lvRes.acc,at:todayKey()};addXP(30)}
 s.xp=S.xp-s.xp0;
 save();viewResult();
}
function viewResult(){
 const s=SESS,n=s.items.length,pct=Math.round(s.ok/n*100);
 const wrong=s.res.filter(r=>!r.right);
 main.replaceChildren(
  s.lvRes?levelResultCard(s.lvRes):pageHead('Resultado',pct>=80?'¡Muy bien!':(pct>=50?'Vas por buen camino':'Buen intento'),`Acertaste ${s.ok} de ${n} ejercicios.`),
  h('div',{class:'grid3'},
   h('div',{class:'card stat2'},h('b',null,pct+'%'),h('span',null,'de aciertos')),
   h('div',{class:'card stat2'},h('b',null,'+'+s.xp),h('span',null,'puntos XP'+(s.bonus?' (con bonus)':''))),
   h('div',{class:'card stat2'},h('b',null,String(wrong.length)),h('span',null,'para repasar'))),
  wrong.length?h('section',{class:'stack gap'},h('h2',{class:'h2'},'Para repasar'),wrong.map(r=>h('article',{class:'card stack'},h('span',{class:'label'},r.q.title),r.q.big&&!r.q.hideBig?h('b',null,r.q.big):null,r.q.answerText?h('div',null,'Respuesta: ',h('b',null,r.q.answerText)):null,h('details',{class:'det'},h('summary',null,'Ver explicación'),r.q.explain())))):h('div',{class:'note tip'},h('b',{class:'n-t'},'Sin errores'),'No fallaste ninguno en esta tanda.'),
  h('div',{class:'row'},
   s.lvRes?h('a',{class:'btn cta',href:'#'+levelRoute(s.lvRes.lv)},'Ir a mi ruta sugerida',icon('arrow')):h('button',{type:'button',class:'btn cta',onclick:()=>startPractice(Object.assign({},s.o,{review:false}))},'Otra tanda'),
   s.lvRes?h('button',{type:'button',class:'btn ghost',onclick:startLevelTest},'Medir de nuevo'):null,
   Object.keys(S.missed).some(id=>BYID[id])?h('button',{type:'button',class:'btn pri',onclick:()=>startPractice({review:true,count:10})},'Repasar errores'):null,
   h('button',{type:'button',class:'btn ghost',onclick:()=>{SESS=null;go('practica')}},'Cambiar configuración')));
}
const levelRoute=lv=>({A1:'leccion-l13',A2:'leccion-l14',B1:'leccion-l08',B2:'leccion-l17',C1:'leccion-l20',C2:'herramientas'}[lv]||'teoria');
function levelResultCard(r){
 const next={A1:'Empezá por la ruta 1: presentarte, describir y los términos básicos.',A2:'Seguí con la ruta 2: entrevistas y comunicación con candidatos.',B1:'Seguí con la ruta 3: método STAR, devoluciones y métricas.',B2:'Seguí con la ruta 4: lenguaje diplomático, discurso referido y documentos formales.',C1:'Seguí con la ruta 5: registro, vocabulario preciso y estructuras formales.',C2:'Reforzá con la entrevista simulada y las herramientas.'}[r.lv];
 return h('section',{class:'card lvlres'},h('span',{class:'label'},'Tu nivel estimado'),
  h('div',{class:'row'},h('span',{class:'nv-big'},r.lv),h('span',{class:'muted'},levelCopy(r.lv))),
  levelBars(r.acc),h('div',{class:'note info'},h('b',{class:'n-t'},'Por dónde seguir'),next));
}
function viewPractica(){
 if(!SESS)return viewConfig();
 if(SESS.done)return viewResult();
 return viewQuestion();
}

/* ---------- Ruteo ---------- */
function route(){
 stopSpeech();
 const hs=(location.hash||'#inicio').slice(1)||'inicio';
 const [sec,tab]=sectionOf(hs);
 if(hs==='practica'&&!SESS)resetPCFG();
 CURSUB=(SUBTABS[sec]&&!(hs==='practica'&&SESS&&!SESS.done))?subnavEl(sec,tab):null;
 Object.keys(navEls).forEach(k=>{navEls[k].classList.toggle('on',k===sec);if(k===sec)navEls[k].setAttribute('aria-current','page');else navEls[k].removeAttribute('aria-current')});
 try{
  if(hs==='inicio')viewInicio();
  else if(hs==='entrevistas')viewEntrevistas();
  else if(/^entrevista-/.test(hs))viewEntrevista(hs.slice(11));
  else if(hs==='simulacro')viewSimulacro();
  else if(hs==='glosario')viewGlosario();
  else if(hs==='frases')viewFrases();
  else if(hs==='practica')viewPractica();
  else if(hs==='teoria')viewTeoria();
  else if(/^leccion-/.test(hs))viewLeccion(hs.slice(8));
  else if(hs==='herramientas'||TOOLIDS.includes(hs))viewHerramientas(TOOLIDS.includes(hs)?hs:null);
  else if(hs==='nivel')viewNivel();
  else viewInicio();
 }catch(e){console.error(e);main.replaceChildren(h('div',{class:'note bad'},h('b',{class:'n-t'},'Algo salió mal'),'Recargá la página. Si el problema sigue, volvé al inicio.'))}
 updateMini();window.scrollTo({top:0});
}
buildShell();
window.addEventListener('hashchange',route);
route();
