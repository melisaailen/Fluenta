 ph:[["I usually start by…","Normalmente empiezo…"],["After that, I…","Después de eso, yo…"],["Finally, I…","Por último, yo…"]]},
{id:'q09',cat:'exp',lvl:'B1',q:"Why are you leaving your current job?",es:"¿Por qué te vas de tu trabajo actual?",
 want:"Si tus motivos son profesionales y si hablás de tu empleador con respeto",
 doo:"Hablar de lo que buscás en vez de criticar a tu empleador actual",
 tip:"Nunca hables mal de tu empresa actual. Enfocate en lo que querés: crecer, aprender, asumir más responsabilidad.",
 model:"I've learned a lot in my current role, but I feel I'm ready for a new challenge. I'd like to take on more responsibility and work on talent development, which is something your company offers. I'm leaving on good terms and I'm grateful for the experience.",
 modelEs:"Aprendí mucho en mi puesto actual, pero siento que estoy lista para un nuevo desafío. Me gustaría asumir más responsabilidad y trabajar en desarrollo del talento, algo que su empresa ofrece. Me voy en buenos términos y estoy agradecida por la experiencia.",
 ph:[["I'm ready for a new challenge.","Estoy lista para un nuevo desafío."],["I'm looking for more growth opportunities.","Busco más oportunidades de crecimiento."],["I'm leaving on good terms.","Me voy en buenos términos."]]},
{id:'q10',cat:'exp',lvl:'B1',q:"What do you know about our company?",es:"¿Qué sabés de nuestra empresa?",
 want:"Si te informaste antes de venir y si te interesa el puesto de verdad",
 doo:"Investigar la empresa antes y mencionar dos datos concretos que te interesen",
 tip:"Antes de la entrevista, revisá la web, las redes y las noticias de la empresa. Mencioná dos datos y conectalos con tu interés.",
 model:"I know that your company has been operating in the industry for more than twenty years and that you recently opened a new branch. I also read that you promote internal growth and training, which is very important to me. That's one of the reasons why I applied.",
 modelEs:"Sé que su empresa opera en el sector hace más de veinte años y que recientemente abrió una nueva sucursal. También leí que promueven el crecimiento interno y la capacitación, lo cual es muy importante para mí. Es una de las razones por las que me postulé.",
 ph:[["I read that your company…","Leí que su empresa…"],["I was impressed by…","Me impresionó…"],["That's one of the reasons why I applied.","Es una de las razones por las que me postulé."]]},
{id:'q11',cat:'fort',lvl:'A2',q:"What are your greatest strengths?",es:"¿Cuáles son tus mayores fortalezas?",
 want:"Si conocés tus fortalezas y si son relevantes para el puesto",
 doo:"Elegir dos fortalezas útiles para el puesto y dar un ejemplo de cada una",
 tip:"Elegí cualidades relevantes para RRHH (comunicación, discreción, organización) y apoyá cada una con un ejemplo breve.",
 model:"I think my main strengths are communication and discretion. I'm good at listening to people and explaining things clearly. I'm also careful with confidential information, which is essential in HR. For example, I managed salary data for two years without any incidents.",
 modelEs:"Creo que mis principales fortalezas son la comunicación y la discreción. Soy buena para escuchar a las personas y explicar las cosas con claridad. Además, soy cuidadosa con la información confidencial, algo esencial en RRHH. Por ejemplo, manejé datos de sueldos durante dos años sin ningún incidente.",
 ph:[["One of my strengths is…","Una de mis fortalezas es…"],["I'm good at…","Soy buena para…"],["For example, I…","Por ejemplo, yo…"]]},
{id:'q12',cat:'fort',lvl:'B1',q:"What is your greatest weakness?",es:"¿Cuál es tu mayor debilidad?",
 want:"Si tenés autocrítica y si trabajás activamente para mejorar",
 doo:"Nombrar una debilidad real y no esencial para el puesto, y explicar cómo la mejorás",
 tip:"Elegí una debilidad real y que no sea clave para el puesto. Mostrá qué hacés para mejorarla. Evitá respuestas como «soy demasiado perfeccionista».",
 model:"I used to find it difficult to delegate tasks because I wanted everything to be perfect. I've been working on it by setting clear instructions and trusting my teammates. It has improved the way we work, and I've learned that sharing tasks makes the team stronger.",
 modelEs:"Antes me costaba delegar tareas porque quería que todo saliera perfecto. Estuve trabajando en eso dando instrucciones claras y confiando en mis compañeros. Mejoró la forma en que trabajamos y aprendí que compartir tareas fortalece al equipo.",
 ph:[["I used to find it difficult to…","Antes me costaba…"],["I've been working on it by…","Estuve trabajando en eso…"],["I've learned that…","Aprendí que…"]]},
{id:'q13',cat:'fort',lvl:'B1',q:"How do you handle stress and pressure?",es:"¿Cómo manejás el estrés y la presión?",
 want:"Si mantenés la calma y tenés estrategias concretas ante la presión",
 doo:"Describir una estrategia concreta que usás y dar un ejemplo real",
 tip:"Mostrá que tenés estrategias prácticas: priorizar, planificar, pedir ayuda a tiempo. Un ejemplo ayuda.",
 model:"When the pressure increases, I make a list of priorities and focus on one task at a time. During the payroll closing, for example, I set daily goals and asked for help when I needed it. I think staying calm and organized is the best way to meet deadlines.",
 modelEs:"Cuando aumenta la presión, hago una lista de prioridades y me enfoco en una tarea a la vez. Durante el cierre de liquidación, por ejemplo, fijé metas diarias y pedí ayuda cuando la necesité. Creo que mantener la calma y la organización es la mejor forma de cumplir con los plazos.",
 ph:[["I make a list of priorities.","Hago una lista de prioridades."],["I focus on one task at a time.","Me enfoco en una tarea a la vez."],["I ask for help when I need it.","Pido ayuda cuando la necesito."]]},
{id:'q14',cat:'fort',lvl:'B1',q:"How do you organize and prioritize your tasks?",es:"¿Cómo organizás y priorizás tus tareas?",
 want:"Cómo planificás tu trabajo y qué criterios usás para decidir qué va primero",
 doo:"Explicar qué criterio usás para priorizar y con qué herramientas te organizás",
 tip:"Explicá tu criterio (urgencia e impacto) y mencioná herramientas: calendario, listas, planillas.",
 model:"I organize my tasks by urgency and impact. At the beginning of each week, I make a plan in my calendar, and every morning I review it. Tasks with legal deadlines, such as payroll or employee registrations, always come first. Then I move on to the rest.",
 modelEs:"Organizo mis tareas por urgencia e impacto. Al comienzo de cada semana armo un plan en mi calendario y cada mañana lo reviso. Las tareas con plazos legales, como la liquidación de sueldos o los registros de personal, siempre van primero. Después sigo con el resto.",
 ph:[["I prioritize by urgency and impact.","Priorizo por urgencia e impacto."],["I plan my week in advance.","Planifico mi semana con anticipación."],["Deadlines always come first.","Los plazos siempre van primero."]]},
{id:'q15',cat:'cond',lvl:'B2',q:"Tell me about a time you had a conflict with a coworker.",es:"Contame sobre una vez que tuviste un conflicto con un compañero.",
 want:"Cómo resolvés desacuerdos y si asumís tu parte de la responsabilidad",
 doo:"Usar el método STAR y mostrar cómo lo resolviste sin culpar a la otra persona",
 tip:"Usá STAR: situación, tarea, acción y resultado. Elegí un conflicto real y resuelto, sin culpar a la otra persona. Mostrá empatía.",
 model:"In my previous job, a colleague and I disagreed about how to organize the filing system. I invited her to talk privately and listened to her point of view. We realized we had the same goal, so we combined both ideas into a new system. As a result, the files were easier to find, and our relationship improved.",
 modelEs:"En mi trabajo anterior, una compañera y yo no estábamos de acuerdo en cómo organizar el archivo. La invité a conversar en privado y escuché su punto de vista. Nos dimos cuenta de que teníamos el mismo objetivo, así que combinamos ambas ideas en un sistema nuevo. Como resultado, los archivos eran más fáciles de encontrar y mejoró nuestra relación.",
 ph:[["We had a disagreement about…","Tuvimos un desacuerdo sobre…"],["I listened to her point of view.","Escuché su punto de vista."],["We found a solution that worked for both.","Encontramos una solución que servía a las dos."]]},
{id:'q16',cat:'cond',lvl:'B2',q:"Describe a time when you had to meet a tight deadline.",es:"Describí una vez en que tuviste que cumplir un plazo muy ajustado.",
 want:"Cómo organizás tu trabajo cuando hay poco tiempo y qué resultado lográs",
 doo:"Mostrar cómo planificaste, qué priorizaste y qué resultado obtuviste",
 tip:"Mostrá planificación y comunicación: qué priorizaste, a quién pediste ayuda y qué lograste.",
 model:"Last year, we had to prepare all the documents for a new branch in just one week. I divided the work into daily tasks and asked two colleagues to help me with the contracts. I kept my manager informed every day. We finished one day early and without any errors.",
 modelEs:"El año pasado tuvimos que preparar toda la documentación para una nueva sucursal en solo una semana. Dividí el trabajo en tareas diarias y pedí a dos compañeras que me ayudaran con los contratos. Mantuve informada a mi jefa todos los días. Terminamos un día antes y sin errores.",
 ph:[["We had only one week to…","Teníamos solo una semana para…"],["I divided the work into…","Dividí el trabajo en…"],["We finished one day early.","Terminamos un día antes."]]},
{id:'q17',cat:'cond',lvl:'B2',q:"Tell me about a mistake you made at work. What did you learn?",es:"Contame un error que cometiste en el trabajo. ¿Qué aprendiste?",
 want:"Si asumís tus errores y si aprendés de ellos",
 doo:"Reconocer un error real, explicar cómo lo corregiste y qué cambiaste",
 tip:"Elegí un error real, no grave. Asumí la responsabilidad y poné el foco en la solución y en lo que cambiaste después.",
 model:"Once, I sent an attendance report with a wrong date, which delayed the payroll process by a few hours. I noticed the mistake, informed my manager immediately and corrected the report. Since then, I always use a checklist and review the data twice before sending it.",
 modelEs:"Una vez envié un informe de asistencia con una fecha equivocada, lo que demoró unas horas el proceso de liquidación. Me di cuenta del error, avisé a mi jefa de inmediato y corregí el informe. Desde entonces, uso siempre una lista de control y reviso los datos dos veces antes de enviarlos.",
 ph:[["I made a mistake with…","Cometí un error con…"],["I took responsibility and…","Asumí la responsabilidad y…"],["Since then, I always…","Desde entonces, siempre…"]]},
{id:'q18',cat:'cond',lvl:'B2',q:"Give an example of when you handled confidential information.",es:"Dá un ejemplo de cuando manejaste información confidencial.",
 want:"Si sos discreta y si seguís los procedimientos para cuidar los datos",
 doo:"Mostrar con un ejemplo cómo cuidás los datos y qué medidas tomás",
 tip:"En RRHH esto es central. Hablá de medidas concretas: acceso restringido, archivos protegidos, no comentar datos personales.",
 model:"In my current role, I manage salary data and medical certificates. I keep these files in a protected folder with restricted access, and I never discuss personal information with people who don't need it. Once, a colleague asked about another employee's salary, and I politely explained that I couldn't share that information.",
 modelEs:"En mi puesto actual manejo datos de sueldos y certificados médicos. Guardo esos archivos en una carpeta protegida con acceso restringido y nunca comento información personal con quienes no la necesitan. Una vez, un compañero preguntó por el sueldo de otra persona y le expliqué con amabilidad que no podía compartir esa información.",
 ph:[["I keep the files in a protected folder.","Guardo los archivos en una carpeta protegida."],["I never discuss personal information.","Nunca comento información personal."],["I explained that I couldn't share it.","Expliqué que no podía compartirlo."]]},
{id:'q19',cat:'cond',lvl:'B2',q:"Describe a time you had to give difficult feedback.",es:"Describí una vez en que tuviste que dar una devolución difícil.",
 want:"Si podés comunicar algo incómodo con respeto y con claridad",
 doo:"Mostrar que preparaste la conversación y que fuiste clara y respetuosa",
 tip:"Mostrá preparación, claridad y respeto. Explicá cómo cuidaste la relación y qué resultado hubo.",
 model:"A team member was repeatedly late with his reports. I prepared the conversation in advance, chose a private place and started by recognizing his good work. Then I explained the impact of the delays and asked about the reasons. We agreed on a plan with new deadlines, and his reports improved right away.",
 modelEs:"Un integrante del equipo entregaba sus informes tarde en forma reiterada. Preparé la conversación con anticipación, elegí un lugar privado y empecé reconociendo su buen trabajo. Después expliqué el impacto de los retrasos y pregunté por los motivos. Acordamos un plan con nuevos plazos y sus informes mejoraron enseguida.",
 ph:[["I prepared the conversation in advance.","Preparé la conversación con anticipación."],["I started by recognizing…","Empecé reconociendo…"],["We agreed on a plan.","Acordamos un plan."]]},
{id:'q20',cat:'cond',lvl:'B1',q:"Tell me about a time you worked as part of a team.",es:"Contame sobre una vez que trabajaste en equipo.",
 want:"Cómo colaborás con otras personas y qué rol tomás en un grupo",
 doo:"Contar qué rol tuviste en el equipo y qué lograron entre todos",
 tip:"Hablá en plural cuando corresponde («we»), pero aclará cuál fue tu aporte concreto.",
 model:"Last year, our team organized a training day for all employees. I was in charge of the schedule and the invitations, while my colleagues prepared the materials and the rooms. We held weekly meetings to check our progress. The event was a success, and the feedback from participants was very positive.",
 modelEs:"El año pasado nuestro equipo organizó una jornada de capacitación para todo el personal. Yo estuve a cargo del cronograma y las invitaciones, mientras mis compañeros preparaban los materiales y las salas. Hicimos reuniones semanales para controlar el avance. El evento fue un éxito y la devolución de los participantes fue muy positiva.",
 ph:[["I was in charge of…","Estuve a cargo de…"],["We held weekly meetings.","Hicimos reuniones semanales."],["The feedback was very positive.","La devolución fue muy positiva."]]},
{id:'q21',cat:'sit',lvl:'B2',q:"How would you handle an employee who is frequently late?",es:"¿Cómo manejarías a un empleado que llega tarde con frecuencia?",
 want:"Si seguís un proceso justo y documentado y si escuchás a la persona antes de sancionar",
 doo:"Proponer una conversación privada, escuchar a la persona y documentar lo acordado",
 tip:"Mostrá un proceso: revisar los registros, hablar en privado, escuchar los motivos, acordar un plan y documentar. Las sanciones, solo si es necesario y según la política.",
 model:"First, I would check the attendance records to confirm the pattern. Then I would talk to the employee in private to understand the reasons, because there might be a personal or health issue. We would agree on a plan with clear expectations and I would document the conversation. If the situation continued, I would follow the company policy on disciplinary actions.",
 modelEs:"Primero, revisaría los registros de asistencia para confirmar el patrón. Después hablaría con la persona en privado para entender los motivos, porque podría haber un problema personal o de salud. Acordaríamos un plan con expectativas claras y documentaría la conversación. Si la situación continuara, seguiría la política de la empresa sobre sanciones disciplinarias.",
 ph:[["First, I would check…","Primero, revisaría…"],["I would talk to the employee in private.","Hablaría con la persona en privado."],["I would document the conversation.","Documentaría la conversación."]]},
{id:'q22',cat:'sit',lvl:'B2',q:"An employee tells you that their manager is harassing them. What would you do?",es:"Un empleado te dice que su jefe lo está acosando. ¿Qué harías?",
 want:"Si tomás el tema en serio, mantenés la confidencialidad y seguís el protocolo",
 doo:"Escuchar sin juzgar, garantizar la confidencialidad y activar el protocolo de la empresa",
 tip:"Mostrá seriedad y proceso: escuchar sin juzgar, confidencialidad, registro por escrito, protocolo de la empresa e investigación imparcial. No prometas resultados.",
 model:"I would take the complaint very seriously. First, I would listen carefully without judging and explain that the information will be handled confidentially. Then I would record the facts in writing and follow the company's protocol, which includes an impartial investigation. I would also make sure the employee is protected from any retaliation during the process.",
 modelEs:"Tomaría la denuncia con mucha seriedad. Primero, escucharía con atención sin juzgar y explicaría que la información se tratará con confidencialidad. Después, dejaría constancia escrita de los hechos y seguiría el protocolo de la empresa, que incluye una investigación imparcial. También me aseguraría de que la persona esté protegida de cualquier represalia durante el proceso.",
 ph:[["I would take it very seriously.","Lo tomaría muy en serio."],["The information will be handled confidentially.","La información se tratará con confidencialidad."],["I would follow the company's protocol.","Seguiría el protocolo de la empresa."]]},
{id:'q23',cat:'sit',lvl:'B2',q:"A manager asks you to hire a friend without following the selection process. What do you do?",es:"Un gerente te pide contratar a un amigo sin seguir el proceso de selección. ¿Qué hacés?",
 want:"Si mantenés la integridad y sabés decir que no con respeto",
 doo:"Decir que no con respeto, explicar el motivo y ofrecer una alternativa dentro del proceso",
 tip:"Mostrá integridad: explicá por qué el proceso es importante (igualdad de oportunidades, riesgos legales) y ofrecé una salida: que su amigo se postule por el proceso.",
 model:"I would explain, politely but clearly, that we need to follow the selection process to guarantee equal opportunities and to protect the company. I would suggest that his friend apply through the regular process, where he will be evaluated like any other candidate. If the manager insisted, I would inform my supervisor.",
 modelEs:"Explicaría, con amabilidad pero con claridad, que debemos seguir el proceso de selección para garantizar igualdad de oportunidades y proteger a la empresa. Le sugeriría que su amigo se postule por el proceso habitual, donde será evaluado como cualquier otro candidato. Si el gerente insistiera, informaría a mi supervisor.",
 ph:[["I would politely explain that…","Explicaría con amabilidad que…"],["To guarantee equal opportunities…","Para garantizar igualdad de oportunidades…"],["I would inform my supervisor.","Informaría a mi supervisor."]]},
{id:'q24',cat:'sit',lvl:'B2',q:"How would you handle a payroll error that left an employee underpaid?",es:"¿Cómo manejarías un error de liquidación que dejó a un empleado con menos sueldo del que le correspondía?",
 want:"Si actuás con rapidez, transparencia y orden para corregir el error",
 doo:"Verificar el error, avisar a la persona, corregirlo cuanto antes y prevenir que se repita",
 tip:"Mostrá rapidez y transparencia: confirmar el error, pedir disculpas, corregirlo en el plazo más corto posible, y revisar el proceso para evitar que se repita.",
 model:"I would first verify the error and calculate the exact difference. Then I would contact the employee, apologize and explain how and when it will be corrected. I would arrange the payment as soon as possible and record the case. Finally, I would review the process to find out what went wrong and prevent it from happening again.",
 modelEs:"Primero verificaría el error y calcularía la diferencia exacta. Después me comunicaría con el empleado, pediría disculpas y le explicaría cómo y cuándo se corregirá. Gestionaría el pago lo antes posible y dejaría registro del caso. Por último, revisaría el proceso para saber qué falló y evitar que vuelva a ocurrir.",
 ph:[["I would verify the error first.","Primero verificaría el error."],["I would apologize and explain…","Pediría disculpas y explicaría…"],["To prevent it from happening again…","Para evitar que vuelva a ocurrir…"]]},
{id:'q25',cat:'sit',lvl:'B2',q:"How would you onboard a new employee who works remotely?",es:"¿Cómo harías la inducción de una persona nueva que trabaja a distancia?",
 want:"Si sabés organizar una bienvenida clara y cercana aun sin presencia física",
 doo:"Proponer un plan de inducción por etapas, con una persona de referencia y seguimiento",
 tip:"Pensá en etapas: antes del ingreso, primer día, primera semana y primer mes. Incluí equipos, accesos, presentaciones y seguimiento.",
 model:"I would start before the first day by sending the equipment, the access to systems and a welcome email with the schedule. On the first day, we would have a video call to introduce the team and explain the main policies. I would assign a buddy to answer questions, and I would check in with the new employee every week during the first month.",
 modelEs:"Empezaría antes del primer día, enviando el equipo, los accesos a los sistemas y un correo de bienvenida con el cronograma. El primer día haríamos una videollamada para presentar al equipo y explicar las políticas principales. Asignaría un compañero guía para responder consultas y haría un seguimiento semanal con la persona durante el primer mes.",
 ph:[["I would start before the first day.","Empezaría antes del primer día."],["I would assign a buddy.","Asignaría un compañero guía."],["I would check in every week.","Haría un seguimiento todas las semanas."]]},
{id:'q26',cat:'mot',lvl:'B1',q:"Why do you want to work for our company?",es:"¿Por qué querés trabajar en nuestra empresa?",
 want:"Si elegiste esta empresa por motivos concretos y no por casualidad",
 doo:"Dar dos razones concretas sobre la empresa y conectarlas con tus objetivos",
 tip:"Hablá de la empresa (valores, crecimiento, proyectos) y de cómo encaja con tus objetivos. Evitá respuestas generales como «porque necesito trabajo».",
 model:"I'm attracted to your company because of its focus on people development and its good reputation as an employer. I also like that you invest in training. I believe my experience in recruitment and my commitment to teamwork would be a valuable contribution to your HR department.",
 modelEs:"Me atrae su empresa por su enfoque en el desarrollo de las personas y su buena reputación como empleador. También me gusta que inviertan en capacitación. Creo que mi experiencia en reclutamiento y mi compromiso con el trabajo en equipo serían un aporte valioso para su área de RRHH.",
 ph:[["I'm attracted to your company because…","Me atrae su empresa porque…"],["I admire your approach to…","Admiro su enfoque en…"],["I believe I can contribute by…","Creo que puedo aportar…"]]},
{id:'q27',cat:'mot',lvl:'B1',q:"Where do you see yourself in five years?",es:"¿Dónde te ves en cinco años?",
 want:"Si tenés objetivos profesionales realistas y si encajan con la empresa",
 doo:"Mostrar un objetivo de crecimiento realista, vinculado con el puesto y la empresa",
 tip:"Mostrá ambición realista: crecer dentro del área, asumir más responsabilidad, especializarte. No nombres un puesto que implique reemplazar a quien te entrevista.",
 model:"In five years, I see myself as an HR specialist with more responsibility, maybe leading projects in talent development. I'd like to keep learning and growing within the company, and I hope to contribute to the team's results during that time.",
 modelEs:"En cinco años me veo como especialista en RRHH con más responsabilidad, quizás liderando proyectos de desarrollo del talento. Me gustaría seguir aprendiendo y creciendo dentro de la empresa, y espero contribuir a los resultados del equipo durante ese tiempo.",
 ph:[["In five years, I see myself…","En cinco años me veo…"],["I'd like to keep growing…","Me gustaría seguir creciendo…"],["I hope to take on more responsibility.","Espero asumir más responsabilidad."]]},
{id:'q28',cat:'mot',lvl:'B1',q:"What are your salary expectations?",es:"¿Cuáles son tus pretensiones salariales?",
 want:"Si tu expectativa es realista y si es compatible con la banda del puesto",
 doo:"Investigar el rango del mercado, dar un rango razonable y mostrar flexibilidad",
 tip:"Investigá el rango del mercado antes. Dá un rango en lugar de un número exacto y aclará si es bruto o neto. Mostrá flexibilidad.",
 model:"Based on my experience and the market for this position, I'm looking for a gross monthly salary between X and Y. However, I'm open to discussing it, because the whole package, including benefits and growth opportunities, is also important to me.",
 modelEs:"Según mi experiencia y el mercado para este puesto, busco un sueldo mensual bruto entre X e Y. De todos modos, estoy abierta a conversarlo, porque el paquete completo, incluidos los beneficios y las oportunidades de crecimiento, también es importante para mí.",
 ph:[["Based on my experience…","Según mi experiencia…"],["I'm looking for a gross salary between… and…","Busco un sueldo bruto entre… y…"],["I'm open to discussing it.","Estoy abierta a conversarlo."]]},
{id:'q29',cat:'mot',lvl:'A2',q:"When could you start?",es:"¿Cuándo podrías empezar?",
 want:"Cuánta disponibilidad real tenés y si cumplirías con el preaviso actual",
 doo:"Dar una fecha realista que tenga en cuenta tu preaviso actual",
 tip:"Sé realista: si tenés preaviso, mencionalo. Si podés empezar de inmediato, decilo con claridad.",
 model:"I have to work my notice period in my current job, so I could start in about two weeks. If necessary, I can talk to my employer to see if the date can be adjusted.",
 modelEs:"Tengo que cumplir el preaviso en mi trabajo actual, así que podría empezar dentro de unas dos semanas. Si hace falta, puedo hablar con mi empleador para ver si se puede ajustar la fecha.",
 ph:[["I could start on…","Podría empezar el…"],["I have to give notice first.","Primero tengo que dar el preaviso."],["I'm available immediately.","Estoy disponible de inmediato."]]},
{id:'q30',cat:'mot',lvl:'A2',q:"Are you comfortable with a hybrid schedule?",es:"¿Te resulta cómodo un horario híbrido?",
 want:"Si te adaptás a las condiciones del puesto y cómo te organizás",
 doo:"Responder con claridad y mencionar cómo te organizás en ambas modalidades",
 tip:"Respondé con claridad. Si tenés alguna condición, decilo con respeto y proponé una solución.",
 model:"Yes, I'm very comfortable with it. I have worked both in the office and from home, and I know how to organize my time in both situations. I think hybrid work is a good balance between teamwork and focus.",
 modelEs:"Sí, me resulta muy cómodo. Trabajé tanto en la oficina como desde casa y sé cómo organizar mi tiempo en ambas situaciones. Creo que el trabajo híbrido es un buen equilibrio entre el trabajo en equipo y la concentración.",
 ph:[["I'm very comfortable with…","Me resulta muy cómodo…"],["I know how to organize my time.","Sé organizar mi tiempo."],["It's a good balance between…","Es un buen equilibrio entre…"]]},
{id:'q31',cat:'mot',lvl:'B1',q:"Why should we hire you?",es:"¿Por qué deberíamos contratarte?",
 want:"Qué valor concreto aportás y en qué te diferenciás de otras personas",
 doo:"Resumir tu experiencia, tu valor para el puesto y tu interés en la empresa",

 {q:'«You ___ share your password with anyone.» (está prohibido)',o:['don\'t have to','mustn\'t','shouldn\'t to','aren\'t'],a:1,why:'Prohibición: mustn\'t.'},
 {q:'«I ___ stay late yesterday.» (fue obligatorio)',o:['must','had to','have to','musted'],a:1,why:'Must no tiene pasado: se usa had to.'},
 {q:'¿Qué opción usa bien can?',o:['She cans work remotely.','She can works remotely.','She can work remotely.','She can to work remotely.'],a:2,why:'Modal + verbo base, sin -s ni to.'},
 {q:'Recomendación suave: «You ___ prepare examples for the interview.»',o:['must','should','mustn\'t','are required'],a:1,why:'Should recomienda sin obligar.'}
 ]},
{id:'l04',n:4,t:'Pedidos, cortesía y tono profesional',en:'Polite language at work',lvl:'B1',cat:'Comunicación',
 goal:'Pedir, ofrecer ayuda y dar malas noticias con amabilidad.',
 why:'En RRHH casi todo es una conversación sensible. Una orden directa suena brusca aunque la gramática sea correcta.',
 blocks:[
 {k:'rule',h:'Pedir algo con amabilidad',t:'Cuanto más indirecta es la frase, más amable suena: **Could you…? / Would you mind + -ing? / Would it be possible to…? / I was wondering if you could…**',
  ex:[['Could you send me your CV, please?','¿Podrías enviarme tu CV, por favor?'],['Would you mind sending the documents today?','¿Te molestaría enviar la documentación hoy?'],['Would it be possible to reschedule the interview?','¿Sería posible reprogramar la entrevista?'],['I was wondering if you could share your availability.','Quería saber si podrías compartirme tu disponibilidad.']]},
 {k:'rule',h:'Ofrecer ayuda',t:'**Would you like me to…? / Shall I…?**',ex:[['Would you like me to send you the job description?','¿Querés que te envíe la descripción del puesto?'],['Shall I book the meeting room?','¿Reservo la sala de reuniones?']]},
 {k:'rule',h:'Suavizar malas noticias',t:'Usá **unfortunately, I\'m afraid, we regret to inform you** y expresiones como **not quite** o **a bit**.',
  ex:[['I\'m afraid we can\'t offer that salary.','Lamentablemente no podemos ofrecer ese salario.'],['Unfortunately, we have decided to move forward with another candidate.','Lamentablemente, decidimos continuar con otra candidatura.'],['Your profile is not quite what we\'re looking for at the moment.','Tu perfil no se ajusta del todo a lo que buscamos por ahora.']]},
 {k:'table',h:'Directo y amable',head:['Directo (mejor evitar)','Más amable'],rows:[['Give me your CV.','Could you send me your CV, please?'],['I need your answer today.','Would it be possible to get your answer today?'],['You didn\'t send the form.','It seems the form hasn\'t reached us yet.']]},
 {k:'note',type:'tip',h:'Please y thank you',t:'En el inglés profesional la cortesía no es opcional. **Please** y **thank you** suavizan cualquier pedido.'},
 {k:'wrong',h:'Errores frecuentes',items:[['Would you mind to send the file?','Would you mind sending the file?','Después de «mind» va verbo + -ing.'],['Can you to help me?','Could you help me?','Después de can o could no se usa to.'],['I want that you send me the form.','I would like you to send me the form.','En inglés: would like + persona + to + verbo, sin «that».']]},
 {k:'phr',h:'Frases útiles',items:[['Thank you for your patience.','Gracias por su paciencia.'],['I apologize for the inconvenience.','Pido disculpas por las molestias.'],['Please let me know if you have any questions.','Avisame si tenés alguna consulta.'],['I would appreciate it if you could…','Le agradecería que pudiera…']]}
 ],
 check:[
 {q:'¿Cuál suena más amable para pedir un documento?',o:['Send me the file.','I need the file now.','Could you send me the file, please?','You must send the file.'],a:2,why:'Could you… please es una forma indirecta y cortés.'},
 {q:'«Would you mind ___ the form today?»',o:['to complete','completing','complete','completed'],a:1,why:'Después de «mind» va verbo + -ing.'},
 {q:'Rechazo respetuoso: ¿cuál es mejor?',o:['You are not good for the job.','Unfortunately, we have decided to move forward with other candidates.','We don\'t want you.','No.'],a:1,why:'Es claro, amable y no juzga a la persona.'},
 {q:'«I was wondering ___ you could share your availability.»',o:['that','if','to','what'],a:1,why:'«I was wondering if…» es una forma cortés de pedir.'},
 {q:'Ofrecer ayuda: «___ you like me to send the details?»',o:['Do','Would','Are','Can'],a:1,why:'Would you like me to… ofrece ayuda con amabilidad.'},
 {q:'¿Cómo se formula un pedido con would like?',o:['I want that you confirm.','I want you confirm.','I would like you to confirm.','I would like that you confirm.'],a:2,why:'Would like + persona + to + verbo.'}
 ]},
{id:'l05',n:5,t:'Ofertas y negociación',en:'Conditionals for offers and negotiation',lvl:'B2',cat:'Gramática aplicada',
 goal:'Presentar condiciones, hacer propuestas y negociar con tono profesional.',
 why:'Las ofertas, las contraofertas y las condiciones de ingreso se expresan casi siempre con condicionales.',
 blocks:[
 {k:'rule',h:'Primer condicional: una situación real',t:'**If + presente, will + verbo base.** Después de «if» no se usa will.',
  ex:[['If you accept the offer, we will send the contract today.','Si aceptás la oferta, te enviamos el contrato hoy.'],['If the candidate passes the test, we\'ll invite her to a final interview.','Si la candidata aprueba la prueba, la invitamos a una entrevista final.']]},
 {k:'rule',h:'Segundo condicional: hipotético o más cortés',t:'**If + pasado simple, would + verbo base.** Con «I» o «he/she» se acepta **were** («If I were you…»).',
  ex:[['If you joined the team, you would report to the HR manager.','Si te sumaras al equipo, responderías ante la gerencia de RRHH.'],['We could offer more flexibility if you were able to start in January.','Podríamos ofrecer más flexibilidad si pudieras empezar en enero.'],['If I were in your position, I would ask for more details.','En tu lugar, yo pediría más detalles.']]},
 {k:'rule',h:'Otras conexiones útiles',t:'**unless** (a menos que), **as long as / provided that** (siempre que), **in case** (por si acaso).',
  ex:[['Unless you have another offer, we\'d like you to start in March.','A menos que tengas otra oferta, nos gustaría que empieces en marzo.'],['You will receive the bonus as long as you meet your targets.','Vas a recibir el bono siempre que cumplas tus objetivos.']]},
 {k:'table',h:'Resumen',head:['Tipo','If…','Resultado','Uso'],rows:[['Primero','presente','will + base','posible, real'],['Segundo','pasado','would + base','hipotético o más cortés']]},
 {k:'note',type:'tip',h:'En una negociación',t:'El segundo condicional suena más suave. «If we increased the offer, would you accept?» abre la conversación; «If we increase it, will you accept?» suena a trato cerrado.'},
 {k:'wrong',h:'Errores frecuentes',items:[['If you will accept, we will send the contract.','If you accept, we will send the contract.','Después de if no se usa will.'],['If I would have more time, I would call you.','If I had more time, I would call you.','Segundo condicional: if + pasado, no would.'],['Unless you don\'t agree, we will proceed.','Unless you agree, we will proceed.','«Unless» ya significa «if… not».']]},
 {k:'phr',h:'Frases útiles',items:[['If you have any questions, please let me know.','Si tenés alguna consulta, avisame.'],['Would you be open to…?','¿Estarías dispuesto/a a…?'],['Provided that the references are positive…','Siempre que las referencias sean positivas…'],['We would be happy to… if…','Estaríamos encantados de… si…']]}
 ],
 check:[
 {q:'«If you ___ the offer, we will send the contract.»',o:['will accept','accept','would accept','accepted'],a:1,why:'Primer condicional: if + presente.'},
 {q:'«If I ___ you, I would ask about the benefits.»',o:['am','was being','were','will be'],a:2,why:'«If I were you» es la forma estándar.'},
 {q:'«We ___ more flexibility if you could start in March.»',o:['will offer','would offer','offer','offered'],a:1,why:'Segundo condicional: would + verbo base.'},
 {q:'«___ you have another offer, we\'d like you to start soon.» (a menos que)',o:['If','Unless','When','Although'],a:1,why:'«Unless» significa «a menos que».'},
 {q:'¿Qué condicional está bien armado?',o:['If she will accept, we will start the process.','If she accepts, we will start the process.','If she accepted, we will start the process.','If she would accept, we start the process.'],a:1,why:'If + presente, will + base.'},
 {q:'«You will get the bonus ___ you meet your targets.» (siempre que)',o:['unless','as long as','in case','even if'],a:1,why:'«As long as» equivale a «siempre que».'}
 ]},
{id:'l06',n:6,t:'Avisos y políticas: la voz pasiva',en:'Passive voice',lvl:'B1',cat:'Gramática aplicada',
 goal:'Redactar avisos, comunicados y políticas con tono formal.',
 why:'En español usamos mucho el «se» impersonal (se revisan, se notificará). En inglés eso casi siempre es voz pasiva.',
 blocks:[
 {k:'rule',h:'Cómo se forma',t:'**be + participio pasado.** El verbo be indica el tiempo: is / are (presente), was / were (pasado), will be (futuro), must be (con modal).',
  ex:[['Applications are reviewed every Friday.','Las postulaciones se revisan todos los viernes.'],['The position was filled last month.','El puesto se cubrió el mes pasado.'],['Candidates will be contacted by email.','Se contactará a los candidatos por correo.'],['All documents must be submitted by Monday.','Toda la documentación debe presentarse a más tardar el lunes.']]},
 {k:'rule',h:'Cuándo usarla',t:'Cuando importa la acción y no quién la realiza, o cuando querés un tono formal. Si el responsable importa, se agrega **by**.',
  ex:[['The new policy was approved by the management team.','La nueva política fue aprobada por el equipo directivo.']]},
 {k:'table',h:'Activa y pasiva',head:['Activa','Pasiva'],rows:[['We will contact you.','You will be contacted.'],['HR reviews all CVs.','All CVs are reviewed by HR.'],['They paid the salaries on Friday.','The salaries were paid on Friday.']]},
 {k:'table',h:'Participios irregulares frecuentes',head:['Verbo','Participio','Ejemplo'],rows:[['send','sent','The offer was sent.'],['give','given','Feedback is given every month.'],['make','made','The decision was made.'],['write','written','The contract is written in English.'],['hold','held','Interviews are held online.'],['pay','paid','Salaries are paid monthly.'],['take','taken','Notes were taken.']]},
 {k:'note',type:'tip',h:'Pista para traducir',t:'Si en español decís «se + verbo» (se revisan, se publicará), en inglés probablemente necesitás la pasiva.'},
 {k:'wrong',h:'Errores frecuentes',items:[['The CV was send yesterday.','The CV was sent yesterday.','Se usa el participio: send → sent.'],['Candidates are been interviewed.','Candidates are being interviewed.','Para una acción en curso: is / are + being + participio.'],['The job is post on our website.','The job is posted on our website.','Falta el participio (-ed).']]},
 {k:'phr',h:'Frases de avisos',items:[['Applications must be submitted by…','Las postulaciones deben presentarse a más tardar el…'],['You will be notified by email.','Se le notificará por correo.'],['The position has been filled.','El puesto ya fue cubierto.'],['Interviews will be held online.','Las entrevistas se realizarán en línea.']]}
 ],
 check:[
 {q:'«All CVs ___ by the HR team.»',o:['review','are reviewed','are reviewing','reviewed are'],a:1,why:'Presente pasivo: are + participio.'},
 {q:'«The offer ___ yesterday.»',o:['was sent','sent','is send','was send'],a:0,why:'Pasado pasivo: was + participio (sent).'},
 {q:'«Candidates ___ by email next week.»',o:['will contact','will be contacted','are contact','will contacted'],a:1,why:'Futuro pasivo: will be + participio.'},
 {q:'«The position ___ filled.» (ya fue cubierto)',o:['has been','have been','is being been','was being'],a:0,why:'Present Perfect pasivo: has been + participio.'},
 {q:'Pasiva de «HR will publish the results»:',o:['The results will publish by HR.','The results will be published by HR.','The results are publishing by HR.','The results published will be.'],a:1,why:'will be + participio.'},
 {q:'«Interviews ___ online.» (se realizan)',o:['hold','are held','are holding','held are'],a:1,why:'Presente pasivo: are + held.'}
 ]}
];

LESSONS.push(
{id:'l07',n:7,t:'Correos profesionales',en:'Professional emails',lvl:'A2',cat:'Comunicación',
 goal:'Escribir correos claros, con el tono y la estructura que se espera en el trabajo.',
 why:'El correo es la herramienta diaria de RRHH: invitaciones, respuestas, comunicados y ofertas.',
 blocks:[
 {k:'table',h:'Estructura de un correo',head:['Parte','Ejemplo'],rows:[['Asunto','Interview for the HR Assistant position'],['Saludo','Dear Ms. Pérez, / Hello Laura,'],['Motivo','I\'m writing to confirm your interview.'],['Detalle','The interview will take place on Thursday at 10:00 a.m.'],['Pedido','Could you please confirm your availability?'],['Cierre','Looking forward to hearing from you.'],['Firma','Best regards, / Name / HR Department']]},
 {k:'rule',h:'Formal o neutro',t:'Con una persona que no conocés, o en una comunicación oficial, usá **Dear + Mr./Ms. + apellido**. Entre colegas o con un tono cercano alcanza con **Hello + nombre**. Si no sabés quién lee, **Dear Hiring Team** funciona bien. Para cerrar: **Kind regards** o **Best regards**.',
  ex:[['Dear Ms. Pérez,','Estimada Sra. Pérez:'],['Hello Laura,','Hola, Laura:'],['Dear Hiring Team,','Estimado equipo de selección:']]},
 {k:'note',type:'tip',h:'Adjuntos y pedidos',t:'Decí «I\'m attaching my CV» o «Please find my CV attached». No existe «I send you attached».'},
 {k:'note',type:'info',h:'Una idea por párrafo',t:'Los correos breves y ordenados se leen y se responden más rápido. Poné lo que necesitás de la otra persona al principio o al final, de forma bien visible.'},
 {k:'wrong',h:'Errores frecuentes',items:[['I send you attached my CV.','I\'m attaching my CV.','En inglés no se usa «send you attached».'],['Dear Laura Pérez González,','Dear Ms. Pérez,','Se usa título + apellido, no el nombre completo.'],['Regards cordially,','Kind regards,','Cierres habituales: Kind regards, Best regards, Sincerely.'],['I\'m waiting for your answer.','I look forward to hearing from you.','La primera suena impaciente.']]},
 {k:'phr',h:'Frases para armar correos',items:[['I\'m writing to…','Te escribo para…'],['Thank you for your application.','Gracias por tu postulación.'],['Please find attached…','Adjunto…'],['Could you please confirm…?','¿Podrías confirmar…?'],['Looking forward to hearing from you.','Quedo a la espera de tu respuesta.'],['Best regards,','Saludos cordiales,']]}
 ],
 check:[
 {q:'¿Cuál es un buen asunto para una invitación?',o:['Hello','Interview invitation – HR Assistant position','URGENT!!!','Question'],a:1,why:'Es claro, específico y profesional.'},
 {q:'Para adjuntar tu CV:',o:['I send you attached my CV.','I\'m attaching my CV.','I attach you my CV.','Attached send CV.'],a:1,why:'«I\'m attaching…» es la forma natural.'},
 {q:'Saludo adecuado para una persona desconocida:',o:['Hey Laura!','Dear Ms. Pérez,','Yo Laura,','Hi bro,'],a:1,why:'Dear + título + apellido es formal y seguro.'},
 {q:'Un cierre cordial es:',o:['Bye,','Kind regards,','Chau,','Regards cordially,'],a:1,why:'Kind regards es un cierre estándar y amable.'},
 {q:'¿Qué frase abre mejor el motivo?',o:['I\'m writing to confirm your interview.','I write for confirming.','I\'m wanting confirm.','This email is for confirm.'],a:0,why:'«I\'m writing to + verbo» es la apertura típica.'}
 ]},
{id:'l08',n:8,t:'Responder con el método STAR',en:'Behavioral answers',lvl:'B2',cat:'Entrevistas',
 goal:'Contar situaciones reales de forma ordenada y convincente.',
 why:'Las entrevistas por competencias piden ejemplos concretos. STAR los ordena y evita respuestas vagas.',
 blocks:[
 {k:'table',h:'Los cuatro pasos',head:['Letra','Significa','Responde a…','Para arrancar'],rows:[['S','Situation (situación)','¿Cuál era el contexto?','At my previous job, we had…'],['T','Task (tarea)','¿Cuál era tu responsabilidad?','I was responsible for…'],['A','Action (acción)','¿Qué hiciste vos?','I decided to… / I organized…'],['R','Result (resultado)','¿Qué pasó? ¿Qué aprendiste?','As a result,… / I learned that…']]},
 {k:'rule',h:'Ejemplo completo (ilustrativo)',t:'Pregunta: **«Tell me about a time you solved a problem.»**',
  ex:[['S: In my last job, one department had a high absenteeism rate.','S: En mi último trabajo, un sector tenía un ausentismo alto.'],['T: I was asked to find the causes and propose solutions.','T: Me pidieron encontrar las causas y proponer soluciones.'],['A: I interviewed the team, analyzed the data and suggested more flexible schedules.','A: Entrevisté al equipo, analicé los datos y propuse horarios más flexibles.'],['R: As a result, absenteeism decreased within three months.','R: Como resultado, el ausentismo bajó en tres meses.']]},
 {k:'note',type:'tip',h:'Cómo se cuenta',t:'Usá **Past Simple** y hablá en primera persona: «I» muestra tu aporte, «we» sirve para el contexto del equipo. Cerrá con un dato concreto o con un aprendizaje.'},
 {k:'wrong',h:'Errores frecuentes',items:[['We did everything and it was good.','I analyzed the data and proposed a new schedule; absenteeism decreased.','Falta tu acción concreta y un resultado.'],['I am solving the problem by talking.','I solved the problem by talking to each person.','Una historia pasada va en Past Simple.']]},
 {k:'phr',h:'Frases para cada paso',items:[['Let me give you an example.','Te doy un ejemplo.'],['The situation was…','La situación era…'],['My role was to…','Mi rol era…'],['What I did was…','Lo que hice fue…'],['The outcome was…','El resultado fue…'],['I learned that…','Aprendí que…']]}
 ],
 check:[
 {q:'«I was responsible for coordinating the interviews.» corresponde a:',o:['Situation','Task','Action','Result'],a:1,why:'Describe la responsabilidad: Task.'},
 {q:'«As a result, turnover decreased.» corresponde a:',o:['Situation','Task','Action','Result'],a:3,why:'Cuenta lo que pasó: Result.'},
 {q:'«I analyzed the data and met each manager.» corresponde a:',o:['Situation','Task','Action','Result'],a:2,why:'Dice qué hiciste vos: Action.'},
 {q:'«In my last job, the team was growing fast.» corresponde a:',o:['Situation','Task','Action','Result'],a:0,why:'Describe el contexto: Situation.'},
 {q:'¿Qué tiempo verbal predomina en una respuesta STAR?',o:['Present Simple','Past Simple','Future','Present Continuous'],a:1,why:'Contás algo que ya pasó.'},
 {q:'¿Qué mejora más tu respuesta?',o:['Hablar solo del equipo','Incluir tu acción concreta y un resultado','Evitar los datos','Responder en una sola frase'],a:1,why:'Acción y resultado son lo que la persona entrevistadora quiere evaluar.'}
 ]},
{id:'l09',n:9,t:'Dar una devolución con claridad y respeto',en:'Giving feedback',lvl:'B2',cat:'Comunicación',
 goal:'Dar feedback constructivo, basado en hechos, sin generar rechazo.',
 why:'Las devoluciones de desempeño y las conversaciones difíciles son parte central del rol de RRHH.',
 blocks:[
 {k:'rule',h:'Modelo SBI: Situation, Behavior, Impact',t:'Describí **la situación**, **la conducta observable** y **el impacto** que tuvo.',
  ex:[['In yesterday\'s meeting, you interrupted two colleagues several times, and it made it difficult for them to share their ideas.','En la reunión de ayer interrumpiste varias veces a dos compañeros, y eso les dificultó compartir sus ideas.']]},
 {k:'table',h:'Hechos y no juicios',head:['En vez de…','Mejor…'],rows:[['You always miss deadlines.','Last month, two reports were submitted after the deadline.'],['You\'re not a team player.','I noticed you worked alone on the last project; I\'d like to see more collaboration.'],['Your work is bad.','Parts of the report need more detail; let\'s review them together.']]},
 {k:'note',type:'warn',h:'Cuidado con always y never',t:'Generalizan y ponen a la persona a la defensiva. Es mejor citar un hecho puntual.'},
 {k:'wrong',h:'Errores frecuentes',items:[['You should to improve your attitude.','It would help if you could participate more in meetings.','Should no lleva to, y «attitude» es un juicio: describí la conducta.'],['I want to talk with you about your problem.','I\'d like to talk to you about last week\'s report.','«Problem» suena acusatorio; nombrá un tema concreto.']]},
 {k:'phr',h:'Frases útiles',items:[['Do you have a few minutes to talk?','¿Tenés unos minutos para hablar?'],['I\'d like to share some feedback.','Quisiera compartirte una devolución.'],['I really appreciated how you…','Valoré mucho cómo…'],['Going forward, it would help if…','De ahora en adelante, ayudaría que…'],['What I\'d like to see is…','Lo que me gustaría ver es…'],['How do you see the situation?','¿Cómo ves la situación?']]}
 ],
 check:[
 {q:'En SBI, la B corresponde a:',o:['Benefit','Behavior','Boss','Barrier'],a:1,why:'B es Behavior: la conducta observable.'},
 {q:'¿Cuál es feedback basado en hechos?',o:['You\'re lazy.','You were late three times this week.','You never listen.','You have a bad attitude.'],a:1,why:'Describe un hecho que se puede verificar.'},
 {q:'Frase para abrir con respeto:',o:['We need to talk. Now.','Do you have a few minutes to talk?','You\'re in trouble.','Listen to me.'],a:1,why:'Invita a conversar en lugar de imponer.'},
 {q:'¿Cuál evita generalizar?',o:['You always interrupt.','In today\'s meeting, you interrupted twice.','You never let others talk.','You are rude.'],a:1,why:'Cita un hecho puntual.'},
 {q:'«Going forward, it ___ help if you could share updates earlier.»',o:['will','would','is','does'],a:1,why:'Would suaviza la sugerencia.'},
 {q:'En SBI, la I describe:',o:['El impacto de la conducta','La intención de la persona','La identidad','El incentivo'],a:0,why:'I es Impact: el efecto que tuvo.'}
 ]},
{id:'l10',n:10,t:'Avisos de búsqueda laboral',en:'Writing a job post',lvl:'B1',cat:'Comunicación',
 goal:'Redactar un aviso claro, atractivo e inclusivo.',
 why:'El aviso es la primera impresión de la empresa y define a quiénes vas a atraer.',
 blocks:[
 {k:'table',h:'Estructura de un aviso',head:['Sección','Qué incluye','Ejemplo'],rows:[['About us','Quiénes son','We are a growing logistics company based in Rosario.'],['The role','Para qué existe el puesto','We are looking for an HR Assistant to support our recruitment team.'],['Responsibilities','Qué va a hacer','You will post job ads and schedule interviews.'],['Requirements','Qué se necesita','Degree in Labor Relations or similar.'],['Nice to have','Suma, no es excluyente','Experience with HR software.'],['What we offer','Beneficios','Hybrid work and training opportunities.'],['How to apply','Cómo postularse','Send your CV to…']]},
 {k:'rule',h:'Lenguaje típico',t:'**You will + verbo** para tareas; **ability to…, proficiency in…, strong … skills, knowledge of…** para requisitos. Con áreas se usa **experience in**; con herramientas, **experience with**.',
  ex:[['You will be responsible for the onboarding process.','Serás responsable del proceso de inducción.'],['Strong communication and organizational skills.','Excelentes habilidades de comunicación y organización.'],['Experience in recruitment and with HR software.','Experiencia en reclutamiento y con software de RRHH.'],['Fluent English (B2 or higher).','Inglés fluido (B2 o superior).']]},
 {k:'rule',h:'Lenguaje inclusivo y neutral',t:'Describí habilidades y no características personales. Evitá pedir edad, sexo, estado civil o foto. Usá títulos neutros (**salesperson**, **chairperson**) y el **they** singular cuando no sabés el género.',
  ex:[['We are looking for a motivated salesperson.','Buscamos una persona de ventas motivada.'],['Each candidate should bring their CV.','Cada candidato o candidata debe traer su CV.'],['We welcome applications from all backgrounds.','Recibimos postulaciones de todos los perfiles.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['We need a young and dynamic assistant.','We are looking for a motivated assistant.','«Young» (joven) puede ser discriminatorio: describí habilidades.'],['We search a person with experience.','We are looking for a person with experience.','«Buscar a alguien» es look for.'],['Knowledge of English fluently.','Fluent English.','«Fluent» es adjetivo; «fluently», adverbio.']]},
 {k:'phr',h:'Frases útiles',items:[['We are looking for…','Estamos buscando…'],['You will be responsible for…','Serás responsable de…'],['Proven experience in…','Experiencia comprobable en…'],['Equal opportunity employer','Empleador que ofrece igualdad de oportunidades'],['Apply now by sending your CV to…','Postulate enviando tu CV a…']]}
 ],
 check:[
 {q:'¿En qué sección van las tareas del puesto?',o:['Requirements','Responsibilities','What we offer','About us'],a:1,why:'Responsibilities describe lo que la persona va a hacer.'},
 {q:'¿Cuál es más inclusivo?',o:['We need a young salesman.','We are looking for a motivated salesperson.','Candidates must be single.','Only women.'],a:1,why:'Describe habilidades y usa un título neutro.'},
 {q:'«Experience ___ recruitment» (un área)',o:['in','with','at','on'],a:0,why:'Experience in + área.'},
 {q:'Los beneficios van en la sección:',o:['What we offer','Requirements','The role','Nice to have'],a:0,why:'Es lo que ofrece la empresa.'},
