*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-color:var(--bg);
 background-image:radial-gradient(900px 520px at 88% -8%,var(--pg1),transparent 62%),radial-gradient(900px 560px at -8% 8%,var(--pg2),transparent 60%);
 background-attachment:fixed;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--px);letter-spacing:-.02em;text-wrap:balance}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px;border-radius:10px}

/* ===== estructura ===== */
.page{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-bottom:64px}
.topbar{position:sticky;top:0;z-index:40;margin:0 -8px;padding:12px 16px;display:flex;align-items:center;gap:18px;background:var(--bar);
 -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-radius:0 0 22px 22px;
 box-shadow:inset 0 -1px 0 var(--edge),0 18px 34px -24px var(--sh-c)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo{width:38px;height:38px;display:block;flex:none;filter:drop-shadow(0 6px 8px rgba(5,14,6,.3))}
.logo svg{width:100%;height:100%;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.02;font-family:var(--px)}
.brand-t b{font-size:1.18rem;font-weight:800;letter-spacing:-.03em}
.brand-t i{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--hi)}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav-a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.94rem;color:var(--ink-2);white-space:nowrap;flex:none;transition:background .2s,color .2s,box-shadow .2s}
.nav-a:hover{background:var(--accent-soft);color:var(--ink)}
.nav-a.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 20px -8px var(--sh-c)}
.theme-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 1px 0 var(--hl)}
.theme-btn:hover{box-shadow:0 0 0 1.5px var(--bd),0 0 16px -2px var(--glow)}
#main{min-width:0;display:flex;flex-direction:column;gap:22px;outline:none}
#main>*{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
#main>*:nth-child(2){animation-delay:.05s}#main>*:nth-child(3){animation-delay:.1s}#main>*:nth-child(4){animation-delay:.15s}#main>*:nth-child(n+5){animation-delay:.2s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.foot{color:var(--ink-2);font-size:.86rem}

/* ===== tipografía ===== */
.h1{font-weight:800;font-size:clamp(1.7rem,2.4vw + .9rem,2.4rem);line-height:1.12}
.h1.big{font-size:clamp(2rem,3.4vw + .8rem,3.1rem);line-height:1.06;letter-spacing:-.035em;text-shadow:0 10px 24px rgba(30,52,26,.16)}
:root[data-theme="dark"] .h1.big{text-shadow:0 10px 26px rgba(5,14,6,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .h1.big{text-shadow:0 10px 26px rgba(5,14,6,.4)}}
.h1.q-big{font-size:clamp(1.5rem,2vw + .8rem,2.1rem)}
.h2{font-weight:800;font-size:1.3rem}
.sec-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-line .h2::before{content:"";display:inline-block;width:6px;height:.9em;margin-right:10px;border-radius:3px;vertical-align:-.1em;background:linear-gradient(180deg,#F4B684,#E58A4A);box-shadow:0 0 14px rgba(242,83,106,.6)}
.lead{color:var(--ink-2);max-width:64ch;margin-top:8px;text-wrap:pretty}
.kicker{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);margin-bottom:6px}
.label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.muted{color:var(--ink-2);font-size:.95rem}
.p{max-width:68ch}
.es{font-size:1.02rem}
.pre{white-space:pre-wrap}
.lnk{font-weight:700;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-2);font-weight:600;width:max-content}
.back:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.gap{gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2.top{align-items:start}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}

/* ===== tarjetas ===== */
.card{background:linear-gradient(155deg,var(--card-a),var(--card-b));border-radius:22px;padding:22px;min-width:0;position:relative;
 box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c)}
.card.surface{background:var(--surface)}
a.card{text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
a.card:hover,.tile:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bd),0 34px 48px -24px var(--sh-c),0 0 30px -10px var(--glow)}

/* ===== botones, chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;min-height:46px;position:relative;transition:transform .12s,box-shadow .2s,filter .2s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 24px -12px var(--sh-c)}
.btn.cta{background:linear-gradient(180deg,color-mix(in srgb,var(--cta) 82%,#fff),var(--cta));color:var(--cta-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 26px -10px rgba(88,150,60,.75),0 0 26px -4px var(--glow)}
.btn.bad{background:var(--bad);color:var(--bad-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--bd)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.ghost.on{background:var(--accent-soft)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.92rem;border-radius:12px}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.btn.cta:not(:disabled):hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 30px -10px rgba(88,150,60,.85),0 0 38px -2px var(--glow)}
.btn.cta-big{font-size:1.1rem;padding:16px 30px;min-height:58px;border-radius:18px;font-weight:800;animation:breathe 2.4s ease-in-out infinite}
.btn.cta-big:hover{animation-play-state:paused}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.965)}}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--ink);cursor:pointer;flex:none;box-shadow:inset 0 1px 0 var(--hl)}
.icon-btn:hover{box-shadow:0 0 0 1.5px var(--bd),0 0 14px -2px var(--glow)}
.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:0;border-radius:999px;padding:8px 15px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:.92rem;cursor:pointer;min-height:38px;box-shadow:0 0 0 1.5px var(--edge),0 6px 12px -10px var(--sh-c);transition:box-shadow .2s,transform .12s}
.chip:hover{color:var(--ink);box-shadow:0 0 0 1.5px var(--bd),0 8px 14px -8px var(--sh-c)}
.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 20px -8px var(--sh-c)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 1px 0 var(--hl)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.unread{background:#F4B684;color:#4A0716;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 8px 18px -4px rgba(88,150,60,.7),0 0 18px rgba(255,120,140,.55)}
.pill.read{background:#5DDB9E;color:#073D26;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 8px 18px -4px rgba(40,190,120,.7),0 0 18px rgba(90,230,160,.55)}
.pill.read::before{content:"✓";width:auto;height:auto;background:none;font-size:.8rem}
.lvl{display:inline-grid;place-items:center;min-width:36px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;background:linear-gradient(180deg,#4A5E98,#3B4F86);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(59,79,134,.8);flex:none}
.lv-B1{background:linear-gradient(180deg,#5E78AE,#4D6A9C)}
.lv-B2{background:linear-gradient(180deg,#C8643B,#A8461A);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(88,150,60,.8)}

/* ===== notas ===== */
.note{display:flex;flex-direction:column;gap:3px;padding:15px 18px;border-radius:18px;background:var(--info-soft);font-size:.96rem;position:relative;box-shadow:inset 0 1px 0 var(--hl),0 12px 22px -18px var(--sh-c)}
.note .n-t{font-family:var(--px);font-size:.94rem;display:flex;align-items:center;gap:8px}
.note .n-t::before{content:"i";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--info);color:var(--surface);font-size:.78rem;font-style:italic;font-weight:800}
.note.tip{background:var(--good-soft)}.note.tip .n-t::before{content:"✓";background:var(--good);color:#06301f;font-style:normal}
.note.warn{background:var(--hi-soft)}.note.warn .n-t::before{content:"!";background:var(--hi);color:#fff;font-style:normal}
.note.bad{background:var(--bad-soft)}.note.bad .n-t::before{content:"!";background:var(--bad);color:var(--bad-ink);font-style:normal}

/* ===== campos ===== */
.inp,.ta{width:100%;background:var(--surface);color:var(--ink);border:0;border-radius:14px;padding:13px 16px;box-shadow:inset 0 0 0 1.5px var(--bd),inset 0 2px 4px var(--sh-s);font-size:1rem}
.inp::placeholder,.ta::placeholder{color:var(--ink-2);opacity:.85}
.ta{resize:vertical;min-height:120px;line-height:1.5}
.inp:focus,.ta:focus{outline:none;box-shadow:inset 0 0 0 2px var(--hi),0 0 18px -4px var(--glow)}
.searchbar{position:relative}
.searchbar .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.searchbar .inp{padding-left:46px}
.src-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;white-space:pre-wrap;box-shadow:inset 0 1px 3px var(--sh-s)}
.mistake{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mistake .you{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mistake .ok{color:var(--good);font-weight:700}
.phl{display:flex;flex-direction:column;gap:12px}
.phl li{padding-bottom:12px;border-bottom:1px solid var(--line)}
.phl li:last-child{border:0;padding:0}
.chk{display:flex;flex-direction:column;gap:10px}
.chk li{display:flex;gap:10px;align-items:flex-start}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--hi);flex:none}
.det summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:4px 0}
.det[open] summary{margin-bottom:8px}

/* ===== inicio ===== */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;padding:34px;border-radius:30px;overflow:hidden;isolation:isolate;
 background:linear-gradient(150deg,var(--hero-a),var(--hero-b));
 box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 40px 70px -36px var(--sh-c),0 8px 18px -10px var(--sh-c)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.hero::before{width:460px;height:460px;left:-170px;top:-200px;background:radial-gradient(circle,var(--hl),transparent 68%);animation:drift 14s ease-in-out infinite alternate}
.hero::after{width:420px;height:420px;right:-130px;bottom:-200px;background:radial-gradient(circle,var(--glow),transparent 70%);animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.hero-main{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.hero-brand{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.hero-brand .logo{width:92px;height:92px;filter:drop-shadow(0 16px 20px rgba(5,14,6,.4)) drop-shadow(0 4px 6px rgba(5,14,6,.3));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.hb-name{font-family:var(--px);font-size:2.7rem;font-weight:800;letter-spacing:-.045em;line-height:1;text-shadow:0 6px 14px rgba(5,14,6,.2)}
.hb-name small{display:block;font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin-top:8px;text-shadow:none}
.hero-vis{display:flex;flex-direction:column;gap:14px;min-width:0}
.bubbles{position:relative;height:150px}
.bubble{position:absolute;max-width:74%;padding:12px 16px;border-radius:18px;font-family:var(--px);font-weight:700;font-size:.95rem;line-height:1.3;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 22px 30px -14px var(--sh-c)}
.bubble small{display:block;font-family:var(--sans);font-weight:500;font-size:.76rem;opacity:.85;margin-top:3px}
.bubble.b1{left:0;top:0;background:linear-gradient(160deg,#4C9A3A,#1F3320);color:#fff;animation:bob 5s ease-in-out infinite}
.bubble.b1::after{content:"";position:absolute;left:24px;bottom:-9px;border:9px solid transparent;border-top-color:#1F3320;border-bottom:0}
.bubble.b2{right:12px;top:70px;background:linear-gradient(160deg,#fff,#E4EDD2);color:#1F3320;animation:bob 6s ease-in-out infinite .8s}
.bubble.b2::after{content:"";position:absolute;right:26px;bottom:-9px;border:9px solid transparent;border-top-color:#E4EDD2;border-bottom:0}
.badge-red{position:absolute;right:0;top:0;transform:rotate(7deg);background:linear-gradient(180deg,#6BB04E,#B5541C);color:#fff;font-family:var(--px);font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:12px;box-shadow:0 12px 20px -8px rgba(88,150,60,.8),0 0 24px rgba(88,150,60,.5);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 12px 20px -8px rgba(88,150,60,.8),0 0 40px rgba(88,150,60,.8)}}
.player{padding:18px 20px;border-radius:22px;background:var(--surface);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 34px 48px -24px var(--sh-c),0 10px 18px -10px var(--sh-c);display:flex;flex-direction:column;gap:10px}
.player .nv{font-family:var(--px);font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.player .nv span{font-family:var(--sans);font-size:.92rem;font-weight:500;color:var(--ink-2);margin-left:8px}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:16px;background:var(--surface-2);text-align:center;box-shadow:inset 0 1px 0 var(--hl),0 8px 14px -12px var(--sh-c)}
.stat b{font-family:var(--px);font-size:1.4rem;line-height:1.1;position:relative}
.stat span{font-size:.76rem;color:var(--ink-2);position:relative}
.stat .ic{width:1.3em;height:1.3em;position:relative;transform-origin:50% 90%}
.stat:nth-child(1) .ic{color:#FF9F1C;animation:flame 1.7s ease-in-out infinite}
.stat:nth-child(2) .ic{color:var(--good);animation:chk 2.4s ease-in-out infinite}
.stat:nth-child(3) .ic{animation:book 3s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 3px rgba(255,170,40,.55))}25%{transform:scale(.94,1.1) rotate(-5deg);filter:drop-shadow(0 0 9px rgba(255,140,20,.95))}60%{transform:scale(1.06,.95) rotate(4deg);filter:drop-shadow(0 0 6px rgba(255,190,60,.7))}}
@keyframes chk{50%{transform:scale(1.14);filter:drop-shadow(0 0 7px currentColor)}}
@keyframes book{50%{transform:translateY(-3px) rotate(-5deg)}}
.stat::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);filter:blur(10px);animation:sweep 9s ease-in-out infinite;pointer-events:none}
.stat:nth-child(2)::after{animation-delay:1.5s}.stat:nth-child(3)::after{animation-delay:3s}
@keyframes sweep{0%,40%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 3px var(--sh-s)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F4B684,var(--cta));box-shadow:0 0 12px var(--glow);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat>.fe{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:24px;font-family:var(--px);font-weight:800;font-size:1.1rem;isolation:isolate;transition:transform .2s}
.feat>.fe:hover{transform:translateY(-3px)}
.feat>.fe .fi{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);flex:none}
.feat>.fe .fi .ic{width:22px;height:22px;animation:bob 3.4s ease-in-out infinite}
.fe-top{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.fe-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.fe-links a{font-family:var(--sans);font-weight:600;font-size:.86rem;text-decoration:none;color:inherit;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:background .2s}
.fe-links a:hover{background:rgba(255,255,255,.34)}
.feat>.fe.f2 .fe-links a{background:rgba(255,255,255,.45)}
.feat>.fe::before{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
.feat>.fe .shine{position:absolute;inset:0 auto 0 0;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.24),transparent);filter:blur(12px);animation:sweep 8s ease-in-out infinite;pointer-events:none;z-index:-1}
.feat>.fe.f1{background:linear-gradient(135deg,#4C9A3A,#1F3320);color:#fff;box-shadow:0 26px 38px -20px rgba(30,52,26,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.feat>.fe.f2{background:linear-gradient(135deg,#D7E3B8,#9DB87A);color:#1F3320;box-shadow:0 26px 38px -20px rgba(150,180,110,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.feat>.fe.f2 .shine{animation-delay:2s}
.feat>.fe.f3{background:linear-gradient(135deg,#6BB04E,#B5541C);color:#fff;box-shadow:0 26px 38px -18px rgba(88,150,60,.7),0 0 30px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.feat>.fe.f3 .shine{animation-delay:4s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.tile{position:relative;flex:0 0 calc((100% - 32px)/3);min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:22px;text-decoration:none;color:inherit;background:linear-gradient(155deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c);transition:transform .2s,box-shadow .2s}
.tile .t-top{display:flex;align-items:center;gap:12px}
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--hi)));box-shadow:inset 0 1px 0 var(--hl),0 10px 16px -8px var(--sh-c)}
.tile-ic .ic{width:22px;height:22px}
.tile .en{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.tile b{font-family:var(--px);font-size:1.12rem;line-height:1.2}
.tile .muted{flex:1}
.banner{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#34385A,#262A47 60%,#3A2A4A);box-shadow:0 34px 50px -28px rgba(20,22,52,.8),inset 0 1px 0 rgba(255,255,255,.14)}
.banner::before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(88,150,60,.5),transparent 70%);z-index:-1;animation:drift 10s ease-in-out infinite alternate}
.banner .kicker{color:#F4B684}
.banner h2{font-size:1.6rem;font-weight:800;margin:2px 0 8px}
.banner p{opacity:.9;max-width:58ch}
.banner .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.banner .btn.ghost:hover{background:rgba(255,255,255,.12)}
.banner .b-ic{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 40px -6px rgba(88,150,60,.5)}
.banner .b-ic .ic{width:46px;height:46px;stroke-width:1.6;animation:bob 3.6s ease-in-out infinite}
.paths-wrap{border-radius:26px;padding:24px;background:linear-gradient(160deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 30px 46px -30px var(--sh-c)}
.paths{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:stretch}
.paths>.path{grid-column:span 2}
.paths>.path:nth-child(4):nth-last-child(2){grid-column:2/4}
.paths>.path:nth-child(5):last-child{grid-column:4/6}
.path{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 22px 34px -24px var(--sh-c)}
.path-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.path-n{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.path-t{font-size:1.18rem;line-height:1.25;min-height:2.6em}
.path-can{flex:1}
.can{display:flex;flex-direction:column;gap:10px}
.can li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:.95rem}
.can .ic{color:var(--good);margin-top:3px}
.path-steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.step{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 14px 7px 8px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:.88rem;box-shadow:inset 0 1px 0 var(--hl)}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem}
.step:hover{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--bd)}
.path-cta{width:100%}
.today{display:flex;flex-direction:column;gap:10px}
.today .label{margin-bottom:0}
.today>.row:last-child{margin-top:auto;padding-top:6px}
.wotd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:2.6em}
.wotd b{font-family:var(--px);font-size:1.45rem;letter-spacing:-.01em;line-height:1.25}
.ex{padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.ex::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:3px;background:linear-gradient(180deg,#F4B684,var(--cta));box-shadow:0 0 10px var(--glow)}
.ex>div:first-child{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex .icon-btn{width:30px;height:30px;border-radius:10px}
.reset-row{justify-content:flex-end}

/* ===== listas ===== */
.qcard{display:flex;flex-direction:column;gap:10px}
.qcard .row.sp{min-height:30px}
.q-en{font-family:var(--px);font-size:1.08rem;line-height:1.35}
.hero-q{display:flex;flex-direction:column;gap:12px}
.g-row{padding:14px 18px}
.g-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.g-main{flex:1 1 220px;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.g-en{font-family:var(--px);font-weight:800;font-size:1.12rem}
.g-es{color:var(--ink-2)}
.g-det{padding-top:12px;margin-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph-card{display:flex;flex-direction:column;gap:8px}

/* ===== teoría ===== */
.lcard{display:flex;flex-direction:column;gap:10px;min-height:250px;background:linear-gradient(150deg,var(--unread-a),var(--unread-b))}
.lcard.is-read{background:linear-gradient(150deg,var(--read-a),var(--read-b))}
.lcard .l-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.lcard .l-meta{display:flex;align-items:center;gap:10px;min-width:0}
.lcard .l-cat{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard h3{font-size:1.22rem;line-height:1.22;margin-top:4px}
.lcard .l-en{color:var(--ink-2);font-size:.95rem}
.lcard .l-goal{font-size:.92rem;color:var(--ink-2);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lcard .l-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.86rem;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.lhero{display:flex;flex-direction:column;gap:12px;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,var(--hero-a),var(--hero-b))}
.lhero::after{content:"";position:absolute;right:-90px;top:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);z-index:-1}
.lhero .l-num{font-family:var(--px);font-weight:800;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--hi)}
.blk{display:flex;flex-direction:column;gap:12px}
.blk h2{font-size:1.18rem}
.exl{display:flex;flex-direction:column;gap:10px}
.exl li{display:flex;flex-direction:column;gap:1px;padding:10px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hl)}
.exl li>div:first-child{display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.exl .icon-btn{width:30px;height:30px;border-radius:10px}
.ctable{overflow-x:auto;border-radius:16px;box-shadow:0 0 0 1px var(--edge)}
.ctable table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:420px}
.ctable th{text-align:left;font-family:var(--px);font-size:.8rem;letter-spacing:.04em;padding:11px 14px;background:var(--surface-2)}
.ctable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.wl{display:flex;flex-direction:column;gap:10px}
.wl li{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.wl .w-bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.wl .w-ok{color:var(--good);font-weight:700}
.wl .w-why{color:var(--ink-2);font-size:.9rem}
.cq{display:flex;flex-direction:column;gap:12px}
.cq-q{font-weight:700}
.l-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== ejercicios ===== */
.q-card{gap:14px}
.q-prompt{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-family:var(--px);font-weight:800;font-size:clamp(1.4rem,2vw + .8rem,1.9rem);line-height:1.25;letter-spacing:-.01em}
.q-prompt.long{font-size:1.2rem;font-weight:700;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:16px;padding:14px 16px;background:var(--surface);cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--bd),0 8px 14px -12px var(--sh-c);min-height:56px;font-weight:600;color:var(--ink);transition:box-shadow .2s,transform .12s}
.opt:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--accent),0 12px 20px -10px var(--sh-c);transform:translateY(-1px)}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:.85rem;flex:none}
.opt.ok{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good),0 0 26px -4px var(--good)}
.opt.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad),0 0 26px -4px var(--glow)}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default}
.opt.sel{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.opt.m{min-height:50px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb{border-radius:18px;display:flex;flex-direction:column;gap:10px}
.fb:empty{display:none}
.fb.good,.fb.bad{padding:16px 18px;animation:enter .3s both}
.fb.good{background:var(--good-soft);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--good),0 0 30px -10px var(--good)}
.fb.bad{background:var(--bad-soft);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bad),0 0 30px -10px var(--glow)}
.fb-t{font-family:var(--px);font-size:1.05rem}
.fb-a{font-weight:800;font-size:1.05rem}
.ord{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:var(--surface-2)}
.ord.ans{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--bd)}
.tok{border:0;border-radius:12px;padding:9px 14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--bd);font-weight:600;cursor:pointer;min-height:42px}
.ord.ans .tok{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tok.gone{opacity:.25}
.tok:disabled{cursor:default}
.stat2{display:flex;flex-direction:column;gap:2px}
.stat2 b{font-family:var(--px);font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat2 span{color:var(--ink-2);font-size:.92rem}
.lvlres{display:flex;flex-direction:column;gap:14px}
.prow{display:flex;flex-direction:column;gap:6px}

/* ===== herramientas ===== */
.tpl{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-radius:16px;padding:12px 14px;background:var(--surface);cursor:pointer;box-shadow:0 0 0 1.5px var(--edge),0 10px 16px -14px var(--sh-c);transition:box-shadow .2s,transform .12s}
.tpl-item b{font-family:var(--px);font-size:.98rem}
.tpl-item span{color:var(--ink-2);font-size:.86rem}
.tpl-item.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink);box-shadow:0 14px 24px -12px var(--sh-c),0 0 22px -6px var(--glow)}
.tpl-item.on span{color:inherit;opacity:.85}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:.78rem;font-weight:700;color:var(--ink-2)}
.mail{white-space:pre-wrap;line-height:1.6;font-size:.98rem}
.tr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dir{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;padding:6px 14px;border-radius:999px;background:var(--accent-soft);box-shadow:inset 0 1px 0 var(--hl)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.92rem;box-shadow:0 14px 28px -10px rgba(0,0,0,.5);animation:enter .25s both}

@media (max-width:980px){
 .hero{grid-template-columns:1fr;padding:26px}
 .feat{grid-template-columns:1fr}
 .tile{flex-basis:calc((100% - 16px)/2)}
 .paths{grid-template-columns:1fr}.paths>.path,.paths>.path:nth-child(4):nth-last-child(2),.paths>.path:nth-child(5):last-child{grid-column:auto}.path-t{min-height:0}
 .tpl{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .banner{grid-template-columns:1fr}.banner .b-ic{display:none}
}
@media (max-width:720px){
 .topbar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
 .nav{order:3;flex:1 1 100%;justify-content:flex-start}
 .brand-t b{font-size:1.05rem}
 .theme-btn{margin-left:auto}
}
@media (max-width:640px){
 .grid2,.grid3,.match,.fields,.tr-grid{grid-template-columns:1fr}
 .tile{flex-basis:100%}
 .hero{padding:22px 18px;border-radius:24px}
 .hero-brand .logo{width:70px;height:70px}.hb-name{font-size:2.1rem}
 .card{padding:18px}
 .bubbles{height:140px}.bubble{font-size:.85rem}
 .filters .chips:first-child,.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 .filters .chips:first-child .chip,.chips.scroll .chip{flex:none}
 .opts.two{grid-template-columns:1fr 1fr}
 .btn.cta-big{width:100%}
 .banner{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== complementos ===== */
.strip{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pager{margin-top:4px}
.feat>.fe .ft{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.feat>.fe .ft small{font-family:var(--sans);font-weight:500;font-size:.82rem;opacity:.85;margin-top:2px}
.lesson{max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lhero .l-num,.lcard .l-num{font-family:var(--px);font-weight:800;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--hi)}
.l-en-big{color:var(--ink-2);font-size:1.1rem;margin-top:-4px}
.lh-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 var(--hl)}
.lh-box p{font-size:.97rem}
.lcard h3{margin-top:2px}
.lessons{align-items:stretch}
.prog-card{display:flex;flex-direction:column;gap:12px}
.nv-big{font-family:var(--px);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.04em;background:linear-gradient(180deg,#F4B684,var(--cta));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 14px var(--glow))}
.tag-r{margin-left:auto;background:var(--hi-soft);color:var(--hi)}
:root[data-theme="dark"] .tag-r{color:#F6D5B8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag-r{color:#F6D5B8}}
.lvlres{gap:14px;display:flex;flex-direction:column}
.l-actions{margin-top:2px}
.opts .opt .k{flex:none}
.tile .t-top .tag{flex:none}
.cq{padding-bottom:14px;border-bottom:1px solid var(--line)}
.cq:last-of-type{border:0;padding-bottom:0}
.lesson .card.blk{gap:12px}
.mail{font-family:var(--sans)}
@media (min-width:981px){.lcard h3{min-height:2.45em}}

/* ===== subnavegación por sección ===== */
.subnav{display:flex;gap:6px;padding:5px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);box-shadow:inset 0 1px 3px var(--sh-s),0 0 0 1px var(--edge)}
.subnav::-webkit-scrollbar{display:none}
.sub-a{padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--ink-2);white-space:nowrap;flex:none;transition:background .2s,color .2s}
.sub-a:hover{color:var(--ink);background:var(--accent-soft)}
.sub-a.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 18px -8px var(--sh-c)}
.chips.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chips.grid .chip{width:100%;text-align:center;justify-content:center;padding:9px 12px}
.sugg{align-items:stretch}
.sugg .today{height:100%}
.today .row.foot{margin-top:auto;padding-top:8px}
.today .wotd{min-height:34px}

/* ===== texto justificado y prolijo ===== */
.lead,.p,.l-goal,.note>span,.lh-box p,.banner p,.path-can li span,.tile .muted,.today>p,.card>p.muted,.phead .lead,.fb>div:not(.row){text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.exl li,.wl li,.ex,.opt span,.q-en,.g-det p,.mail,.src-box{text-align:left;hyphens:manual}
.card .p{max-width:none}
.lead{max-width:72ch}
.l-title{min-height:5.3em;display:flex;flex-direction:column;gap:2px}
.lcard h3{min-height:0}
@media (max-width:980px){.l-title{min-height:0}}
.l-top .l-num{font-family:var(--px);font-weight:800;font-size:.7rem;letter-spacing:.14em;color:var(--hi);white-space:nowrap}
.lcard{min-height:0}
.lcard .l-foot{margin-top:auto}

/* ===== herramientas: archivos y fechas ===== */
.note{text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.file-inp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.step-t{display:flex;align-items:center;gap:10px;font-family:var(--px);font-weight:800;font-size:1.05rem}
.step-t b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);font-size:.85rem;box-shadow:0 8px 14px -8px var(--sh-c)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:22px 16px;border-radius:18px;cursor:pointer;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--bd);transition:box-shadow .2s,transform .2s}
.drop:hover,.drop.over{box-shadow:inset 0 0 0 2px var(--hi),0 0 24px -6px var(--glow);transform:translateY(-2px)}
.drop .ic{width:28px;height:28px}
.drop .muted{max-width:34ch;text-align:center}
.docview{max-height:520px;overflow:auto;padding:16px 18px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 2px 6px var(--sh-s);display:flex;flex-direction:column;gap:10px}
.docview p,.docview .dv-li{margin:0;text-align:left;overflow-wrap:break-word;white-space:pre-line}
.docview h3{margin:8px 0 0;font-family:var(--px);font-size:1.02rem}
.docview .dv-li{padding-left:14px;text-indent:-14px}
.dl{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--edge)}
.f-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.f-l .label{margin:0}
.f-v{font-size:1.02rem;overflow-wrap:anywhere}
.fd .card{align-content:start}
.fd .inp{max-width:100%}
@media (max-width:980px){.file-grid{grid-template-columns:1fr}}

/* ===== color por nivel ===== */
:root{--lcA-b:#CFE6BC;--lcA-s:#2A6A27;--lcB-b:#BFE3D6;--lcB-s:#1D6A58;--lcC-b:#EBE4A9;--lcC-s:#6B5E0E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lcA-b:rgba(120,200,90,.40);--lcA-s:#D7F3C6;--lcB-b:rgba(60,170,140,.42);--lcB-s:#C9F1E4;--lcC-b:rgba(220,200,90,.34);--lcC-s:#FBF3B9}}
:root[data-theme="dark"]{--lcA-b:rgba(120,200,90,.40);--lcA-s:#D7F3C6;--lcB-b:rgba(60,170,140,.42);--lcB-s:#C9F1E4;--lcC-b:rgba(220,200,90,.34);--lcC-s:#FBF3B9}
.lcard.lc-A2{background:linear-gradient(150deg,var(--unread-a),var(--lcA-b));--lc-s:var(--lcA-s)}
.lcard.lc-B1{background:linear-gradient(150deg,var(--unread-a),var(--lcB-b));--lc-s:var(--lcB-s)}
.lcard.lc-B2{background:linear-gradient(150deg,var(--unread-a),var(--lcC-b));--lc-s:var(--lcC-s)}
.lcard .l-num{color:var(--lc-s,var(--hi))}
.lcard .l-foot{border-top-color:color-mix(in srgb,var(--lc-s,var(--line)) 40%,transparent)}
.lv-A2{background:linear-gradient(180deg,#4C9DE2,#2A74BC);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(42,116,188,.8)}
.lv-B1{background:linear-gradient(180deg,#6A58C8,#5A4A22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(75,60,163,.8)}
.lv-B2{background:linear-gradient(180deg,#3A3D5C,#23253A);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 12px -6px rgba(35,37,58,.8)}

/* ===== salir de la práctica y filtros por nivel ===== */
.tag.tag-q{height:38px;padding:0 16px;font-size:.84rem}
.btn.exit-x{height:38px;min-height:38px;padding:0 16px 0 12px;gap:6px;border-radius:999px}
.btn.exit-x .ic{width:16px;height:16px}
.chip.lcf-A2{--lc-s:var(--lcA-s);--lc-b:var(--lcA-b)}
.chip.lcf-B1{--lc-s:var(--lcB-s);--lc-b:var(--lcB-b)}
.chip.lcf-B2{--lc-s:var(--lcC-s);--lc-b:var(--lcC-b)}
.chip[class*="lcf-"]{background:linear-gradient(150deg,var(--surface),var(--lc-b));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lc-s) 55%,transparent)}
.chip[class*="lcf-"]:hover{box-shadow:inset 0 0 0 2px var(--lc-s)}
.chip[class*="lcf-"].on{background:var(--lc-s);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 18px -10px var(--lc-s)}

/* ===== práctica: textos centrados ===== */
.cfg-page .phead{justify-content:center;text-align:center}
.cfg-page .phead>div{display:flex;flex-direction:column;align-items:center;margin-inline:auto}
.cfg-page .phead .lead{text-align:center;margin-inline:auto;max-width:62ch}
.card.cfg{max-width:900px;width:100%;margin-inline:auto;text-align:center;align-items:center}
.card.cfg>div,.card.cfg>p{width:100%}
.card.cfg .chips,.card.cfg .row{justify-content:center}
.card.cfg>p.muted{text-align:center}
.card.cfg .label{text-align:center}
.btn.pri:disabled{box-shadow:none}
.cfg-page .phead{margin-bottom:26px}
.cfg-page .phead .lead{hyphens:manual;-webkit-hyphens:manual}

/* ===== panel de apartados: centrado y destacado ===== */
.subnav{margin:6px auto 22px;justify-content:center;padding:6px;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 0 0 1.5px var(--bd),0 16px 30px -16px var(--sh-c),0 0 0 4px var(--accent-soft)}
.sub-a{padding:11px 22px;font-size:.96rem}

@media (max-width:700px){.subnav{justify-content:flex-start;margin-inline:0}}

/* ===== paneles de filtros ordenados ===== */
.fpanel{display:flex;flex-direction:column;gap:16px;padding:18px 20px}

.fpanel .fhead .searchbar{flex:1;min-width:0}

.fgroup{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 14px;align-items:start}

@media (max-width:760px){.fgroup{grid-template-columns:1fr}.fgroup>.label{padding-top:0}.fpanel .chips.grid,.fpanel .chips.grid.lv{grid-template-columns:repeat(2,minmax(0,1fr))}.fpanel .fhead{flex-wrap:wrap}}

.fpanel .chips.grid.lv{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:1300px){.fpanel .chips.grid:not(.lv){grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:760px){.fpanel .chips.grid,.fpanel .chips.grid.lv{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== botón de Claude: colores de Claude en degradado y sombreado ===== */
:root{--cl1:#E59A6E;--cl2:#D2724F;--cl3:#B5532F;--cl-sh:rgba(181,83,47,.55)}
.btn.claude{color:#fff;background:linear-gradient(140deg,var(--cl1) 0%,var(--cl2) 48%,var(--cl3) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -3px 8px rgba(110,36,14,.38),0 14px 26px -10px var(--cl-sh),0 3px 8px rgba(110,36,14,.28);
 text-shadow:0 1px 1px rgba(100,30,10,.4)}
.btn.claude:hover:not(:disabled){filter:brightness(1.07) saturate(1.05);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(110,36,14,.38),0 18px 30px -10px var(--cl-sh),0 4px 10px rgba(110,36,14,.3)}
.btn.claude:disabled{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn.claude .ic{filter:drop-shadow(0 1px 1px rgba(100,30,10,.4))}

/* ===== tarjetas del mismo tamaño y alineadas ===== */
.grid2,.grid3,.grid2.top{align-items:stretch}
.grid2>.card,.grid3>.card,.grid2>section,.grid3>section,.tr-grid>.card,.tpl .card{height:100%}
.grid2>.card.stack,.grid3>.card.stack{align-content:start}
.tr-grid{align-items:stretch}

/* ===== herramientas ===== */
.tools-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:22px}
.tool-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:210px;padding:20px;border-radius:22px;position:relative;
 background:linear-gradient(155deg,var(--card-a),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--edge),0 1px 2px var(--sh-s),0 26px 40px -26px var(--sh-c);transition:transform .2s,box-shadow .2s}
.tool-card:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--bd),0 34px 48px -24px var(--sh-c)}
.tool-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tool-card.on{box-shadow:inset 0 1px 0 var(--hl),0 0 0 2px var(--accent),0 30px 46px -24px var(--sh-c)}
.tc-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,var(--surface-2),var(--card-b));color:var(--accent);box-shadow:inset 0 1px 0 var(--hl),0 8px 16px -10px var(--sh-c);flex:none}
.tc-ic.sm{width:38px;height:38px;border-radius:12px}
.tc-ic .ic{width:22px;height:22px}
.tc-t{font-family:var(--font-h,inherit);font-size:1.08rem;line-height:1.25}
.tc-d{font-size:.9rem;color:var(--ink-2);line-height:1.45;flex:1}
.tc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tc-tag{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tc-tag.ai{background:linear-gradient(140deg,var(--cl1),var(--cl3));color:#fff;text-shadow:0 1px 1px rgba(100,30,10,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tc-chev{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);transition:transform .25s}
.tc-chev .ic{width:15px;height:15px;transform:rotate(90deg)}
.tool-card.on .tc-chev{transform:rotate(180deg);background:var(--accent);color:var(--accent-ink)}
.tool-host:empty{display:none}
.tool-panel{animation:toolIn .28s ease both;scroll-margin-top:90px}
@keyframes toolIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tool-body{display:flex;flex-direction:column;gap:18px;min-width:0}
.tool-body .phead{display:none}
.tool-setwrap{background:var(--surface-2);border-radius:18px;padding:16px;box-shadow:inset 0 1px 3px var(--sh-s)}
.tool-set{display:flex;flex-direction:column;gap:16px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;align-items:start}
.set-item{display:flex;flex-direction:column;gap:8px;min-width:0}
.switch{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem}
.switch i{width:44px;height:26px;border-radius:999px;background:var(--surface);box-shadow:inset 0 1px 3px var(--sh-s),0 0 0 1px var(--edge);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch.on i{background:var(--accent)}
.switch.on i::after{transform:translateX(18px);background:var(--accent-ink)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.btn.ghost.on{box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:1100px){.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.set-grid{grid-template-columns:1fr}.tool-card{min-height:190px;padding:16px}}
@media (max-width:420px){.tools-grid{grid-template-columns:1fr}}

/* ===== traductor en vivo / corrector en vivo ===== */
.live{display:inline-flex;align-items:center;gap:8px;font-size:.84rem}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--cl2);animation:pulse 1s ease-in-out infinite}
.live .dot.ok{background:var(--good);animation:none}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.tr-out{min-height:230px;white-space:pre-wrap}
.tr-in{min-height:230px}
.mtype{margin-bottom:4px;align-self:flex-start}
mark.wrong{background:color-mix(in srgb,var(--bad) 22%,transparent);color:inherit;border-radius:5px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--bad)}
mark.wrong.sp{background:color-mix(in srgb,var(--bad) 30%,transparent);text-decoration:wavy underline var(--bad)}
.src-box.marked{line-height:1.7}

/* ===== entrevista conversacional ===== */
.chat{gap:14px}
.cbub{max-width:min(640px,92%);padding:12px 16px;border-radius:18px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 1px 0 var(--hl),0 8px 18px -12px var(--sh-c)}
.cbub.iv{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.cbub.me{align-self:flex-end;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);border-bottom-right-radius:6px}
.cbub .who{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.cbub p{margin:0}.b-re{opacity:.9}.b-q{font-weight:700}
.typing::after{content:"…";animation:pulse 1s infinite}
.bl{margin:6px 0 0;padding-left:20px}

/* ===== ejercicios con imágenes, flechas y voz ===== */
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt.pic{flex-direction:column;justify-content:center;gap:6px;min-height:132px;text-align:center}
.pic-e{font-size:3.2rem;line-height:1}
.opt .cap{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.pic-big{font-size:6rem;line-height:1.1;text-align:center;padding:14px 0;filter:drop-shadow(0 10px 14px var(--sh-c))}
.match.arrows{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(56px,14vw,150px);row-gap:0;touch-action:pan-y}
.match.arrows .opt{position:relative;z-index:2;touch-action:none;user-select:none}
.match.arrows .opt.pic-l{min-height:84px;justify-content:center}
.match.arrows .opt.pic-l .pic-e{font-size:2.4rem}
.m-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.ml{fill:none;stroke-width:3.2;stroke-linecap:round}
.ml.ok{stroke:var(--good)}.ml.bad{stroke:var(--bad)}.ml.tmp{stroke:var(--accent);stroke-dasharray:6 6}
.ah.ok{fill:var(--good)}.ah.bad{fill:var(--bad)}.ah.tmp{fill:var(--accent)}
.say-box{min-height:64px;font-size:1.1rem}
.btn.mic.rec{animation:micPulse 1.2s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 10px rgba(210,114,79,.25),0 14px 26px -10px var(--cl-sh)}}
.tool-panel .tool-body>.card:only-child{background:none;box-shadow:none;padding:0}
@media (max-width:420px){.pic-e{font-size:2.6rem}.pic-big{font-size:4.8rem}}

.match.arrows.pics .opt{min-height:84px}
.match.arrows .stack{gap:10px}

/* botones de la portada: mismo tamaño y alineados */
.hero-main>.row{align-items:center}
.btn.ghost.cta-big{animation:none;font-weight:700}
.hero-main>.row{display:grid;grid-template-columns:repeat(2,minmax(0,250px));gap:14px;justify-content:start}
.hero-main>.row .btn.cta-big{width:100%;height:58px;min-height:58px;padding:0 20px;white-space:nowrap}
@media (max-width:700px){.hero-main>.row{grid-template-columns:1fr}}
.hero-main>.row .btn.cta-big{animation:none}

/* ===== brillitos donde dice Claude ===== */
.btn.claude::before,.btn.claude::after,.tc-tag.ai::before,.tc-tag.ai::after{position:absolute;pointer-events:none;color:#fff;text-shadow:0 0 6px rgba(255,236,214,.95),0 0 12px rgba(255,200,160,.8);animation:twinkle 2.6s ease-in-out infinite}
.btn.claude::before{content:"✦";top:-7px;right:14px;font-size:15px}
.btn.claude::after{content:"✧";bottom:-6px;left:18px;font-size:12px;animation-delay:1.1s}
.tc-tag.ai{position:relative}
.tc-tag.ai::before{content:"✦";top:-7px;right:-4px;font-size:12px}
.tc-tag.ai::after{content:"✧";bottom:-6px;left:6px;font-size:9px;animation-delay:1.2s}
.btn.claude .ic{animation:twinkleIc 2.6s ease-in-out infinite}
.btn.claude{overflow:visible;background-size:200% 100%}
.btn.claude:not(:disabled):hover::before{animation-duration:1s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@keyframes twinkleIc{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(14deg)}}
.live .spk,.claude-txt{position:relative}
@media (prefers-reduced-motion:reduce){.btn.claude::before,.btn.claude::after,.tc-tag.ai::before,.tc-tag.ai::after,.btn.claude .ic{animation:none;opacity:.9}}

/* traductor: cuadros alineados y del mismo tamaño */
.tr-grid>.card>.row.sp:first-child{min-height:40px;align-items:center}
.tr-in,.tr-out{box-sizing:border-box;height:260px;min-height:260px;max-height:260px;margin:0}
.tr-out{overflow:auto}
.tr-grid>.card{align-content:start}

/* textos de encabezado: ocupan todo el ancho */
.phead>div:first-child{flex:1 1 300px;min-width:0}
.phead .lead{max-width:none;width:100%}
.cfg-page .phead>div{flex:0 1 auto}
.cfg-page .phead .lead{max-width:62ch}

/* revisión clara y concisa: lista de correcciones */
.rv{gap:14px}
.rv-sum{margin:0}
.fixlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:fx}
.fixlist li{counter-increment:fx;position:relative;background:var(--surface-2);border-radius:14px;padding:10px 14px 10px 44px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 1px 0 var(--hl)}
.fixlist li::before{content:counter(fx);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;background:var(--surface);color:var(--ink-2);box-shadow:0 0 0 1px var(--edge)}
.fx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1rem}
.fx-row .you{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:600}
.fx-row .ok{color:var(--good);font-weight:800}
.fx-row .mtype{margin:0}
.fx-arrow{color:var(--ink-2)}
.fx-why{font-size:.88rem;color:var(--ink-2)}
.rv-tip{margin:0;font-size:.9rem}
.mail-ed{min-height:160px;resize:vertical;white-space:pre-wrap;line-height:1.6;font-size:.98rem;overflow:hidden}

/* parlantes: mismo tamaño y pegados al texto que reproducen */
.fb .icon-btn,.ex .icon-btn,.exl .icon-btn,.wotd .icon-btn{width:32px;height:32px;border-radius:10px}
.ex>div:first-child,.exl li>div:first-child{justify-content:flex-start;align-items:center;flex-wrap:wrap;column-gap:10px}
.ex>div:first-child .icon-btn,.exl li>div:first-child .icon-btn{margin-left:2px}
.fb .icon-btn,.ex .icon-btn,.exl .icon-btn{vertical-align:middle;margin-left:4px}.ex>div:first-child .icon-btn,.exl li>div:first-child .icon-btn{margin-left:2px}

/* botones de situación: la última fila queda centrada */
.chips.grid.ctr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips.grid.ctr .chip{width:auto;flex:0 0 100%}
@media(min-width:460px){.chips.grid.ctr .chip{flex-basis:calc((100% - 8px)/2)}}
@media(min-width:700px){.chips.grid.ctr .chip{flex-basis:calc((100% - 16px)/3)}}
@media(min-width:960px){.chips.grid.ctr .chip{flex-basis:calc((100% - 24px)/4)}}
@media(min-width:1200px){.chips.grid.ctr .chip{flex-basis:calc((100% - 32px)/5)}}
.chips.grid.ctr{align-items:stretch}.chips.grid.ctr .chip{min-height:52px;display:flex;align-items:center;justify-content:center}
.hero::after{display:none}

/* pasos de las rutas: botones iguales y alineados */
.path-steps{display:grid;grid-template-columns:1fr;gap:8px;justify-content:stretch}
.path-steps .step{width:100%;justify-content:center;min-height:44px;padding:8px 14px}
@media(min-width:620px){.path-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* herramientas: el panel se abre justo debajo de la tarjeta tocada */
.tools-grid>.tool-host{grid-column:1/-1;min-width:0}
.tool-card{scroll-margin-top:130px}
@media(min-width:760px){.tool-card{scroll-margin-top:96px}}

/* menú superior en celular: las 4 secciones entran completas, iguales y alineadas */
@media(max-width:640px){
 .topbar{flex-wrap:wrap}
 .nav{flex:1 1 100%;order:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;overflow:visible;justify-content:stretch}
 .nav-a{flex-direction:column;justify-content:center;gap:3px;padding:8px 2px;font-size:.76rem;border-radius:16px;text-align:center}
 .nav-a .ic{width:18px;height:18px}
}
@media(max-width:619px){
 .path-steps .step{justify-content:flex-start;padding-left:16px}
 .reset-row{justify-content:center;text-align:center}
}

/* palabra que se está leyendo: solo se agranda, en sincronía con el audio */
.kw.on{display:inline-block;position:relative;z-index:3;transform:scale(1.32);transform-origin:50% 70%;animation:kwpop .16s ease-out}
@keyframes kwpop{from{transform:scale(1)}to{transform:scale(1.32)}}
@media (prefers-reduced-motion:reduce){.kw.on{animation:none}}

/* niveles C1 y C2 */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lcD-b:rgba(230,140,70,.38);--lcD-s:#FFE0C6;--lcE-b:rgba(150,100,60,.50);--lcE-s:#FFEBD6}}

.lcard.lc-C1{background:linear-gradient(150deg,var(--unread-a),var(--lcD-b));--lc-s:var(--lcD-s)}
.lcard.lc-C2{background:linear-gradient(150deg,var(--unread-a),var(--lcE-b));--lc-s:var(--lcE-s)}
.lv-C1{background:linear-gradient(180deg,#C8643B,#8F3F17);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(179,18,45,.8)}
.lv-C2{background:linear-gradient(180deg,#7A1A38,#4A0B1F);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 12px -6px rgba(74,11,31,.8)}

/* Fechas y números: el resultado principal se destaca y el resto queda más sobrio */

.frow.hero .f-v{font-family:var(--px);font-size:1.45rem;line-height:1.2;font-weight:800;letter-spacing:-.01em}

.frow:not(.hero) .f-v{font-size:.98rem;font-weight:600}
.frow:not(.hero) .label{opacity:.8}
.tool-panel .note b:not(.n-t){font-weight:800;color:var(--ink)}
.frow.hero::before,.frow.hero::after{display:none}

/* ===== Bolillero de inglés ===== */
.bc-esc{--bc:#3C7C8F;--bc2:#27576A}.bc-hab{--bc:#C8643B;--bc2:#8F3F17}.bc-wri{--bc:#5E7F34;--bc2:#1F3320}.bc-lee{--bc:#7E6A3C;--bc2:#5A4A22}.bc-ent{--bc:#3FA37C;--bc2:#237557}.bc-est{--bc:#D9993A;--bc2:#A9701A}
.bol-top{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:center}
.bol-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.bol-drum{position:relative;width:min(260px,100%);aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--surface) 92%,#fff),var(--surface-2) 62%);box-shadow:inset 0 2px 0 var(--hl),inset 0 -14px 28px -16px var(--sh-c),0 0 0 3px var(--edge),0 26px 40px -24px var(--sh-c)}
.bol-drum::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.55),transparent 34%);pointer-events:none}
.bol-mini{position:absolute;left:var(--x);top:var(--y);width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--bc) 55%,#fff),var(--bc) 46%,var(--bc2));box-shadow:0 6px 8px -4px rgba(0,0,0,.4);animation:bolfloat var(--d) ease-in-out var(--l) infinite alternate}
.bol-drum.spin .bol-mini{animation:bolspin .5s linear var(--l) infinite}
.bol-drum.spin{animation:bolshake .18s linear infinite}
.bol-drum.still .bol-mini,.bol-drum.still{animation:none}
@keyframes bolfloat{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}

.strip.alert{position:relative;overflow:hidden;isolation:isolate;gap:18px;flex-wrap:nowrap;padding:18px 22px;background:linear-gradient(120deg,var(--hi-soft),var(--card-b));box-shadow:inset 0 1px 0 var(--hl),0 0 0 2px var(--hi),0 0 34px -4px rgba(88,150,60,.5),0 22px 34px -22px rgba(88,150,60,.7);animation:alertGlow 2.8s ease-in-out infinite}

.tool-card.feat .tc-ic{background:linear-gradient(160deg,#F4B684,#D9702F);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px -8px rgba(88,150,60,.7)}

.sugg .today .wotd{min-height:34px;flex-wrap:nowrap}

.sc-chip.mid{background:color-mix(in srgb,#E09F1F 20%,var(--surface-2));color:var(--ink)}
.sc-chip.low{background:color-mix(in srgb,var(--cta) 16%,var(--surface-2));color:var(--cta)}

.fb-sc{gap:10px}
.rv .src-box+.row{margin-top:12px}

 .subnav{width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:5px;overflow:visible;border-radius:22px;margin-inline:0}
 .sub-a{padding:10px 6px;font-size:.84rem;white-space:normal;text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center;border-radius:17px}
}

 .lcard .l-cat,.lcard .l-num,.lhero .l-num,.l-top .l-num{font-size:.75rem}
}

 /* en columnas angostas el texto justificado deja huecos y corta palabras: se alinea a la izquierda */
 .lead,.p,.l-goal,.note,.note>span,.lh-box p,.banner p,.path-can li span,.tile .muted,.today>p,.card>p.muted,.phead .lead,.fb>div:not(.row){text-align:left;hyphens:manual;-webkit-hyphens:manual}

/* =====================================================================
   Diseño «Bosque»: portada con paisaje, barra flotante, secciones suaves
   ===================================================================== */
.topbar{top:10px;margin:10px 0 0;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--edge),0 16px 34px -20px var(--sh-c)}
.topbar::before{display:none}
/*kp*/.kicker.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--forest-2);letter-spacing:.12em;margin:0;box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}

.kicker.pill svg{width:16px;height:16px}

.band{background:var(--mint);border-radius:34px;padding:34px 28px 30px;gap:20px}

.band .sec-line>.row{justify-content:center}

.sg-art{height:128px;margin:0 0 6px;overflow:hidden;border-radius:26px 26px 0 0;flex:none}
.sg-art svg{display:block;width:100%;height:100%}
.band .today>.label{margin-top:8px}
.band .btn.pri{border-radius:999px}
.btn.pri,.btn.cta,.btn.ghost,.btn.ghost-w{border-radius:999px}
.card{border-radius:26px}

.panel,.routes,.rcard,.route{border-radius:28px}

.lvl{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}

.lv-B2{background:linear-gradient(180deg,#B39A1E,#7C6A0C);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px -6px rgba(124,106,12,.8)}

   Diseño «Aguacate»: verde profundo, mostaza y paneles planos
   ===================================================================== */
body{background-color:var(--bg);background-image:radial-gradient(900px 560px at 50% 14%,var(--pg1),transparent 62%),radial-gradient(800px 520px at 100% 60%,var(--pg2),transparent 60%)}

.h1,.h2,.av-h1,.ai-t,.player .nv,.phead .h1,.l-t{font-family:var(--serif);font-weight:400;letter-spacing:0}

.ai-left .note .n-t{color:#1F3D32}

.tile-ic,.tc-ic,.tc-ic.sm,.icon-btn{border-radius:var(--r);background:var(--accent-soft);box-shadow:none}

/* títulos serif en tarjetas */
.lcard h3,.path-t,.tc-t,.tile b,.al-txt b,.l-t,.nv-big,.banner h2,.phead .h1,.lhero .h1,.lhero h1,.sec-line .h2,.card h2,.card h3{font-family:var(--serif);font-weight:400;letter-spacing:0}

.tc-tag.ai{background:var(--cl2);box-shadow:none;text-shadow:none}
.chip,.tag,.pill,.tc-tag{border-radius:4px}

.inp:focus,.ta:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.bar,.bar i{border-radius:3px;box-shadow:none}.bar i{background:var(--mustard)}

.step{border-radius:var(--r);box-shadow:none;background:var(--surface-2)}.step b{border-radius:4px}

.subnav{border-radius:var(--r);background:var(--bar);box-shadow:none;padding:0 6px;gap:2px}

.banner{background:var(--deep);box-shadow:0 22px 40px -28px var(--sh-c)}

.paths-wrap{background:var(--bar);box-shadow:0 26px 48px -30px var(--sh-c);color:#fff}
