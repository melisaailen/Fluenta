{id:'l11',n:11,t:'Hablar de métricas de RRHH',en:'Talking about numbers and trends',lvl:'B2',cat:'Vocabulario',
 goal:'Presentar indicadores, cambios y tendencias con precisión.',
 why:'Reportar rotación, ausentismo o tiempos de cobertura es parte del trabajo de análisis de RRHH.',
 blocks:[
 {k:'table',h:'Indicadores frecuentes',head:['Término','Significa','Ejemplo'],rows:[['headcount','dotación (cantidad de personas)','Our headcount is 240.'],['turnover rate','rotación de personal','Turnover fell to 9%.'],['absenteeism rate','ausentismo','Absenteeism rose slightly.'],['time to fill','tiempo que lleva cubrir una vacante','Time to fill is 35 days on average.'],['cost per hire','costo por contratación','Cost per hire decreased this quarter.'],['retention rate','tasa de retención','Retention rate improved.'],['engagement score','nivel de compromiso','The engagement score is 78.']]},
 {k:'rule',h:'Verbos de cambio y preposiciones',t:'**increase / rise / grow** (subir), **decrease / fall / drop** (bajar), **remain stable** (mantenerse). Con **by** decís cuánto cambió, con **to** el valor final y con **from… to…** de dónde a dónde.',
  ex:[['Turnover increased by 3 points.','La rotación aumentó 3 puntos.'],['Turnover rose from 8% to 11%.','La rotación subió del 8% al 11%.'],['Absenteeism remained stable at 4%.','El ausentismo se mantuvo estable en 4%.'],['Time to fill decreased by 20%.','El tiempo de cobertura bajó un 20%.']]},
 {k:'note',type:'info',h:'Cómo se escriben los números',t:'En inglés la **coma** separa los miles y el **punto** los decimales, al revés que en Argentina: 1,200 (mil doscientos) y 2.5 (dos coma cinco). 8% se lee «eight percent».'},
 {k:'rule',h:'Aproximar',t:'**around, about, approximately, nearly, almost, just over**',ex:[['We have approximately 300 employees.','Tenemos aproximadamente 300 empleados.'],['Turnover is just over 10%.','La rotación está un poco por encima del 10%.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['Turnover increased in 3%.','Turnover increased by 3%.','El cambio se expresa con by.'],['The rate fell of 12% to 9%.','The rate fell from 12% to 9%.','Se usa from… to….'],['We have 1.200 employees.','We have 1,200 employees.','En inglés la coma separa los miles.']]},
 {k:'phr',h:'Frases útiles',items:[['Compared to last year,…','En comparación con el año pasado,…'],['On average,…','En promedio,…'],['This represents an increase of…','Esto representa un aumento de…'],['The main driver was…','El principal factor fue…']]}
 ],
 check:[
 {q:'«Turnover ___ from 8% to 11%.»',o:['rose','raised','rised','arose'],a:0,why:'Rose (de rise) no lleva objeto; raised sí.'},
 {q:'«Absenteeism decreased ___ 2 points.»',o:['by','in','of','for'],a:0,why:'Con by indicás cuánto cambió.'},
 {q:'¿Cómo se escribe 1.200 empleados en inglés?',o:['1.200','1,200','1 200,0','1\'200'],a:1,why:'En inglés la coma separa los miles.'},
 {q:'«Headcount» es:',o:['Costo','Dotación','Rotación','Ausentismo'],a:1,why:'Es la cantidad de personas de la organización.'},
 {q:'«Remained stable at 4%» significa:',o:['Subió a 4%','Se mantuvo en 4%','Bajó a 4%','Llegó al máximo'],a:1,why:'Remain stable es «mantenerse».'},
 {q:'«Time to fill» mide:',o:['El costo por hora','El tiempo que lleva cubrir una vacante','La duración de la jornada','La edad promedio'],a:1,why:'Es un indicador de reclutamiento.'}
 ]},
{id:'l12',n:12,t:'Falsos amigos y errores típicos',en:'False friends and common mistakes',lvl:'B1',cat:'Vocabulario',
 goal:'Evitar los errores que más se repiten al hablar de trabajo en inglés.',
 why:'Estas confusiones aparecen en CV, correos y entrevistas, y suelen notarse enseguida.',
 blocks:[
 {k:'table',h:'Falsos amigos del mundo laboral',head:['Se parece a…','Pero significa','Para decir lo que querés'],rows:[['actually','en realidad','currently / at the moment (actualmente)'],['career','trayectoria profesional','degree (carrera universitaria)'],['to assist','ayudar','to attend (asistir a)'],['application','postulación o solicitud','app (aplicación del celular)'],['to resume','retomar o reanudar','résumé / CV (currículum)'],['compromise','acuerdo con concesiones','commitment (compromiso)'],['sensible','sensato, razonable','sensitive (delicado, sensible)'],['to realize','darse cuenta','to carry out (realizar)'],['eventually','al final, con el tiempo','possibly / occasionally (eventualmente)']]},
 {k:'rule',h:'Palabras incontables',t:'**information, advice, feedback, work, news, equipment** no llevan «a/an» ni plural. Se dice «some information», «a piece of advice». En cambio, **job** (puesto) sí es contable.',
  ex:[['Can you give me some information?','¿Me das información?'],['Thank you for your feedback.','Gracias por tu devolución.'],['She has a job in HR.','Tiene un trabajo en RRHH.']]},
 {k:'rule',h:'Sueldo: salary, wage y pay',t:'**Salary** es un monto fijo mensual o anual, **wage** se calcula por hora o por jornada, y **pay** es el término general.',
  ex:[['Her salary is paid monthly.','Su sueldo se paga por mes.'],['Wages are paid weekly.','Los jornales se pagan por semana.']]},
 {k:'wrong',h:'Errores frecuentes',items:[['I need an information.','I need some information.','Information es incontable.'],['She gave me many advices.','She gave me a lot of advice.','Advice es incontable.'],['I have a work in HR.','I have a job in HR.','«Job» es el puesto; «work» no lleva artículo.'],['I\'m agree with the policy.','I agree with the policy.','«Agree» es un verbo: no lleva am.']]},
 {k:'phr',h:'Frases útiles',items:[['I currently work in HR.','Actualmente trabajo en RRHH.'],['I have a degree in Labor Relations.','Tengo un título en Relaciones del Trabajo.'],['I attended a training on…','Asistí a una capacitación sobre…'],['I\'d like to apply for the position.','Quisiera postularme al puesto.']]}
 ],
 check:[
 {q:'«Actualmente trabajo en RRHH» se dice:',o:['I actually work in HR.','I currently work in HR.','I actual work in HR.','I\'m actually working HR.'],a:1,why:'«Actually» significa «en realidad».'},
 {q:'«Tengo una carrera en Relaciones del Trabajo» (título):',o:['I have a career in Labor Relations.','I have a degree in Labor Relations.','I have a race in Labor Relations.','I have a career title.'],a:1,why:'Para el título universitario se dice degree.'},
 {q:'«Asistí a la capacitación»:',o:['I assisted the training.','I attended the training.','I assisted to the training.','I attend to the training.'],a:1,why:'Attend es asistir a un evento.'},
 {q:'«Necesito información»:',o:['I need an information.','I need some information.','I need informations.','I need a information.'],a:1,why:'Information es incontable.'},
 {q:'«Me postulé al puesto»:',o:['I applied for the position.','I applied the position.','I made application the position.','I put application of the position.'],a:0,why:'Apply for = postularse a un puesto.'},
 {q:'«This is ___ information.» (delicada)',o:['sensible','sensitive','sensitivity','sensed'],a:1,why:'Sensitive significa delicado.'}
 ]}
);

/* Plantillas de correo: cada una arma el texto en inglés y su versión en español a partir de los campos */
const TPL=[
{id:'e01',t:'Invitar a una entrevista',when:'Cuando una persona pasó la primera selección.',
 f:[['name','Nombre de la persona','Laura'],['role','Puesto','HR Assistant'],['day','Día','Thursday, November 20'],['time','Hora','10:00 a.m.'],['mode','Modalidad','by video call'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Interview invitation – ${f.role}\n\nDear ${f.name},\n\nThank you for applying for the ${f.role} position. We were impressed by your profile and would like to invite you to an interview.\n\nDate: ${f.day}\nTime: ${f.time} (Argentina time)\nFormat: ${f.mode}\n\nCould you please confirm your availability? If this time does not work for you, let me know and we will find another option.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Invitación a entrevista – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por postularte al puesto de ${f.role}. Tu perfil nos pareció muy interesante y nos gustaría invitarte a una entrevista.\n\nFecha: ${f.day}\nHora: ${f.time} (hora de Argentina)\nModalidad: ${f.mode}\n\n¿Podrías confirmarnos tu disponibilidad? Si ese horario no te resulta conveniente, avisanos y buscamos otra opción.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e02',t:'Confirmar la recepción de una postulación',when:'Respuesta automática o manual a quien se postula.',
 f:[['name','Nombre de la persona','Martín'],['role','Puesto','Payroll Analyst'],['days','Plazo estimado de respuesta','two weeks'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: We have received your application – ${f.role}\n\nDear ${f.name},\n\nThank you for your interest in the ${f.role} position. We have received your application and our team is reviewing it.\n\nIf your profile matches what we are looking for, we will contact you within ${f.days}.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Recibimos tu postulación – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por tu interés en el puesto de ${f.role}. Recibimos tu postulación y nuestro equipo la está revisando.\n\nSi tu perfil se ajusta a lo que buscamos, nos vamos a comunicar con vos dentro de ${f.days}.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e03',t:'Comunicar que no continúa en el proceso',when:'Cierre respetuoso para quien no fue seleccionado.',
 f:[['name','Nombre de la persona','Martín'],['role','Puesto','Recruitment Coordinator'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Update on your application – ${f.role}\n\nDear ${f.name},\n\nThank you for the time and interest you dedicated to our selection process for the ${f.role} position.\n\nAfter careful consideration, we have decided to move forward with another candidate. This was not an easy decision, as your profile has many strengths.\n\nWith your permission, we would like to keep your CV on file for future opportunities.\n\nWe wish you the best in your professional career.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Novedades sobre tu postulación – ${f.role}\n\nEstimada/o ${f.name}:\n\nGracias por el tiempo y el interés que dedicaste a nuestro proceso de selección para el puesto de ${f.role}.\n\nLuego de analizarlo con detenimiento, decidimos continuar con otra candidatura. No fue una decisión sencilla, ya que tu perfil tiene muchas fortalezas.\n\nSi estás de acuerdo, nos gustaría conservar tu CV para futuras búsquedas.\n\nTe deseamos lo mejor en tu carrera profesional.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e04',t:'Oferta de empleo',when:'Para comunicar formalmente una propuesta de ingreso.',
 f:[['name','Nombre de la persona','Sofía'],['role','Puesto','HR Analyst'],['start','Fecha de ingreso','Monday, December 1'],['boss','Responsable directo','the HR Manager'],['deadline','Respuesta hasta','Friday, November 21'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Job offer – ${f.role}\n\nDear ${f.name},\n\nWe are pleased to offer you the position of ${f.role}. Your experience and skills make you a great fit for our team.\n\nProposed start date: ${f.start}\nYou will report to: ${f.boss}\n\nThe details of the compensation and benefits package are described in the attached document.\n\nCould you please let us know your decision by ${f.deadline}? If you have any questions, I will be happy to answer them.\n\nWe hope you will join us.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Propuesta de empleo – ${f.role}\n\nEstimada/o ${f.name}:\n\nNos complace ofrecerte el puesto de ${f.role}. Tu experiencia y tus habilidades son una excelente combinación para nuestro equipo.\n\nFecha de ingreso propuesta: ${f.start}\nResponderás ante: ${f.boss}\n\nEl detalle de la compensación y los beneficios se encuentra en el documento adjunto.\n\n¿Podrías avisarnos tu decisión a más tardar el ${f.deadline}? Si tenés alguna consulta, con gusto te respondo.\n\nEsperamos que te sumes al equipo.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e05',t:'Bienvenida a una persona nueva',when:'Mensaje previo al primer día.',
 f:[['name','Nombre de la persona','Camila'],['day','Primer día','Monday, December 1'],['time','Hora de llegada','9:00 a.m.'],['place','Lugar','our main office'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Welcome to the team!\n\nDear ${f.name},\n\nWelcome to the team! We are very happy that you are joining us.\n\nYour first day will be ${f.day}. Please arrive at ${f.time} at ${f.place}. We will start with a welcome session and a tour, and you will meet your team.\n\nPlease bring your ID and the documents we requested.\n\nIf you have any questions before your first day, please do not hesitate to contact me.\n\nSee you soon!\n\n${f.sign}\nHR Department`,
 es:f=>`Asunto: ¡Bienvenida/o al equipo!\n\nEstimada/o ${f.name}:\n\n¡Te damos la bienvenida! Estamos muy contentos de que te sumes al equipo.\n\nTu primer día será el ${f.day}. Te esperamos a las ${f.time} en ${f.place}. Comenzaremos con una charla de bienvenida y un recorrido, y vas a conocer a tu equipo.\n\nTraé tu documento y la documentación que te solicitamos.\n\nSi tenés alguna consulta antes de tu primer día, no dudes en escribirme.\n\n¡Hasta pronto!\n\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e06',t:'Pedir documentación',when:'Para completar el legajo antes del ingreso.',
 f:[['name','Nombre de la persona','Camila'],['docs','Documentos a pedir','a copy of your ID, your CUIL and your bank details'],['deadline','Fecha límite','Wednesday, November 26'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Documents needed to complete your file\n\nDear ${f.name},\n\nTo complete your employee file, we need the following documents: ${f.docs}.\n\nCould you please send them by ${f.deadline}? You can reply to this email and attach the files.\n\nThank you for your help.\n\nKind regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Documentación necesaria para completar tu legajo\n\nEstimada/o ${f.name}:\n\nPara completar tu legajo necesitamos la siguiente documentación: ${f.docs}.\n\n¿Podrías enviarla a más tardar el ${f.deadline}? Podés responder este correo y adjuntar los archivos.\n\nGracias por tu colaboración.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e07',t:'Reprogramar una entrevista',when:'Cuando hay que cambiar el día o la hora.',
 f:[['name','Nombre de la persona','Laura'],['role','Puesto','HR Assistant'],['old','Horario original','Thursday at 10:00 a.m.'],['new','Nueva propuesta','Friday at 11:00 a.m.'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Rescheduling your interview – ${f.role}\n\nDear ${f.name},\n\nI am writing to let you know that we need to reschedule your interview originally planned for ${f.old}${/[.!?]$/.test(f.old.trim())?'':'.'} I apologize for the inconvenience.\n\nWould ${f.new} work for you? If not, please let me know your availability and we will adjust the schedule.\n\nThank you for your understanding.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Cambio de horario de tu entrevista – ${f.role}\n\nEstimada/o ${f.name}:\n\nTe escribo para avisarte que necesitamos reprogramar tu entrevista, prevista originalmente para el ${f.old}. Pedimos disculpas por las molestias.\n\n¿Te quedaría bien el ${f.new}? Si no, contanos tu disponibilidad y ajustamos el horario.\n\nGracias por tu comprensión.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`},
{id:'e08',t:'Responder una consulta de un empleado',when:'Dudas sobre recibos, licencias o beneficios.',
 f:[['name','Nombre de la persona','Julián'],['topic','Tema de la consulta','your vacation request'],['answer','Respuesta o próximo paso','we are reviewing it with your manager and will confirm it by Friday'],['sign','Tu nombre','Your name']],
 en:f=>`Subject: Re: Your inquiry about ${f.topic}\n\nHello ${f.name},\n\nThank you for your message about ${f.topic}.\n\nAt the moment, ${f.answer}.\n\nPlease let me know if you have any other questions. I am happy to help.\n\nBest regards,\n${f.sign}\nHR Department`,
 es:f=>`Asunto: Re: Tu consulta sobre ${f.topic}\n\nHola, ${f.name}:\n\nGracias por tu mensaje sobre ${f.topic}.\n\nPor el momento, ${f.answer}.\n\nAvisame si tenés alguna otra consulta. Con gusto te ayudo.\n\nSaludos cordiales,\n${f.sign}\nÁrea de Recursos Humanos`}
];

/* Teoría de base: presentarte, describir, emociones. No es exclusiva de RRHH, pero es cómo nos presentamos en cualquier proceso. */
LESSONS.push(
{id:"l13",n:13,t:"Presentarte y romper el hielo",en:"Introducing yourself",lvl:"A2",cat:"Presentación",
 goal:"Presentarte en pocas oraciones: quién sos, a qué te dedicás y qué buscás.",
 why:"Toda entrevista, reunión o llamada nueva empieza con una presentación. Si la tenés ensayada, arrancás con seguridad aunque lo demás sea difícil.",
 blocks:[
 {k:"rule",h:"Los datos básicos con el verbo to be",t:"Para decir quién sos usá **I am / I'm** + nombre, o **My name is** en situaciones más formales. Para el trabajo sumá **I work as** + puesto, **I work at / for** + empresa y **I'm based in** + ciudad.",
  ex:[["Hi, I'm Carolina Díaz. I work as an HR analyst.","Hola, soy Carolina Díaz. Trabajo como analista de RRHH."],["I work for a manufacturing company in Córdoba.","Trabajo en una empresa industrial de Córdoba."],["I'm based in Buenos Aires.","Trabajo desde Buenos Aires."]]},
 {k:"rule",h:"La fórmula de 30 segundos: presente, pasado y futuro",t:"Una presentación profesional ordenada tiene tres partes: **1)** quién sos hoy (**present**), **2)** de dónde venís (**past**) y **3)** qué buscás (**future**). Con una oración por parte alcanza.",
  ex:[["I'm an HR generalist with four years of experience in recruitment and payroll.","Soy generalista de RRHH con cuatro años de experiencia en reclutamiento y liquidación de sueldos."],["Before that, I worked in a staffing agency, where I learned to manage high-volume hiring.","Antes trabajé en una agencia de empleo, donde aprendí a manejar contrataciones masivas."],["Now I'm looking for a role where I can grow in employee relations.","Ahora busco un puesto donde pueda crecer en relaciones laborales."]]},
 {k:"table",h:"Formal o informal",head:["Situación","Formal","Informal"],rows:[["Saludar","Good morning. It's a pleasure to meet you.","Hi! Nice to meet you."],["Decir tu nombre","My name is Laura Pérez.","I'm Laura."],["Preguntar el nombre","May I ask your name?","What's your name?"],["Despedirte","It was a pleasure meeting you.","See you soon!"]]},
 {k:"note",type:"info",h:"Qué no hace falta decir",t:"En muchos países no se espera que menciones tu edad, tu estado civil ni que agregues una foto al CV. Presentate por lo que sabés hacer."},
 {k:"wrong",h:"Errores frecuentes",items:[["I have 30 years.","I'm 30 years old.","En inglés la edad se dice con to be, no con have."],["I am five years of experience.","I have five years of experience.","La experiencia se tiene (have); no se «es»."],["I am work in HR.","I work in HR.","Con un verbo de acción no se agrega am."]]},
 {k:"phr",h:"Frases para presentarte y romper el hielo",items:[["Nice to meet you. I'm…","Encantada de conocerte. Soy…"],["I'd like to introduce myself.","Quisiera presentarme."],["Let me introduce my colleague, Martín.","Te presento a mi colega Martín."],["How's your day going?","¿Cómo viene tu día?"],["Did you find the office easily?","¿Encontraste la oficina sin problemas?"],["Thank you for having me.","Gracias por recibirme."],["Where are you from?","¿De dónde sos?"],["I'm from Rosario, but I live in Buenos Aires.","Soy de Rosario, pero vivo en Buenos Aires."]]}
 ],
 check:[
 {q:"«Hi, I ___ Martín. I work as a recruiter.»",o:["am","have","do","work"],a:0,why:"Para decir tu nombre se usa I am (I'm)."},
 {q:"¿Cómo se dice «Tengo 35 años»?",o:["I have 35 years.","I'm 35 years old.","I am 35 years.","I have 35 years old."],a:1,why:"La edad se expresa con to be: I'm 35 (years old)."},
 {q:"¿Qué parte de una presentación de 30 segundos cuenta lo que buscás?",o:["Present","Past","Future","Greeting"],a:2,why:"La fórmula termina con el futuro: lo que querés hacer."},
 {q:"¿Cuál saludo es más formal?",o:["Hi! I'm Laura.","Good morning. It's a pleasure to meet you.","Hey, what's up?","See ya!"],a:1,why:"«It's a pleasure to meet you» es la opción formal."},
 {q:"«I ___ for a consulting company in Rosario.»",o:["work","am work","works","working"],a:0,why:"Con I el verbo va en forma base: sin -s y sin am."},
 {q:"¿Cómo se expresa la experiencia laboral?",o:["I am five years of experience.","I have five years of experience.","I am having five years experience.","I has five years of experience."],a:1,why:"La experiencia se expresa con have."}
 ]},

{id:"l14",n:14,t:"Describir personas y personalidad",en:"Describing people",lvl:"A2",cat:"Presentación",
 goal:"Describir cómo es una persona (un compañero, un candidato, vos mismo/a) con adjetivos precisos y respetuosos.",
 why:"En RRHH describís perfiles todo el tiempo: en entrevistas, referencias y devoluciones. Los adjetivos justos hacen que tu descripción sea clara y profesional.",
 blocks:[
 {k:"rule",h:"To be + adjetivo: cómo es la persona",t:"Para describir la personalidad usá **to be + adjetivo**. En inglés el adjetivo **no cambia** por género ni por número: «a reliable woman», «reliable people». Para lo que alguien tiene, usá **have / has**.",
  ex:[["He is patient and very attentive to detail.","Es paciente y muy atento a los detalles."],["My manager is friendly, but he is also demanding.","Mi jefe es amable, pero también exigente."],["The new team members are enthusiastic.","Los nuevos integrantes del equipo son entusiastas."]]},
 {k:"table",h:"Intensidad: cuánto",head:["Grado","Palabras","Ejemplo"],rows:[["Poco","a bit · slightly","a bit nervous"],["Medio","quite · fairly","quite organized"],["Mucho","very · really","very reliable"],["Muchísimo","extremely · incredibly","extremely motivated"]]},
 {k:"table",h:"Cualidades que se valoran en el trabajo",head:["Adjetivo","Significa","En otras palabras"],rows:[["reliable","confiable","You can count on her."],["organized","organizado/a","Keeps files and deadlines under control."],["proactive","proactivo/a","Acts without waiting to be asked."],["collaborative","colaborativo/a","Works well with others."],["adaptable","adaptable","Adjusts quickly to change."],["detail-oriented","detallista","Rarely misses a mistake."]]},
 {k:"rule",h:"Aspecto físico: solo cuando hace falta",t:"Para reconocer a alguien (por ejemplo, en recepción) se usa **He / She is + tall, short, slim…** y **has + pelo, barba**. El orden habitual es **opinión + tamaño + edad + color**. En un proceso de selección el aspecto no se evalúa.",
  ex:[["She is tall, with short dark hair and glasses.","Es alta, de pelo corto y oscuro, y usa anteojos."],["He has a beard and wears a blue jacket.","Tiene barba y lleva una campera azul."]]},
 {k:"note",type:"warn",h:"En RRHH: hechos, no etiquetas",t:"En evaluaciones y referencias describí **conductas observables**, no rasgos personales ni características como edad, apariencia o estado civil. Mejor «She meets every deadline» que «She is a nice girl»."},
 {k:"wrong",h:"Errores frecuentes",items:[["My colleague is very sympathetic.","My colleague is very nice.","«Sympathetic» no significa «simpático»: quiere decir comprensivo ante el dolor ajeno. «Simpático» es nice o friendly."],["He is a very patience person.","He is a very patient person.","Patience es el sustantivo; el adjetivo es patient."],["He is shy and no talks much.","He is shy and doesn't talk much.","La negación se arma con doesn't + verbo."]]},
 {k:"phr",h:"Frases para describir a alguien",items:[["She is great at working under pressure.","Es muy buena para trabajar bajo presión."],["He tends to be quiet in meetings.","Suele ser callado en las reuniones."],["She gets along well with everyone.","Se lleva bien con todos."],["He is someone you can rely on.","Es alguien en quien se puede confiar."],["I would describe myself as organized and curious.","Me describiría como una persona organizada y curiosa."],["What is she like?","¿Cómo es ella?"]]}
 ],
 check:[
 {q:"«She is a very ___ person.»",o:["patience","patient","patiently","patients"],a:1,why:"Antes de un sustantivo va el adjetivo: patient."},
 {q:"¿Cómo se dice «Es muy confiable»?",o:["He is very reliable.","He has very reliable.","He is very reliability.","He very reliable."],a:0,why:"Personalidad: to be + adjetivo."},
 {q:"¿Qué significa «detail-oriented»?",o:["Detallista, atento a los detalles","Orientado a los clientes","Que evita los detalles","Que habla mucho"],a:0,why:"Detail-oriented describe a quien presta atención a los detalles."},
 {q:"«Sympathetic» en inglés significa:",o:["Simpático","Comprensivo ante el dolor ajeno","Antipático","Sincero"],a:1,why:"Es un falso amigo: «simpático» se dice nice o friendly."},
 {q:"¿Qué descripción es más adecuada en una evaluación de desempeño?",o:["She is young and energetic.","She meets every deadline and updates the team daily.","She is a nice girl.","She looks very professional."],a:1,why:"En RRHH conviene describir conductas observables."},
 {q:"«What is she like?» pregunta por:",o:["Qué le gusta","Cómo es (su personalidad)","Cómo se viste","Dónde vive"],a:1,why:"What is she like? pide una descripción. Para gustos se dice What does she like?"}
 ]},

{id:"l15",n:15,t:"Hablar de emociones y estados de ánimo",en:"Feelings and emotions",lvl:"B1",cat:"Presentación",
 goal:"Expresar cómo te sentís y entender cómo se sienten otras personas, con el tono justo para el trabajo.",
 why:"En entrevistas te preguntan cómo te sentís con el puesto, y en RRHH escuchás a diario a personas estresadas, frustradas o entusiasmadas. Responder con empatía y vocabulario preciso genera confianza.",
 blocks:[
 {k:"rule",h:"Feel o to be + emoción",t:"Se puede decir **I feel + adjetivo** o **I am + adjetivo**: «I feel nervous» / «I'm nervous». Para preguntar: **How are you feeling?** y **How do you feel about…?**",
  ex:[["I feel excited about the new role.","Me entusiasma el nuevo puesto."],["I'm a bit nervous before interviews.","Me pongo un poco nerviosa antes de las entrevistas."],["How are you feeling about the workload?","¿Cómo te sentís con la carga de trabajo?"]]},
 {k:"rule",h:"-ed o -ing: cómo me siento y qué lo causa",t:"Los adjetivos en **-ed** dicen **cómo se siente la persona** (bored, excited, tired). Los que terminan en **-ing** describen **lo que causa** ese sentimiento (boring, exciting, tiring).",
  ex:[["I am excited about the project.","Estoy entusiasmada con el proyecto."],["The project is exciting.","El proyecto es emocionante."],["The meeting was boring, so I was bored.","La reunión fue aburrida y yo me aburrí."]]},
 {k:"table",h:"Emociones en el trabajo",head:["Positivas","Inciertas","Difíciles"],rows:[["motivated · proud","curious · unsure","stressed · overwhelmed"],["grateful · confident","surprised · hesitant","frustrated · disappointed"],["relieved · satisfied","nervous · anxious","upset · burned out"]]},
 {k:"rule",h:"Escuchar y responder con empatía",t:"Cuando alguien comparte una preocupación, primero **reconocé la emoción** y después preguntá o proponé algo. Fórmula: **I understand that… / It sounds like…** + pregunta abierta.",
  ex:[["I understand that you feel overwhelmed. What would help you most right now?","Entiendo que te sientas desbordado/a. ¿Qué te ayudaría más en este momento?"],["It sounds like you are frustrated with the process.","Parece que estás frustrado/a con el proceso."],["Thank you for telling me. I appreciate your honesty.","Gracias por contármelo. Valoro tu sinceridad."]]},
 {k:"note",type:"tip",h:"En la entrevista: emociones positivas y concretas",t:"Para hablar de tus ganas usá **I'm excited about / I'm motivated by / I'm passionate about** y agregá un motivo: «I'm excited about this role because…». Si te preguntan cómo manejás la presión, nombrá la emoción y contá qué hacés para manejarla."},
 {k:"wrong",h:"Errores frecuentes",items:[["I'm very exciting about the job.","I'm very excited about the job.","Para decir cómo te sentís se usa -ed. Exciting describe lo que causa la emoción."],["I'm boring in this meeting.","I'm bored in this meeting.","«I'm boring» significa «soy una persona aburrida»."],["I feel embarazada.","I feel embarrassed.","«Embarrassed» significa avergonzado/a, no «embarazada» (pregnant)."]]},
 {k:"phr",h:"Frases para hablar de emociones",items:[["I'm really looking forward to this opportunity.","Tengo muchas ganas de que llegue esta oportunidad."],["I feel confident that I can contribute to the team.","Me siento segura de poder aportar al equipo."],["I was a little nervous at first, but I got used to it.","Al principio estaba un poco nerviosa, pero me acostumbré."],["It's completely understandable to feel that way.","Es totalmente comprensible sentirse así."],["I'm sorry to hear that.","Lamento escuchar eso."],["I'm grateful for your support.","Agradezco tu apoyo."],["Take your time. There's no rush.","Tomate tu tiempo. No hay apuro."]]}
 ],
 check:[
 {q:"«I am very ___ about the new project.» (yo siento entusiasmo)",o:["exciting","excited","excite","excitement"],a:1,why:"Para cómo se siente la persona se usa -ed."},
 {q:"«The training was really ___.» (la capacitación cansó a todos)",o:["tired","tiring","tire","tiredness"],a:1,why:"Lo que causa el cansancio se describe con -ing."},
 {q:"¿Qué significa «embarrassed»?",o:["Embarazada","Avergonzado/a","Enojado/a","Sorprendido/a"],a:1,why:"Es un falso amigo: «embarazada» se dice pregnant."},
 {q:"Una persona te dice que está desbordada de trabajo. ¿Qué respuesta es empática?",o:["Don't worry, it's not a big deal.","I understand that you feel overwhelmed. What would help you most?","You should work faster.","Everyone is busy."],a:1,why:"Primero se reconoce la emoción y después se pregunta cómo ayudar."},
 {q:"«I'm looking forward to…» significa:",o:["Estoy mirando hacia adelante","Tengo ganas de / espero con ilusión","Estoy buscando","Me da miedo"],a:1,why:"Se usa para expresar ilusión por algo que va a pasar."},
 {q:"¿Qué opción usa bien bored?",o:["I am boring in the meeting.","I am bored in the meeting.","I am bore in the meeting.","I have boring in the meeting."],a:1,why:"Para decir que vos te aburrís, se usa bored."}
 ]},

{id:"l16",n:16,t:"Describir tu empresa y tu lugar de trabajo",en:"Describing a company and a workplace",lvl:"A2",cat:"Presentación",
 goal:"Presentar tu empresa y tu equipo, y describir un puesto o un espacio de trabajo con claridad.",
 why:"Al presentar una vacante o responder «Tell me about your company» necesitás hablar de tamaño, rubro, cultura y funciones con vocabulario simple y preciso.",
 blocks:[
 {k:"rule",h:"Presentar una empresa",t:"Usá **We are a / an + tipo de empresa**, **We have + cantidad de empleados** y **We are based in** + lugar. Para contar qué hace: **We provide / We specialize in / We produce**.",
  ex:[["We are a mid-sized logistics company based in Rosario.","Somos una empresa de logística mediana con sede en Rosario."],["We have around 250 employees in three offices.","Tenemos unos 250 empleados en tres oficinas."],["We specialize in HR services for small businesses.","Nos especializamos en servicios de RRHH para pymes."]]},
 {k:"rule",h:"There is y there are: describir un espacio",t:"Para decir qué hay en un lugar: **there is** + singular o incontable, **there are** + plural. Negativo: **there isn't / there aren't**. Pregunta: **Is there…? / Are there…?**",
  ex:[["There is a printer next to the reception desk.","Hay una impresora junto a la recepción."],["There are two open positions in the team.","Hay dos puestos abiertos en el equipo."],["Is there a dress code?","¿Hay un código de vestimenta?"]]},
 {k:"rule",h:"Comparar: más que, el más",t:"Para comparar: adjetivo corto + **-er than** (bigger than) o **more** + adjetivo largo + **than** (more flexible than). Para destacar: **the -est** o **the most**.",
  ex:[["Our office is bigger than the old one.","Nuestra oficina es más grande que la anterior."],["Remote work is more flexible than a fixed schedule.","El trabajo remoto es más flexible que un horario fijo."],["This is the most important vacancy this year.","Esta es la vacante más importante de este año."]]},
 {k:"table",h:"Describir un puesto o una cultura",head:["Qué describís","Vocabulario","Ejemplo"],rows:[["Ambiente","friendly · fast-paced · formal","It's a fast-paced environment."],["Horario","flexible · fixed · hybrid","We offer a hybrid schedule."],["Equipo","small · diverse · supportive","You'll join a small, supportive team."],["Oportunidades","growth · training · promotion","There are real growth opportunities."]]},
 {k:"note",type:"info",h:"Descripción de puesto",t:"Al describir las funciones, empezá cada tarea con un **verbo** (manage, prepare, coordinate) y ordenalas de más a menos importante. Evitá adjetivos vagos como «dynamic» si no los respaldás con un dato."},
 {k:"wrong",h:"Errores frecuentes",items:[["We are 200 persons in the company.","We have 200 employees.","Para la cantidad de personal se usa have + employees."],["There is two vacancies.","There are two vacancies.","Con plural se usa there are."],["The new office is more big than the old one.","The new office is bigger than the old one.","Los adjetivos cortos forman el comparativo con -er."]]},
 {k:"phr",h:"Frases para describir tu empresa y tu lugar de trabajo",items:[["We are a family-owned company.","Somos una empresa familiar."],["Our culture is based on teamwork.","Nuestra cultura se basa en el trabajo en equipo."],["The team is made up of eight people.","El equipo está formado por ocho personas."],["We offer a hybrid schedule.","Ofrecemos un horario híbrido."],["It is a fast-paced environment.","Es un ambiente dinámico, de ritmo rápido."],["The office is close to the train station.","La oficina queda cerca de la estación de tren."],["What is the work environment like?","¿Cómo es el ambiente de trabajo?"]]}
 ],
 check:[
 {q:"«___ two open positions in the team.»",o:["There is","There are","It is","They are"],a:1,why:"Con un plural se usa there are."},
 {q:"¿Cuál es la comparación correcta?",o:["Our office is more big than the old one.","Our office is bigger than the old one.","Our office is biggest than the old one.","Our office is more bigger than the old one."],a:1,why:"Adjetivo corto: big → bigger than."},
 {q:"¿Cómo se dice «Tenemos 200 empleados»?",o:["We are 200 employees.","We have 200 employees.","We has 200 employees.","We make 200 employees."],a:1,why:"Se usa have + employees."},
 {q:"«___ a dress code?»",o:["Is there","Are there","There is","Has"],a:0,why:"Pregunta en singular: Is there…?"},
 {q:"¿Qué significa «fast-paced»?",o:["De ritmo rápido","Lento y tranquilo","Con horarios fijos","Con mucho espacio"],a:0,why:"Fast-paced describe un ambiente de ritmo rápido."},
 {q:"«This is ___ vacancy this year.» (la más importante)",o:["the importantest","the most important","more important","the more important"],a:1,why:"Adjetivo largo: the most + adjetivo."}
 ]}
);

IQ.push(
{id:'q36',cat:'pres',lvl:'C1',q:"How has your career shaped the way you approach people management?",es:"¿Cómo moldeó tu carrera la forma en que gestionás personas?",
 want:"Si podés conectar tu trayectoria con una filosofía de gestión propia y coherente",
 doo:"Elegir dos o tres experiencias clave y explicar qué aprendiste de cada una sobre cómo liderar personas",
 tip:"No repitas tu CV. Elegí experiencias que te cambiaron la manera de trabajar y mostrá cómo hoy influyen en tus decisiones.",
 model:"Early in my career, I worked in payroll, where a single mistake directly affected people's lives. That taught me to be rigorous and to take accountability seriously. Later, as an HR business partner, I learned that trust is built through consistency and by listening before proposing solutions. Today, I try to combine both lessons: clear processes, and conversations in which people feel heard.",
 modelEs:"Al comienzo de mi carrera trabajé en liquidación de sueldos, donde un solo error afectaba directamente la vida de las personas. Eso me enseñó a ser rigurosa y a tomarme en serio la responsabilidad. Más adelante, como HR business partner, aprendí que la confianza se construye con coherencia y escuchando antes de proponer soluciones. Hoy intento combinar ambas lecciones: procesos claros y conversaciones en las que las personas se sientan escuchadas.",
 ph:[["Early in my career,…","Al comienzo de mi carrera,…"],["That taught me to…","Eso me enseñó a…"],["Today, I try to combine…","Hoy intento combinar…"]],area:'iv'},
{id:'q37',cat:'exp',lvl:'C1',q:"What is the most complex organizational change you have contributed to?",es:"¿Cuál es el cambio organizacional más complejo en el que participaste?",

 modelEs:"El cambio más complejo fue la fusión de dos equipos regionales en uno solo. Mi rol fue diseñar el plan de comunicación y los nuevos perfiles de puesto. Hicimos reuniones en grupos pequeños para atender las inquietudes y publicamos un cronograma claro. En seis meses, la rotación voluntaria del equipo fusionado fue menor que el promedio del año anterior y la encuesta de compromiso mostró una mejora clara.",
 ph:[["My role was to design…","Mi rol fue diseñar…"],["We held sessions to address concerns.","Hicimos reuniones para atender las inquietudes."],["The survey showed a clear improvement.","La encuesta mostró una mejora clara."]],area:'iv'},
{id:'q38',cat:'fort',lvl:'C1',q:"Where do you think your leadership style still needs to evolve?",es:"¿En qué aspecto creés que tu estilo de liderazgo todavía tiene que evolucionar?",
 want:"Si tenés autoconocimiento y si trabajás activamente en tu desarrollo",
 doo:"Nombrar un aspecto real y no esencial para el puesto, y explicar qué estás haciendo para mejorarlo",
 tip:"Evitá debilidades disfrazadas de virtudes («soy demasiado perfeccionista»). Elegí algo concreto y mostrá acciones y avances.",
 model:"I tend to take on too much when a project is urgent, which can leave less room for my team to grow. I've been working on it by delegating whole pieces of work rather than isolated tasks, and by agreeing on check-in points instead of reviewing everything myself. It has improved both the pace of the team and its autonomy.",
 modelEs:"Tiendo a asumir demasiado cuando un proyecto es urgente, y eso puede dejarle menos espacio de crecimiento a mi equipo. Lo vengo trabajando delegando partes completas del trabajo en lugar de tareas aisladas, y acordando puntos de control en vez de revisar todo yo. Mejoró tanto el ritmo del equipo como su autonomía.",
 ph:[["I tend to…","Tiendo a…"],["I've been working on it by…","Lo vengo trabajando…"],["It has improved…","Mejoró…"]],area:'iv'},
{id:'q39',cat:'cond',lvl:'C1',q:"Describe a situation where you had to influence a decision without having formal authority.",es:"Describí una situación en la que tuviste que influir en una decisión sin tener autoridad formal.",
 want:"Si podés persuadir con datos y relaciones, sin depender de tu cargo",
 doo:"Usar STAR, mostrar cómo reuniste evidencia y apoyos, y explicar cómo respetaste a quien decidía",
 tip:"Mostrá cómo construiste argumentos (datos) y alianzas (personas). Aclará qué pasó aunque la decisión final no haya sido la que esperabas.",
 model:"Our payroll cut-off date was causing frequent errors, but I had no authority over the finance calendar. I gathered three months of data showing the cost of corrections, and I presented it to the finance director together with a simple alternative. Two team leaders supported the proposal. The cut-off date was moved, and corrections dropped by almost half.",

{id:'q40',cat:'sit',lvl:'C1',q:"A high performer threatens to resign after being passed over for promotion. How do you respond?",es:"Una persona de alto desempeño amenaza con renunciar porque no la ascendieron. ¿Cómo respondés?",
 want:"Si escuchás antes de actuar, si cuidás la equidad y si proponés una salida realista",

 tip:"No prometas un ascenso para retenerla. Mostrá escucha, transparencia en los criterios y un camino de desarrollo con plazos.",
 model:"First, I would meet with her privately to understand what is behind her decision. I would review the promotion criteria to make sure the process was fair, and I would explain the outcome transparently. If there is a genuine development gap, we would agree on a concrete plan with milestones. I would not promise a promotion just to retain her; I would aim for a solution that is fair for her and for the rest of the team.",
 modelEs:"Primero, me reuniría con ella en privado para entender qué hay detrás de su decisión. Revisaría los criterios de ascenso para asegurarme de que el proceso fue justo y le explicaría el resultado con transparencia. Si realmente hay una brecha de desarrollo, acordaríamos un plan concreto con hitos. No le prometería un ascenso solo para retenerla; buscaría una solución justa para ella y para el resto del equipo.",
 ph:[["I would meet with her privately.","Me reuniría con ella en privado."],["I would explain the outcome transparently.","Le explicaría el resultado con transparencia."],["I would not promise a promotion just to retain her.","No le prometería un ascenso solo para retenerla."]],area:'iv'},
{id:'q41',cat:'mot',lvl:'C1',q:"What would you want to have achieved in this role by the end of your first year?",es:"¿Qué te gustaría haber logrado en este puesto al cumplir tu primer año?",
 want:"Si tenés expectativas realistas y si pensás en resultados concretos para la organización",
 doo:"Fijar dos o tres objetivos medibles y explicar cómo empezarías, sin prometer resultados poco realistas",

 model:"In the first few months, I would focus on listening and understanding the organization's priorities. By the end of the year, I would like to have a clear onboarding process, reliable HR metrics available to the leadership team, and a development plan for our key roles. I would measure progress through retention, time to fill and employee feedback.",
 modelEs:"En los primeros meses me enfocaría en escuchar y entender las prioridades de la organización. Al cumplir el año, me gustaría haber implementado un proceso de inducción claro, contar con indicadores de RRHH confiables para el equipo directivo y tener un plan de desarrollo para los puestos clave. Mediría el avance con la retención, el tiempo de cobertura de vacantes y la opinión del personal.",
 ph:[["I would focus on listening and understanding.","Me enfocaría en escuchar y entender."],["By the end of the year, I would like to have…","Al cumplir el año, me gustaría haber…"],["I would measure progress through…","Mediría el avance a través de…"]],area:'iv'},
{id:'q42',cat:'cierre',lvl:'C1',q:"Is there any concern about your candidacy that we haven't addressed yet?",es:"¿Hay alguna duda sobre tu candidatura que todavía no hayamos tratado?",
 want:"Si tenés seguridad para encarar posibles objeciones y si cerrás la entrevista con claridad",
 doo:"Anticipar con honestidad una posible objeción y explicar brevemente por qué no debería ser un obstáculo",

 ph:[["I appreciate the opportunity to address that.","Agradezco la oportunidad de tratar ese tema."],["One point you may have in mind is…","Un punto que quizás tengan en mente es…"],["I'm confident that I can contribute from the start.","Tengo confianza en que puedo aportar desde el comienzo."]],area:'iv'},
{id:'q43',cat:'cond',lvl:'C2',q:"Tell me about a time you had to challenge a senior leader's decision. How did you handle it?",es:"Contame sobre una vez en que tuviste que cuestionar una decisión de un directivo. ¿Cómo lo manejaste?",
 want:"Si tenés criterio y valentía para discrepar con respeto y con evidencia, sin dañar la relación",
 doo:"Mostrar que preparaste datos, elegiste el momento y el ámbito adecuados y aceptaste la decisión final",
 tip:"Mostrá respeto por la autoridad y firmeza en el argumento. Aclará qué pasó con la relación después y qué aprendiste.",
 model:"A senior leader wanted to freeze all promotions for a year to control costs. I believed that would increase attrition among our best people. I asked for a private meeting, presented retention data from the previous freeze, and proposed a limited alternative for critical roles. He didn't accept it entirely, but he approved exceptions for key positions. The experience taught me that disagreement is most effective when it comes with evidence and a constructive option.",
 modelEs:"Un directivo quería congelar todos los ascensos durante un año para controlar costos. Yo creía que eso aumentaría las bajas entre nuestras mejores personas. Pedí una reunión privada, presenté datos de retención del congelamiento anterior y propuse una alternativa limitada para los puestos críticos. No la aceptó por completo, pero aprobó excepciones para posiciones clave. La experiencia me enseñó que el desacuerdo es más eficaz cuando viene con evidencia y una opción constructiva.",
 ph:[["I asked for a private meeting.","Pedí una reunión privada."],["I presented data and proposed an alternative.","Presenté datos y propuse una alternativa."],["Disagreement is most effective when it comes with evidence.","El desacuerdo es más eficaz cuando viene con evidencia."]],area:'iv'},
{id:'q44',cat:'sit',lvl:'C2',q:"How would you balance legal compliance and business pressure in a restructuring that involves reducing headcount?",es:"¿Cómo equilibrarías el cumplimiento legal y la presión del negocio en una reestructuración que implica reducir la dotación?",
 want:"Si priorizás el cumplimiento normativo, la equidad y la comunicación, sin dejar de entender las necesidades del negocio",
 doo:"Proponer un proceso ordenado: asesoramiento legal, criterios objetivos y documentados, comunicación cuidada y apoyo a las personas afectadas",
 tip:"No des detalles legales que no puedas respaldar: aclará que consultarías la normativa vigente y asesoramiento especializado. Hablá de criterios objetivos y trato digno.",
 model:"I would start by clarifying the business objective and exploring alternatives, such as attrition or redeployment. Then I would work with legal counsel to ensure full compliance with current labor regulations, and I would define objective, documented criteria. Communication would be careful and respectful, with clear support for those affected, including outplacement where possible. Compliance is not an obstacle to the business; it protects both the people and the company.",
 modelEs:"Empezaría por aclarar el objetivo del negocio y explorar alternativas, como las bajas no reemplazadas o la reubicación interna. Después trabajaría con asesoría legal para asegurar el pleno cumplimiento de la normativa laboral vigente y definiría criterios objetivos y documentados. La comunicación sería cuidada y respetuosa, con apoyo claro para las personas afectadas, incluida la recolocación laboral cuando sea posible. El cumplimiento no es un obstáculo para el negocio: protege tanto a las personas como a la empresa.",
 ph:[["I would start by clarifying the business objective.","Empezaría por aclarar el objetivo del negocio."],["I would define objective, documented criteria.","Definiría criterios objetivos y documentados."],["Compliance protects both the people and the company.","El cumplimiento protege tanto a las personas como a la empresa."]],area:'iv'},
{id:'q45',cat:'mot',lvl:'C2',q:"How do you see the role of HR changing over the next decade, and how are you preparing for it?",es:"¿Cómo ves que va a cambiar el rol de RRHH en la próxima década y cómo te estás preparando?",
 want:"Si tenés una mirada estratégica y fundamentada de la profesión y si seguís aprendiendo",
 doo:"Plantear dos o tres tendencias con matices, aclarar que son tu opinión y explicar qué estás haciendo para prepararte",
 tip:"Es una pregunta de opinión: usá expresiones como «I believe» o «in my view» y evitá predicciones tajantes. Conectá cada tendencia con una acción tuya.",

 modelEs:"En mi opinión, RRHH se va a basar cada vez más en datos y se va a vincular más con la estrategia del negocio, aunque la parte humana del rol seguirá siendo esencial. Creo que habilidades como la analítica de personas, la gestión del cambio y el criterio ético van a ser cada vez más importantes. Para prepararme, estoy estudiando analítica de personas y busco proyectos en los que pueda apoyar decisiones con datos sin perder el foco en las personas.",
 ph:[["In my view,…","En mi opinión,…"],["I believe that… will become increasingly important.","Creo que… va a ser cada vez más importante."],["To prepare, I'm studying…","Para prepararme, estoy estudiando…"]],area:'iv'},
{id:'q46',cat:'exp',lvl:'C2',q:"Looking back, which of your decisions in HR would you make differently today, and why?",es:"Mirando hacia atrás, ¿qué decisión tomada en RRHH harías distinto hoy y por qué?",
 want:"Si tenés madurez profesional, capacidad de reflexión y de aprendizaje a partir de la experiencia",

 ph:[["Looking back,…","Mirando hacia atrás,…"],["Today, I would involve…","Hoy involucraría a…"],["Since then, I have applied that approach to…","Desde entonces, apliqué ese enfoque en…"]],area:'iv'}
);

LESSONS.push(
{id:'l17',n:17,t:'Lenguaje diplomático: atenuar sin perder claridad',en:'Hedging and diplomatic language',lvl:'C1',cat:'Comunicación',
 goal:'Decir cosas delicadas con tacto, sin sonar tajante y sin esconder el mensaje.',
 why:'En devoluciones, negociaciones y conversaciones difíciles, el tono es parte del mensaje. El inglés profesional atenúa mucho más que el español rioplatense.',
 blocks:[
 {k:'rule',h:'Atenuar con verbos y adverbios',t:'Para decir algo delicado sin sonar tajante se usan **verbos de atenuación** (seem, appear, tend to, suggest) y **adverbios** (somewhat, fairly, relatively, perhaps). Suavizan la afirmación sin volverla vaga.',
  ex:[["The results seem to suggest that morale is declining.","Los resultados parecen indicar que la moral está bajando."],["There appears to be some confusion about the new schedule.","Parece haber cierta confusión sobre el nuevo horario."],["Turnover is somewhat higher than we expected.","La rotación es algo mayor de lo que esperábamos."],["Perhaps we could revisit the timeline.","Quizás podríamos revisar el cronograma."]]},
 {k:'rule',h:'Pedidos indirectos',t:'Con **I was wondering if** y **would it be possible to** el pedido se vuelve más indirecto. Después de «I was wondering if» se usa **could** o **would**.',
  ex:[["I was wondering if you could send me the report today.","Me preguntaba si podrías enviarme el informe hoy."],["Would it be possible to move the meeting to Thursday?","¿Sería posible pasar la reunión al jueves?"],["I was wondering whether we might discuss the schedule.","Me preguntaba si podríamos hablar del cronograma."]]},
 {k:'table',h:'De directo a diplomático',head:['Directo','Diplomático'],rows:[["You are wrong.","I see it a little differently."],["This doesn't work.","This may not be the most effective approach."],["You didn't finish the report.","The report seems to be incomplete."],["I disagree.","I'm not sure I fully agree."],["Send me the data.","Could you possibly send me the data?"]]},
 {k:'note',type:'tip',h:'Atenuar no es esconder',t:'Atenuá el **tono**, no el **contenido**. Si hay un problema serio, nombralo con claridad: un mensaje demasiado vago puede hacer que la otra persona no entienda la gravedad.'},
 {k:'note',type:'warn',h:'Cuidado con acumular atenuantes',t:'Una frase con tres atenuantes («I was just wondering whether maybe we could possibly…») suena insegura. Con **uno** suele alcanzar.'},
 {k:'wrong',h:'Errores frecuentes',items:[["I want that you send me the report.","I'd like you to send me the report.","Después de want o would like + persona se usa **to** + verbo. «Want that» no se usa."],["Could you to send me the report?","Could you send me the report?","Después de could va el verbo base, sin to."],["I was wondering if you will send me the report.","I was wondering if you could send me the report.","Después de «I was wondering if» se usa could o would, no will."]]},
 {k:'phr',h:'Frases útiles',items:[["It seems to me that…","Me parece que…"],["I may be mistaken, but…","Puede que me equivoque, pero…"],["I'm not sure I fully agree.","No estoy seguro de estar del todo de acuerdo."],["Would it be possible to…?","¿Sería posible…?"],["Perhaps we could…","Quizás podríamos…"],["To some extent, yes.","Hasta cierto punto, sí."]]}
 ],
 check:[
 {q:'¿Cuál de estas frases es la más diplomática?',o:['You are wrong about the schedule.','I see the schedule a little differently.','The schedule is bad.','Change the schedule.'],a:1,why:'Presenta una opinión distinta sin acusar a la otra persona.'},
 {q:'Completá: «I was wondering if you ___ send me the report.»',o:['will','could','must','are'],a:1,why:'Con «I was wondering if» se usa could o would para un pedido indirecto.'},
 {q:'¿Qué significa «There appears to be some confusion»?',o:['Hay confusión total y es culpa de alguien','Parece haber cierta confusión','No hay ninguna confusión','Voy a eliminar la confusión'],a:1,why:'«Appears to be» atenúa: no afirma que haya confusión de forma absoluta.'},
 {q:'¿Qué verbo NO atenúa una afirmación?',o:['seem','tend to','appear','demand'],a:3,why:'«Demand» (exigir) refuerza el mensaje; seem, tend to y appear lo atenúan.'},
 {q:'¿Qué conviene hacer al comunicar un problema serio?',o:['Usar muchos atenuantes para no incomodar','Atenuar el tono, pero nombrar el problema con claridad','Evitar mencionarlo','Decirlo sin ningún cuidado'],a:1,why:'Se atenúa el tono, no el contenido.'},
 {q:'¿Qué pedido está bien formulado?',o:["I'd like you to send me the report.","I'd like that you send me the report.","I'd like you send me the report.","I'd like you sending me the report."],a:0,why:'Would like + persona + to + verbo base.'}
 ]},
{id:'l18',n:18,t:'Informar lo que dijeron otros: actas e investigaciones',en:'Reported speech and reporting verbs',lvl:'C1',cat:'Gramática aplicada',
 goal:'Reportar declaraciones, reuniones y reclamos con el verbo y la estructura correctos.',
 why:'RRHH redacta actas, informes de investigación y resúmenes de reuniones. Cada verbo de reporte tiene su estructura y su matiz.',
 blocks:[
 {k:'rule',h:'Retroceso de tiempos',t:'Al contar lo que dijo otra persona, el verbo suele **retroceder un tiempo**: presente → pasado, pasado y present perfect → past perfect, will → would. Si lo dicho sigue siendo cierto, no hace falta retroceder.',
  ex:[["She said (that) she was overloaded.","Dijo que estaba sobrecargada."],["He told me he had submitted the form the day before.","Me dijo que había presentado el formulario el día anterior."],["The manager said he would review the request.","El gerente dijo que iba a revisar la solicitud."],["She said the office closes at six.","Dijo que la oficina cierra a las seis."]]},
 {k:'rule',h:'Verbos de reporte: la estructura que sigue',t:'Cada verbo exige su propia estructura: **admit, deny, suggest y recommend** + -ing o + that; **advise, warn, ask y tell** + persona + to; **insist on** + -ing; **claim** + to + verbo o + that.',
  ex:[["He admitted arriving late on several occasions.","Admitió haber llegado tarde en varias ocasiones."],["She denied sharing the confidential file.","Negó haber compartido el archivo confidencial."],["The consultant suggested reviewing the policy.","El consultor sugirió revisar la política."],["HR advised him to document the incident.","RRHH le aconsejó que documentara el incidente."],["The manager warned them not to share the data.","El gerente les advirtió que no compartieran los datos."]]},
 {k:'table',h:'Verbos de reporte y su estructura',head:['Verbo','Estructura','Ejemplo'],rows:[["admit / deny","+ -ing o that","She denied taking the document."],["suggest / recommend","+ -ing o that + sujeto + verbo","They recommended that we update the policy."],["advise / warn / ask / tell","+ persona + to + verbo","I told her to contact HR."],["insist on","+ -ing","He insisted on speaking to the director."],["claim","+ to + verbo o that","She claimed to have sent the email."]]},
 {k:'note',type:'info',h:'Elegí el verbo según lo que se dijo',t:'En actas e investigaciones, el verbo comunica una actitud: **state** (declarar), **report** (informar), **acknowledge** (reconocer) y **claim** (afirmar, sin confirmarlo). Un verbo mal elegido puede sugerir que algo ya se comprobó o que se duda de la persona.'},
 {k:'wrong',h:'Errores frecuentes',items:[["She suggested me to review the policy.","She suggested that I review the policy.","Suggest no lleva persona + to. Se usa suggest + that, o suggest + -ing."],["He admitted to have arrived late.","He admitted arriving late.","Después de admit se usa -ing (o that + oración), no el infinitivo."],["The employee said me that he was ill.","The employee told me that he was ill.","Tell lleva persona directa («told me»); con say no se usa «me» («said that»)."]]},
 {k:'phr',h:'Frases útiles',items:[["According to the report,…","Según el informe,…"],["The employee stated that…","La persona declaró que…"],["It was reported that…","Se informó que…"],["She acknowledged that…","Reconoció que…"],["He denied any wrongdoing.","Negó haber cometido cualquier falta."],["The witness claimed to have seen…","El testigo afirmó haber visto…"]]}
 ],
 check:[
 {q:'«I have finished the audit.» → She said that she ___ the audit.',o:['has finished','had finished','finishes','will finish'],a:1,why:'El present perfect retrocede a past perfect: «had finished».'},
 {q:'¿Qué opción usa bien el verbo admit?',o:['He admitted to arrive late.','He admitted arriving late.','He admitted arrive late.','He admitted of arriving late.'],a:1,why:'Después de admit se usa -ing.'},
 {q:'¿Qué estructura lleva «advise»?',o:['advise + persona + to + verbo','advise + persona + verbo base','advise + that + persona to','advise + to + persona'],a:0,why:'Advise + persona + to + verbo: «HR advised him to document it».'},
 {q:'¿Qué oración usa bien el verbo suggest?',o:['She suggested me to review it.','She suggested that I review it.','She suggested me reviewing it.','She suggested to me to review.'],a:1,why:'Suggest se construye con that + sujeto + verbo, o con -ing.'},
 {q:'¿Qué verbo conviene para reportar algo dicho por una persona sin confirmarlo?',o:['prove','claim','confirm','verify'],a:1,why:'«Claim» (afirmar) no implica que lo dicho sea cierto; los otros tres sí.'},
 {q:'«The employee said me that he was ill.» tiene un error. ¿Cuál es?',o:['Falta «to» antes de ill','Debe ser «told me» (o «said» sin «me»)','Debe usarse el presente','No hay error'],a:1,why:'Se dice «told me that» o «said that», pero no «said me».'}
 ]},
{id:'l19',n:19,t:'Redactar políticas y comunicados con registro formal',en:'Formal register and policy writing',lvl:'C1',cat:'Comunicación',
 goal:'Escribir políticas, avisos y comunicados con un tono formal, claro y profesional.',
 why:'Los manuales del empleado, las políticas y los comunicados oficiales usan un registro distinto del de un correo cotidiano.',
 blocks:[
 {k:'rule',h:'Verbos formales en lugar de verbos comunes',t:'Los textos formales prefieren verbos como **require** (en vez de need), **obtain** (en vez de get), **inform** o **notify** (en vez de tell) y **apply to** (en vez de be valid for).',
  ex:[["Employees are required to submit the form.","El personal debe presentar el formulario."],["Staff must obtain prior approval from their manager.","El personal debe obtener la aprobación previa de su jefe."],["Please inform HR of any change in your personal details.","Informe a RRHH cualquier cambio en sus datos personales."],["The policy applies to all employees.","La política se aplica a todo el personal."]]},
 {k:'table',h:'De informal a formal',head:['Informal','Formal'],rows:[["We need you to…","Employees are required to…"],["If you can't come, tell us.","In the event of absence, please notify HR."],["Get approval first.","Prior approval must be obtained."],["We'll look into it.","The matter will be reviewed."],["As soon as possible","At the earliest opportunity"]]},
 {k:'rule',h:'Sustantivos en lugar de verbos',t:'Convertir un verbo en sustantivo vuelve el texto más formal y compacto: **decide → decision**, **apply → application**, **fail → failure**. Suele combinarse con expresiones como **result in** o **reserve the right to**.',
  ex:[["Failure to comply may result in disciplinary action.","El incumplimiento puede dar lugar a una medida disciplinaria."],["The company reserves the right to modify this policy.","La empresa se reserva el derecho de modificar esta política."],["The submission of the form is mandatory.","La presentación del formulario es obligatoria."]]},
 {k:'note',type:'warn',h:'No exageres',t:'Un texto formal debe seguir siendo **claro**. Evitá frases larguísimas y palabras rebuscadas solo para sonar importante: en un comunicado para todo el personal conviene un tono formal pero simple.'},
 {k:'wrong',h:'Errores frecuentes',items:[["Employees must to submit the form.","Employees must submit the form.","Después de must va el verbo base, sin to."],["In case of you are absent, inform HR.","In the event of absence, inform HR.","«In case of» y «in the event of» van seguidos de un sustantivo, no de una oración."],["The informations are available on the intranet.","The information is available on the intranet.","Information es incontable: no lleva -s y el verbo va en singular."]]},
 {k:'phr',h:'Frases útiles',items:[["Please be advised that…","Se le informa que…"],["Failure to comply may result in…","El incumplimiento puede dar lugar a…"],["This policy comes into effect on…","Esta política entra en vigencia el…"],["In accordance with company policy,…","De acuerdo con la política de la empresa,…"],["Should you have any questions, please contact…","Ante cualquier consulta, comuníquese con…"],["The company reserves the right to…","La empresa se reserva el derecho de…"]]}
 ],
 check:[
 {q:'¿Cuál es la versión más formal?',o:['We need you to hand in the form.','Employees are required to submit the form.','Give us the form.','You gotta send the form.'],a:1,why:'«Are required to submit» es el registro propio de una política.'},
 {q:'Completá: «Failure ___ comply may result in disciplinary action.»',o:['to','of','for','with'],a:0,why:'Se dice «failure to + verbo».'},
 {q:'¿Qué opción usa bien la palabra information?',o:['The informations are on the intranet.','The information is on the intranet.','The informations is on the intranet.','The information are on the intranet.'],a:1,why:'Information es incontable: va en singular y sin -s.'},
 {q:'¿Qué sustantivo corresponde al verbo «decide»?',o:['decider','decisive','decision','deciding'],a:2,why:'Decide → decision.'},
 {q:'¿Cuál es la forma correcta después de must?',o:['Employees must to wear the badge.','Employees must wear the badge.','Employees must wearing the badge.','Employees must wears the badge.'],a:1,why:'Después de must va el verbo base.'},
 {q:'«This policy comes into effect on 1 March.» significa:',o:['La política termina el 1 de marzo','La política entra en vigencia el 1 de marzo','La política se discute el 1 de marzo','La política se publicó el 1 de marzo'],a:1,why:'«Come into effect» = entrar en vigencia.'}
 ]},
{id:'l20',n:20,t:'Registro y vocabulario preciso: inglés americano y británico',en:'Register and precise word choice',lvl:'C2',cat:'Vocabulario',
 goal:'Elegir la palabra justa según el registro y la variante del inglés.',
 why:'En RRHH una palabra mal elegida puede sonar amenazante, informal o confusa. Además, el inglés de EE. UU. y el británico usan términos distintos para conceptos laborales comunes.',
 blocks:[
 {k:'table',h:'Terminar un vínculo laboral: de informal a formal',head:['Expresión','Registro','Nota'],rows:[["to get fired / to get sacked","Informal","«Sacked» es sobre todo británico."],["to dismiss","Formal","Término general en documentos."],["to terminate","Muy formal o legal","Se usa en contratos y comunicaciones oficiales."],["to let go","Eufemismo","Muy usado en EE. UU. para suavizar el mensaje."],["to lay off","Neutro (EE. UU.)","Despido por razones económicas."],["to make redundant","Neutro (Reino Unido)","El puesto deja de ser necesario."]]},
 {k:'table',h:'Estados Unidos y Reino Unido',head:['EE. UU.','Reino Unido','Español'],rows:[["raise","pay rise","aumento de sueldo"],["vacation","holiday / annual leave","vacaciones"],["résumé (también CV)","CV","currículum"],["layoff","redundancy","despido por reducción o supresión de puestos (equivalente aproximado)"],["direct manager / supervisor","line manager","jefe directo"]]},
 {k:'rule',h:'Pay, salary, wage y compensation',t:'**Pay** es el término general. **Salary** es un monto fijo por mes o por año. **Wage** se calcula por hora o por semana. **Compensation** y **remuneration** son formales e incluyen bonos y beneficios.',
  ex:[["She earns a monthly salary of three thousand dollars.","Cobra un sueldo mensual de tres mil dólares."],["Wages are paid every week.","Los jornales se pagan todas las semanas."],["The compensation package includes health insurance.","El paquete de remuneración incluye cobertura de salud."]]},
 {k:'note',type:'tip',h:'En una conversación, suavizá',t:'Con la persona afectada evitá «fire» y «terminate»: suenan duros. Se suelen usar fórmulas como **«we have decided to end the employment relationship»** o, en EE. UU., **«we are letting you go»**.'},
 {k:'note',type:'info',h:'Mantené una sola variante',t:'Elegí **una** variante (americana o británica) y mantenela en todo el documento: no mezcles «vacation» con «annual leave» ni «raise» con «pay rise».'},
 {k:'wrong',h:'Errores frecuentes',items:[["We will fire you if you fail to comply.","Failure to comply may result in dismissal.","«Fire» es informal y amenazante. En un documento se usa «dismissal» o «termination of employment»."],["Her wage is 4,000 dollars per month.","Her salary is 4,000 dollars per month.","Un monto mensual fijo se llama salary; wage se asocia con pagos por hora o por semana."],["The company made forty employees redundant. (en un texto de EE. UU.)","The company laid off forty employees.","En EE. UU. se usa «lay off»; «redundant» es la forma británica."]]},
 {k:'phr',h:'Frases útiles',items:[["We regret to inform you that your position has been eliminated.","Lamentamos informarle que su puesto fue eliminado."],["The employment relationship will end on…","La relación laboral finalizará el…"],["Your last day of employment will be…","Su último día de trabajo será…"],["a mutually agreed departure","una salida acordada de común acuerdo"]]}
 ],
 check:[
 {q:'¿Cuál de estos verbos es el más formal?',o:['to sack','to fire','to terminate','to boot out'],a:2,why:'«Terminate» es propio de contratos y comunicaciones oficiales; los otros son informales.'},
 {q:'En el Reino Unido, un aumento de sueldo se llama normalmente:',o:['raise','pay rise','salary up','wage jump'],a:1,why:'«Pay rise» es la forma británica; «raise» es la americana.'},
 {q:'Un monto fijo mensual para personal administrativo es un:',o:['wage','salary','tip','fee'],a:1,why:'Salary es un monto fijo por mes o por año; wage se calcula por hora o por semana.'},
 {q:'«Redundancy» como despido se usa sobre todo en:',o:['EE. UU.','el Reino Unido','Argentina','ningún país de habla inglesa'],a:1,why:'Es el término británico para la pérdida del empleo porque el puesto deja de ser necesario.'},
 {q:'¿Cuál es la mejor opción en una política escrita?',o:["We'll fire you if you steal.","Theft may result in dismissal.","You'll be sacked for theft.","We'll kick you out for theft."],a:1,why:'Es la única opción con registro formal y neutral.'},
 {q:'«Wages» suele referirse a pagos:',o:['anuales fijos','por hora o por semana','solo en acciones','solo a gerentes'],a:1,why:'Wage se asocia con pagos por hora o por semana.'}
 ]},
{id:'l21',n:21,t:'Condicionales formales con inversión',en:'Formal conditionals with inversion',lvl:'C2',cat:'Gramática aplicada',
 goal:'Reemplazar «if» por una estructura invertida en comunicaciones escritas formales.',
 why:'En cartas, contratos y comunicados corporativos es muy común empezar con «Should you…», «Were the company to…» o «Had we…».',
 blocks:[
 {k:'rule',h:'Should: una posibilidad real',t:'**Should + sujeto + verbo base** reemplaza a «if + presente». Es muy formal y frecuente en correos corporativos.',
  ex:[["Should you require any further information, please contact HR.","Si necesitara más información, comuníquese con RRHH."],["Should the position become available, we will inform you immediately.","Si el puesto quedara disponible, se lo informaremos de inmediato."]]},
 {k:'rule',h:'Were … to: una situación hipotética',t:'**Were + sujeto + to + verbo** (o **Were + sujeto + adjetivo o sustantivo**) reemplaza a «if + pasado».',
  ex:[["Were the company to restructure, all affected employees would be notified in advance.","Si la empresa se reestructurara, se notificaría con anticipación a todo el personal afectado."],["Were I in your position, I would speak to the manager first.","Si yo estuviera en tu lugar, hablaría primero con el gerente."]]},
 {k:'rule',h:'Had: algo que no ocurrió en el pasado',t:'**Had + sujeto + participio** reemplaza a «if + past perfect» y se combina con **would have + participio**.',
  ex:[["Had we known about the problem earlier, we would have acted sooner.","Si hubiéramos sabido del problema antes, habríamos actuado antes."],["Had the candidate not withdrawn, we would have made an offer.","Si la persona candidata no se hubiera retirado, le habríamos hecho una oferta."]]},
 {k:'table',h:'Equivalencias',head:['Con if','Con inversión'],rows:[["If you require more information…","Should you require more information…"],["If the company were to restructure…","Were the company to restructure…"],["If we had known…","Had we known…"],["If we hadn't received your reply…","Had we not received your reply…"]]},
 {k:'note',type:'info',h:'Cuándo usarlos',t:'Son propios de la **escritura formal** y de las comunicaciones corporativas. En una conversación informal suenan rebuscados.'},
 {k:'note',type:'warn',h:'La negación va después del sujeto',t:'En la inversión con negación, **not** va después del sujeto: «Had we **not** received…». En textos formales se evita la contracción «Hadn\'t we received…».'},
 {k:'wrong',h:'Errores frecuentes',items:[["Should you will need help, call us.","Should you need help, call us.","Después de «Should» + sujeto va el verbo base, sin will."],["Were the company restructure, we would inform everyone.","Were the company to restructure, we would inform everyone.","Con «were» + sujeto hace falta «to» + verbo."],["Had we known earlier, we would act sooner.","Had we known earlier, we would have acted sooner.","El condicional de pasado necesita «would have» + participio."]]},
 {k:'phr',h:'Frases útiles',items:[["Should you have any questions, please do not hesitate to contact us.","Si tuviera alguna consulta, no dude en comunicarse con nosotros."],["Should the need arise,…","Si surgiera la necesidad,…"],["Were that to happen,…","Si eso ocurriera,…"],["Had it not been for your support,…","De no haber sido por su apoyo,…"],["Were you to accept the offer,…","Si usted aceptara la oferta,…"]]}
 ],
 check:[
 {q:'«Should you need help, call HR.» equivale a:',o:['If you need help, call HR.','If you needed help yesterday, call HR.','If you had needed help, call HR.','Unless you need help, call HR.'],a:0,why:'«Should + sujeto + verbo base» reemplaza a «if + presente».'},
 {q:'Completá: «___ the company to restructure, we would inform everyone.»',o:['Should','Were','Had','Would'],a:1,why:'«Were + sujeto + to + verbo» reemplaza a «if + pasado».'},
 {q:'Completá: «___ we known earlier, we would have acted.»',o:['Were','Should','Had','Did'],a:2,why:'«Had + sujeto + participio» reemplaza a «if + past perfect».'},
 {q:'¿Qué opción usa bien la inversión con Should?',o:['Should you will need help, call us.','Should you need help, call us.','Should you needing help, call us.','Should you to need help, call us.'],a:1,why:'Después de «Should» + sujeto va el verbo base.'},
 {q:'¿Qué significa «Had it not been for your help, we would have failed»?',o:['Gracias a tu ayuda, no fracasamos','Si no ayudás, vamos a fracasar','Tu ayuda nos hizo fracasar','No necesitamos ayuda'],a:0,why:'«Had it not been for» = de no haber sido por.'},
 {q:'¿En qué contexto es más apropiada la inversión condicional?',o:['Un mensaje de WhatsApp a un amigo','Un comunicado formal a todo el personal','Un chiste en una reunión','Una charla informal en el pasillo'],a:1,why:'Es una estructura propia de la escritura formal.'}
 ]},
{id:'l22',n:22,t:'Matizar y argumentar: concesión y contraste',en:'Concession and nuance',lvl:'C2',cat:'Comunicación',
 goal:'Reconocer un punto, marcar contrastes y sostener un argumento con matices.',
 why:'Los informes para la dirección y las reuniones de negociación exigen reconocer lo que es cierto de la otra postura y, aun así, defender la propia.',
 blocks:[
 {k:'rule',h:'Reconocer un punto y seguir con tu argumento',t:'**Although / though / even though** + oración completa. **Despite / in spite of** + sustantivo o -ing (con una oración completa: **despite the fact that**).',
  ex:[["Although turnover has decreased, engagement remains low.","Aunque la rotación bajó, el compromiso sigue siendo bajo."],["Despite the budget cuts, we maintained the training program.","A pesar de los recortes de presupuesto, mantuvimos el programa de capacitación."],["In spite of working remotely, the team met every deadline.","A pesar de trabajar de forma remota, el equipo cumplió todos los plazos."]]},
 {k:'rule',h:'Conectores formales de contraste',t:'**However, nevertheless y nonetheless** conectan dos oraciones y van seguidos de coma. **Whereas** y **while** contrastan dos hechos dentro de una oración. **Albeit** introduce una concesión breve, sin verbo conjugado. **Notwithstanding** es muy formal.',
  ex:[["The proposal is costly; nevertheless, it is worth considering.","La propuesta es costosa; aun así, vale la pena considerarla."],["Sales grew by ten percent, whereas costs remained stable.","Las ventas crecieron un diez por ciento, mientras que los costos se mantuvieron estables."],["The training was brief, albeit effective.","La capacitación fue breve, aunque eficaz."],["Notwithstanding the delay, the project was approved.","Pese a la demora, el proyecto fue aprobado."]]},
 {k:'table',h:'Qué viene después de cada conector',head:['Conector','Después va…','Ejemplo'],rows:[["although / even though","una oración completa","Although she was late, she apologized."],["despite / in spite of","un sustantivo o -ing","Despite the delay, we finished."],["however / nevertheless","coma; une dos oraciones","…; however, we must act."],["whereas / while","una oración; contrasta dos hechos","Whereas A rose, B fell."],["albeit","una palabra o frase breve","a small albeit significant change"]]},
 {k:'note',type:'tip',h:'Reconocer y matizar',t:'Para admitir algo y luego marcar el límite, usá **Granted,** y **That said,**: «Granted, the cost is high. That said, the benefits outweigh it.»'},
 {k:'wrong',h:'Errores frecuentes',items:[["Despite of the delay, we finished.","Despite the delay, we finished. / In spite of the delay, we finished.","Se dice «despite» o «in spite of», pero no «despite of»."],["Although the delay, we finished.","Although there was a delay, we finished. / Despite the delay, we finished.","Although necesita una oración completa; con un sustantivo solo se usa despite."],["Although she was tired, but she finished.","Although she was tired, she finished.","No se usa «but» junto con «although»."]]},
 {k:'phr',h:'Frases útiles',items:[["Granted,…","Es cierto que…"],["That said,…","Dicho esto,…"],["On the one hand,… on the other hand,…","Por un lado,… por otro,…"],["Be that as it may,…","Sea como fuere,…"],["It could be argued that…","Se podría argumentar que…"],["Notwithstanding…","Pese a…"]]}
 ],
 check:[
 {q:'Completá: «___ the budget cuts, we kept the program.»',o:['Although','Despite','However','Whereas'],a:1,why:'Despite va seguido de un sustantivo («the budget cuts»).'},
 {q:'¿Qué oración usa bien although?',o:['Although she was tired, but she finished.','Although she was tired, she finished.','Despite she was tired, she finished.','In spite she was tired, she finished.'],a:1,why:'Although + oración, sin «but». Despite e in spite of necesitan un sustantivo o -ing.'},
 {q:'«The course was short, albeit effective.» significa:',o:['El curso fue corto, aunque eficaz','El curso fue largo y eficaz','El curso fue corto porque era eficaz','El curso no fue eficaz'],a:0,why:'«Albeit» introduce una concesión breve: aunque.'},
 {q:'¿Qué conector contrasta dos hechos dentro de una misma oración?',o:['whereas','nevertheless','however','furthermore'],a:0,why:'Whereas (y while) contrastan dos hechos dentro de una oración; however y nevertheless unen dos oraciones y furthermore suma información.'},
 {q:'«Despite of the delay…» es incorrecta porque:',o:['despite no lleva «of»','despite va con verbo','falta una coma','se debe usar although'],a:0,why:'Se dice «despite» o «in spite of», nunca «despite of».'},
 {q:'¿Qué expresiones sirven para reconocer un punto y luego matizarlo?',o:['Granted, … That said, …','Moreover, … Furthermore, …','Firstly, … Finally, …','In conclusion, … Therefore, …'],a:0,why:'Granted admite el punto y That said introduce el matiz.'}
 ]}
);

/* los nodos vacíos (null, undefined, false) no deben mostrarse como texto */
(()=>{const f=a=>a.flat(2).filter(x=>x!=null&&x!==false);['replaceChildren','append','prepend'].forEach(n=>{const o=Element.prototype[n];Element.prototype[n]=function(...k){return o.apply(this,f(k))}})})();
'use strict';
/* ===== Núcleo: utilidades, estado, voz, íconos, Claude ===== */
const app=document.getElementById('app');
const h=(tag,attrs,...kids)=>{
 const e=document.createElement(tag);
 if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
  else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
 const add=c=>{if(c==null||c===false)return;if(Array.isArray(c))c.forEach(add);else e.append(c.nodeType?c:document.createTextNode(String(c)))};
 kids.forEach(add);return e;
};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const low1=s=>s.charAt(0).toLowerCase()+s.slice(1);
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9áéíóúñü' ]+/g,' ').replace(/\s+/g,' ').trim();
const rich=t=>String(t).split(/\*\*(.+?)\*\*/).map((x,i)=>i%2?h('b',null,x):x);
const normEn=s=>norm(s).replace(/^(to|a|an|the) /,'');
